};

/* ---- pools de entidades ---- */
const ORB_MAX = 64, SHOT_MAX = 80;
for (let i = 0; i < ORB_MAX; i++) G.orbs.push({ on: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, val: 1, t: 0 });
for (let i = 0; i < SHOT_MAX; i++) G.shots.push({ on: false, x: 0, y: 0, vx: 0, vy: 0, r: 6, life: 0, dmg: 8, kind: 0, col: PAL.crimson, spin: 0 });

function spawnOrb(x, y, val) {
  for (let i = 0; i < ORB_MAX; i++) {
    const o = G.orbs[i];
    if (o.on) continue;
    o.on = true; o.x = x; o.y = y; o.vx = rnd(-2.2, 2.2); o.vy = rnd(-4.4, -1.6);
    o.life = 600; o.val = val || 1; o.t = 0;
    return o;
  }
  return null;
}

function spawnShot(x, y, vx, vy, dmg, kind, col, r) {
  for (let i = 0; i < SHOT_MAX; i++) {
    const s = G.shots[i];
    if (s.on) continue;
    s.on = true; s.x = x; s.y = y; s.vx = vx; s.vy = vy;
    s.dmg = dmg; s.kind = kind || 0; s.col = col || PAL.crimson; s.r = r || 6;
    s.life = 200; s.spin = 0;
    return s;
  }
  return null;
}

/* ---- fisica compartilhada ---- */

/**
 * Move a entidade e resolve colisao com as plataformas do nivel, eixo por eixo.
 * Espera ent = {x,y,w,h,vx,vy,onGround,...}. Plataformas 'oneway' so' colidem
 * quando a entidade esta' caindo e vinha de cima.
 */
function moveAndCollide(ent, plats) {
  ent.onGround = false;
  ent.hitWall = 0;

  // eixo X
  ent.x += ent.vx;
  for (let i = 0; i < plats.length; i++) {
    const p = plats[i];
    if (p.oneway || p.dead) continue;
    if (!aabb(ent.x, ent.y, ent.w, ent.h, p.x, p.y, p.w, p.h)) continue;
    if (ent.vx > 0) { ent.x = p.x - ent.w; ent.hitWall = 1; }
    else if (ent.vx < 0) { ent.x = p.x + p.w; ent.hitWall = -1; }
    ent.vx = 0;
  }

  // eixo Y
  const prevBottom = ent.y + ent.h;
  ent.y += ent.vy;
  for (let i = 0; i < plats.length; i++) {
    const p = plats[i];
    if (p.dead) continue;
    if (!aabb(ent.x, ent.y, ent.w, ent.h, p.x, p.y, p.w, p.h)) continue;
    if (p.oneway) {
      // plataforma travessavel: so' segura quem vem de cima e nao esta' descendo de proposito
      if (ent.vy < 0) continue;
      if (prevBottom > p.y + 6) continue;
      if (ent.dropThrough > 0) continue;
    }
    if (ent.vy > 0) { ent.y = p.y - ent.h; ent.onGround = true; ent.standing = p; }
    else if (ent.vy < 0) { ent.y = p.y + p.h; }
    ent.vy = 0;
  }

  // limites do mundo
  if (ent.x < 0) { ent.x = 0; ent.vx = 0; }
  const W = G.level ? G.level.width : RW;
  if (ent.x + ent.w > W) { ent.x = W - ent.w; ent.vx = 0; }
}

/* ==========================================================================================
   CINZA  -  o cavaleiro amaldicoado
   ========================================================================================== */

/** Tabela de golpes. `active` = janela de frames em que a hitbox existe. */
const ATTACKS = {
  a1:    { dur: 17, active: [4, 9],   reach: 54, h: 42, dmg: 1.00, kx: 3.6, ky: -1.4, hs: CFG.hitstopLight, lunge: 2.4, arc: -0.5 },
  a2:    { dur: 19, active: [5, 11],  reach: 58, h: 46, dmg: 1.15, kx: 4.4, ky: -2.0, hs: CFG.hitstopLight, lunge: 2.8, arc: 0.6 },
  a3:    { dur: 30, active: [9, 18],  reach: 78, h: 62, dmg: 1.95, kx: 8.5, ky: -6.8, hs: CFG.hitstopHeavy, lunge: 4.2, arc: 0.0 },
  a4:    { dur: 26, active: [7, 15],  reach: 70, h: 58, dmg: 1.60, kx: 6.0, ky: -3.0, hs: CFG.hitstopLight, lunge: 3.6, arc: 1.2 },
  air:   { dur: 24, active: [4, 13],  reach: 64, h: 54, dmg: 1.25, kx: 2.6, ky: -3.4, hs: CFG.hitstopLight, lunge: 1.2, arc: 0.3 },
  heavy: { dur: 40, active: [13, 24], reach: 98, h: 84, dmg: 3.30, kx: 11.5, ky: -8.0, hs: 8,               lunge: 5.0, arc: 0.0 }
};

class Player {
  constructor(x, y) {
    this.w = 26; this.h = 44;
    this.x = x; this.y = y;
    this.vx = 0; this.vy = 0;
    this.facing = 1;
    this.onGround = false; this.standing = null;
    this.dropThrough = 0;
    this.coyote = 0; this.jumpBuf = 0; this.jumps = 0;
    this.state = 'IDLE'; this.stateT = 0;
    this.anim = 0;
    this.maxHp = CFG.baseHealth + SAVE.upgrades.health * 25;
    this.hp = this.maxHp;
    this.fury = 0;
    this.invuln = 0;
    this.iframes = 0;
    this.dashCD = 0; this.dashT = 0; this.dashDX = 1; this.dashDY = 0;
    this.atk = null; this.atkT = 0; this.atkStep = 0; this.atkHit = null;
    this.bufTimer = 0;        // input buffer do combo
    this.chargeT = 0; this.charged = false;
    this.gliding = false;
    this.hurtT = 0;
    this.dead = false;
    this.trail = [];
    for (let i = 0; i < 16; i++) this.trail.push({ x: x, y: y, a: 0 });
    this.trailI = 0;
    this.chain = { state: 'idle', x: 0, y: 0, vx: 0, vy: 0, t: 0, target: null, hook: null, cd: 0, ang: 0 };
    this.bike = null;         // preenchido na fase da moto
    this.furyT = 0;
    this.lastHitT = 0;
    this.landT = 0;
  }

  get cx() { return this.x + this.w / 2; }
  get cy() { return this.y + this.h / 2; }

  /** Dano base do jogador, ja' com upgrades aplicados. */
  get damage() { return CFG.baseDamage + SAVE.upgrades.damage * 3.5; }
  get chainRange() { return CFG.chainRange + SAVE.upgrades.chain * 55; }
  get furyDur() { return CFG.furyDur + SAVE.upgrades.fury * 22; }
  get comboMax() { return SAVE.upgrades.combo > 0 ? 4 : 3; }

  setState(s) {
    if (this.state === s) return;
    this.state = s; this.stateT = 0;
  }

  /* ---------------- update ---------------- */
  update() {
    if (this.dead) { this.updateDeath(); return; }

    this.stateT++; this.anim++;
    if (this.invuln > 0) this.invuln--;
    if (this.iframes > 0) this.iframes--;
    if (this.dashCD > 0) this.dashCD--;
    if (this.bufTimer > 0) this.bufTimer--;
    if (this.chain.cd > 0) this.chain.cd--;
    if (this.dropThrough > 0) this.dropThrough--;
    if (this.hurtT > 0) this.hurtT--;
    if (this.landT > 0) this.landT--;

    const lvl = G.level;
    const onIce = lvl && lvl.ice;

    // ---- corrente tem prioridade de estado (grapple move o player) ----
    this.updateChain();

    // ---- entradas ----
    const bAtk = IN.btn.attack, bJmp = IN.btn.jump, bChn = IN.btn.chain, bFur = IN.btn.fury;

    if (bJmp.pressed) this.jumpBuf = CFG.jumpBuffer;
    if (this.jumpBuf > 0) this.jumpBuf--;

    // Furia
    if (bFur.pressed && this.fury >= CFG.furyMax && !G.qte) this.triggerFury();

    // Corrente
    if (bChn.pressed && this.chain.state === 'idle' && this.chain.cd <= 0 && this.state !== 'HURT') {
      this.fireChain();
    }

    // Ataque: toque = combo, segurar = pesado carregado
    if (bAtk.down && this.canAct()) {
      this.chargeT++;
      if (this.chargeT === 26) { AUD.heavyCharge(); this.charged = true; }
      if (this.charged && this.chargeT % 4 === 0) {
        burstEmbers(this.cx + this.facing * 14, this.cy, 2, 1.4, PAL.ember);
      }
    }
    if (bAtk.pressed) this.bufTimer = CFG.inputBuffer;
    if (bAtk.released) {
      if (this.charged) { this.startAttack('heavy'); this.charged = false; this.chargeT = 0; }
      else if (this.chargeT < 26 && this.bufTimer > 0) { this.tryComboStep(); }
      this.chargeT = 0; this.charged = false;
    }
    // Buffer sobrevivente: se soltou cedo e o golpe atual acabou, encadeia
    if (!bAtk.down && this.bufTimer > 0 && this.state !== 'ATTACK' && this.canAct()) this.tryComboStep();

    // Esquiva
    if (IN.dashReq && this.dashCD <= 0 && this.state !== 'GRAB' && this.hurtT <= 0) this.startDash();

    // ---- maquina de estados ----
    switch (this.state) {
      case 'DASH':   this.updateDash(); break;
      case 'ATTACK': this.updateAttack(onIce); break;
      case 'HURT':   this.updateHurt(); break;
      case 'GRAB':   this.updateGrab(); break;
      default:       this.updateFree(onIce); break;
    }

    // ---- pulo ----
    if (this.state !== 'GRAB' && this.state !== 'HURT') {
      if (this.onGround) { this.coyote = CFG.coyote; this.jumps = 0; }
      else if (this.coyote > 0) this.coyote--;

      if (this.jumpBuf > 0) {
        if (this.coyote > 0 && this.jumps === 0) {
          this.vy = CFG.jumpVel; this.jumps = 1; this.coyote = 0; this.jumpBuf = 0;
          AUD.jump(); burstEmbers(this.cx, this.y + this.h, 8, 2.2, PAL.orange);
          if (this.state === 'ATTACK') this.endAttack();
          this.setState('JUMP');
        } else if (this.jumps === 1 && !this.onGround) {
          this.vy = CFG.doubleJumpVel; this.jumps = 2; this.jumpBuf = 0;
          AUD.jump();
          ringFx(this.cx, this.cy + 8, 26, PAL.orange, 18);
          burstEmbers(this.cx, this.y + this.h, 14, 3.2, PAL.ember);
          if (this.state === 'ATTACK') this.endAttack();
          this.setState('JUMP');
        }
      }
      // Planar: segurar PULO no ar depois do apice
      this.gliding = !this.onGround && bJmp.down && this.vy > 0.8 && this.jumps > 0 && this.state !== 'ATTACK';
      if (this.gliding) {
        this.vy = Math.min(this.vy, CFG.glideFall);
        if (G.gt % 3 === 0) {
          burstEmbers(this.cx - this.facing * 12, this.cy - 4, 2, 1.2, PAL.orange);
        }
      }
    }

    // ---- gravidade + colisao ----
    if (this.state !== 'GRAB') {
      const g = this.gliding ? CFG.gravity * 0.35 : CFG.gravity;
      this.vy = Math.min(this.vy + g, this.gliding ? CFG.glideFall : CFG.maxFall);
      // Vento do circulo da Luxuria
      if (lvl && lvl.wind) this.vx += lvl.windForce;
      const wasAir = !this.onGround;
      moveAndCollide(this, lvl.plats);
      if (this.onGround && wasAir && this.vy >= 0) {
        this.landT = 8;
        if (this.state === 'JUMP' || this.state === 'FALL') this.setState('IDLE');
        AUD.land();
        burstSmoke(this.cx, this.y + this.h, 3, '#22181a');
        burstEmbers(this.cx, this.y + this.h, 6, 1.8, PAL.orange);
      }
    }

    // ---- estado visual livre ----
    if (this.state === 'IDLE' || this.state === 'RUN' || this.state === 'JUMP' || this.state === 'FALL') {
      if (!this.onGround) this.setState(this.vy < 0 ? 'JUMP' : 'FALL');
      else this.setState(Math.abs(this.vx) > 0.6 ? 'RUN' : 'IDLE');
    }

    // ---- perigos do cenario ----
    this.checkHazards();

    // ---- queda no vazio ----
    if (this.y > RH + 420) this.takeDamage(28, 0, true);

    // ---- rastro de fogo ----
    const tr = this.trail[this.trailI];
    tr.x = this.cx; tr.y = this.cy; tr.a = 1;
    this.trailI = (this.trailI + 1) % this.trail.length;

    // brasas constantes do corpo em chamas
    if (G.gt % 3 === 0) {
      emit(PT.FLAME, this.cx + rnd(-7, 7), this.y + rnd(2, this.h),
           rnd(-0.3, 0.3), rnd(-1.6, -0.6), rndi(12, 24), rnd(1.6, 3.4),
           Math.random() < 0.5 ? PAL.orange : PAL.ember, { drag: 0.94, grav: -0.02 });
    }

    // ---- furia ativa ----
    if (this.furyT > 0) this.updateFuryBeam();
  }

  canAct() {
    return this.state !== 'HURT' && this.state !== 'DASH' && this.state !== 'GRAB' && !this.dead && !G.qte;
  }

  /* ---------------- movimento livre ---------------- */
  updateFree(onIce) {
    const accel = this.onGround ? CFG.runAccel : CFG.airAccel;
    const fric = onIce ? CFG.iceFriction : (this.onGround ? CFG.friction : 0.94);
    const target = IN.mx * CFG.runSpeed;
    if (Math.abs(IN.mx) > 0.08) {
      this.vx = approach(this.vx, target, accel);
      if (Math.abs(IN.mx) > 0.3) this.facing = IN.mx > 0 ? 1 : -1;
    } else {
      this.vx *= fric;
      if (Math.abs(this.vx) < 0.05) this.vx = 0;
    }
    // Descer de plataforma travessavel: baixo + pulo
    if (IN.my > 0.6 && IN.btn.jump.pressed && this.onGround) { this.dropThrough = 8; this.y += 3; }
  }

  /* ---------------- dash ---------------- */
  startDash() {
    let dx = IN.mx, dy = IN.my;
    if (Math.abs(dx) < 0.2 && Math.abs(dy) < 0.2) { dx = this.facing; dy = 0; }
    const m = Math.hypot(dx, dy) || 1;
    this.dashDX = dx / m; this.dashDY = (dy / m) * 0.55;
    this.dashT = CFG.dashFrames;
    this.iframes = CFG.dashIFrames;
    this.dashCD = CFG.dashCooldown;
    if (Math.abs(dx) > 0.2) this.facing = dx > 0 ? 1 : -1;
    this.endAttack();
    this.setState('DASH');
    AUD.dash();
    vibrate(14);
    for (let i = 0; i < 12; i++) {
      emit(PT.FLAME, this.cx, this.cy + rnd(-16, 16), -this.dashDX * rnd(1, 4), rnd(-1, 1),
           rndi(14, 26), rnd(3, 7), PAL.orange, { drag: 0.9 });
    }
    ringFx(this.cx, this.cy, 20, PAL.ember, 14);
  }

  updateDash() {
    this.dashT--;
    this.vx = this.dashDX * CFG.dashSpeed;
    this.vy = this.dashDY * CFG.dashSpeed;
    if (G.gt % 2 === 0) {
      emit(PT.FLAME, this.cx, this.cy, rnd(-0.4, 0.4), rnd(-0.4, 0.4), 16, rnd(6, 11),
           PAL.orange, { drag: 0.9 });
    }
    if (this.dashT <= 0) {
      this.vx *= 0.45; this.vy *= 0.3;
      this.setState(this.onGround ? 'IDLE' : 'FALL');
    }
  }

  /* ---------------- combate ---------------- */
  tryComboStep() {
    if (!this.canAct()) return;
    // Golpe em andamento: mantem o buffer vivo. Ele e' consumido no fim do
    // golpe atual (updateAttack), que e' exatamente o que encadeia o combo.
    if (this.state === 'ATTACK') return;
    this.bufTimer = 0;
    if (!this.onGround) { this.startAttack('air'); return; }
    this.atkStep = (this.atkStep % this.comboMax) + 1;
    const names = ['a1', 'a2', 'a3', 'a4'];
    this.startAttack(names[this.atkStep - 1]);
  }

  startAttack(key) {
    const a = ATTACKS[key];
    if (!a) return;
    this.atk = a; this.atkKey = key; this.atkT = 0;
    this.atkHit = this.atkHit || new Set();
    this.atkHit.clear();
    this.setState('ATTACK');
    if (key === 'heavy') { AUD.slash(3); AUD.hit(true); this.atkStep = 0; }
    else if (key === 'air') AUD.slash(1);
    else AUD.slash(this.atkStep - 1);
    if (key === 'a1') this.atkStep = 1;
    // lunge para frente da' peso ao golpe
    this.vx += this.facing * a.lunge;
    vibrate(key === 'heavy' ? 26 : 10);
  }

  endAttack() {
    if (this.state === 'ATTACK') this.setState(this.onGround ? 'IDLE' : 'FALL');
    this.atk = null; this.atkT = 0;
  }

  updateAttack(onIce) {
    const a = this.atk;
    if (!a) { this.endAttack(); return; }
    this.atkT++;
    // controle reduzido durante o golpe
    if (this.onGround) this.vx *= onIce ? 0.985 : 0.86;
    else { this.vx = approach(this.vx, IN.mx * CFG.runSpeed * 0.6, 0.2); }

    if (this.atkT >= a.active[0] && this.atkT <= a.active[1]) this.attackHitbox(a);

    if (this.atkT >= a.dur) {
      const buffered = this.bufTimer > 0;
      this.endAttack();                 // sai do estado ATTACK antes de encadear
      if (buffered) this.tryComboStep();
      else if (this.atkStep >= this.comboMax) this.atkStep = 0;  // combo expira
    }
  }

  /** Resolve a hitbox do golpe atual contra inimigos e boss. */
  attackHitbox(a) {
    const hx = this.facing > 0 ? this.x + this.w - 6 : this.x - a.reach + 6;
    const hy = this.cy - a.h / 2;
    const dmg = this.damage * a.dmg;
    let hitAny = false;

    for (let i = 0; i < G.enemies.length; i++) {
      const e = G.enemies[i];
      if (!e.alive || e.souling) continue;
      if (this.atkHit.has(e.id)) continue;
      if (!aabb(hx, hy, a.reach, a.h, e.x, e.y, e.w, e.h)) continue;
      this.atkHit.add(e.id);
      hitAny = true;
      const air = !this.onGround;
      damageEnemy(e, dmg, this.facing * a.kx, air ? -3.2 : a.ky, {
        hitstop: a.hs, shake: a.dmg * 0.16, juggle: air
      });
    }
    if (hitAny) {
      const px = this.facing > 0 ? this.x + this.w + a.reach * 0.4 : this.x - a.reach * 0.4;
      burstSparks(px, this.cy, 10, this.facing, -0.4, 6, PAL.ember);
    }
  }

  /* ---------------- corrente flamejante ---------------- */
  fireChain() {
    const c = this.chain;
    let dx = this.facing, dy = 0;
    // mira analogica: inclinar o joystick muda o angulo da corrente
    if (Math.abs(IN.my) > 0.45) { dy = IN.my > 0 ? 0.75 : -0.75; dx = Math.abs(IN.mx) > 0.2 ? sign(IN.mx) : this.facing; }
    else if (Math.abs(IN.mx) > 0.35) dx = sign(IN.mx);
    const m = Math.hypot(dx, dy) || 1;
    c.state = 'out';
    c.x = this.cx + dx / m * 16; c.y = this.cy + dy / m * 16;
    c.vx = dx / m * 24; c.vy = dy / m * 24;
    c.t = 0; c.target = null; c.hook = null;
    this.facing = dx >= 0 ? 1 : -1;
    AUD.chainFire();
    vibrate(16);
  }

  /**
   * Testa a ponta da corrente contra inimigos, ganchos e paredes.
   * Devolve true quando a corrente engatou em algo (o chamador deve parar).
   */
  chainProbe() {
    const c = this.chain;

    // inimigo
    for (let i = 0; i < G.enemies.length; i++) {
      const e = G.enemies[i];
      if (!e.alive || e.souling) continue;
      if (!aabb(c.x - 9, c.y - 9, 18, 18, e.x, e.y, e.w, e.h)) continue;
      c.target = e;
      AUD.chainHit();
      damageEnemy(e, this.damage * 0.55, sign(c.vx) * 1.5, -1.2, { hitstop: 3, shake: 0.1, chain: true });
      if (e.heavy) {
        // Pesado: CINZA e' puxado ate' o inimigo, e a corrente abre a guarda
        c.state = 'pullme';
        c.t = 0;
        this.setState('GRAB');
        if (e.shield) e.breakShield();
      } else {
        // Leve: o inimigo vem ate' CINZA
        c.state = 'pullthem';
        e.pulled = 16; e.stun = 34;
      }
      ringFx(c.x, c.y, 22, PAL.orange, 16);
      burstSparks(c.x, c.y, 12, -sign(c.vx), 0, 5, PAL.ember);
      return true;
    }

    // ponto de gancho do cenario
    const hooks = G.level.hooks;
    for (let i = 0; i < hooks.length; i++) {
      const h = hooks[i];
      if (dist2(c.x, c.y, h.x, h.y) > 32 * 32) continue;
      c.hook = h; c.state = 'pullme'; c.t = 0;
      this.setState('GRAB');
      AUD.chainHit();
      ringFx(h.x, h.y, 26, PAL.ember, 20);
      return true;
    }

    // parede
    const plats = G.level.plats;
    for (let i = 0; i < plats.length; i++) {
      const p = plats[i];
      if (p.oneway || p.dead) continue;
      if (c.x > p.x && c.x < p.x + p.w && c.y > p.y && c.y < p.y + p.h) {
        c.state = 'retract';
        burstSparks(c.x, c.y, 8, -sign(c.vx), 0, 4, PAL.ember);
        return true;
      }
    }
    return false;
  }

  updateChain() {
    const c = this.chain;
    if (c.state === 'idle') return;

    if (c.state === 'out') {
      c.t++;
      // A ponta anda 24px por passo: sem sub-passos ela atravessaria alvos e
      // ganchos menores que isso. Tres sub-passos por quadro resolvem o
      // tunelamento sem mudar a velocidade percebida.
      const SUB = 3;
      for (let s = 0; s < SUB; s++) {
        c.x += c.vx / SUB; c.y += c.vy / SUB;
        if (this.chainProbe()) return;
      }
      // fogo ao longo da corrente
      if (G.gt % 2 === 0) emit(PT.FLAME, c.x, c.y, rnd(-.4, .4), rnd(-.8, -.1), 14, rnd(2.5, 5), PAL.orange, { drag: .92 });

      // bateu em parede ou estourou o alcance
      if (dist2(c.x, c.y, this.cx, this.cy) > this.chainRange * this.chainRange || c.t > 40) {
        c.state = 'retract';
      }
      return;
    }

    if (c.state === 'pullthem') {
      const e = c.target;
      if (!e || !e.alive) { c.state = 'retract'; return; }
      const tx = this.cx + this.facing * 44;
      e.x = lerp(e.x, tx - e.w / 2, 0.34);
      e.y = lerp(e.y, this.cy - e.h / 2, 0.22);
      e.vx = 0; e.vy = 0;
      c.x = e.x + e.w / 2; c.y = e.y + e.h / 2;
      if (G.gt % 2 === 0) emit(PT.FLAME, c.x, c.y, rnd(-1, 1), rnd(-1, 0), 12, 4, PAL.orange, { drag: .9 });
      if (--e.pulled <= 0) { c.state = 'retract'; }
      return;
    }

    if (c.state === 'pullme') {
      const tx = c.hook ? c.hook.x : (c.target ? c.target.x + c.target.w / 2 : this.cx);
      const ty = c.hook ? c.hook.y : (c.target ? c.target.y + c.target.h / 2 : this.cy);
      const dx = tx - this.cx, dy = ty - this.cy;
      const d = Math.hypot(dx, dy) || 1;
      const sp = 15;
      this.x += dx / d * Math.min(sp, d);
      this.y += dy / d * Math.min(sp, d);
      this.vx = dx / d * 6; this.vy = dy / d * 4;
      this.facing = dx >= 0 ? 1 : -1;
      c.x = tx; c.y = ty;
      emit(PT.FLAME, this.cx, this.cy, rnd(-1, 1), rnd(-1, 1), 12, rnd(4, 8), PAL.orange, { drag: .9 });
      if (d < 46 || c.t++ > 44) {
        c.state = 'retract';
        this.setState('FALL');
        this.vy = -5.4;
        if (c.target && c.target.alive) {
          damageEnemy(c.target, this.damage * 0.8, this.facing * 3, -3, { hitstop: 5, shake: 0.2 });
        }
      }
      return;
    }

    if (c.state === 'retract') {
      const dx = this.cx - c.x, dy = this.cy - c.y;
      const d = Math.hypot(dx, dy) || 1;
      c.x += dx / d * 34; c.y += dy / d * 34;
      if (d < 34) { c.state = 'idle'; c.cd = 14; c.target = null; c.hook = null; if (this.state === 'GRAB') this.setState('FALL'); }
    }
  }

  updateGrab() { /* movimento e' conduzido por updateChain/pullme */ }

  /* ---------------- Olhar de Penitencia ---------------- */
  triggerFury() {
    this.fury = 0;
    this.furyT = this.furyDur;
    G.negative = 1;
    freeze(10);
    cam.shake(0.85);
    cam.tzoom = 1.14;
    AUD.fury();
    vibrate([30, 40, 60]);
    floatText(this.cx, this.y - 26, 'OLHAR DE PENITENCIA', PAL.crimson, 20);
    // trava todos os inimigos na linha de visao
    for (let i = 0; i < G.enemies.length; i++) {
      const e = G.enemies[i];
      if (!e.alive) continue;
      if (Math.abs(e.cy - this.cy) > 150) continue;
      if (dist(e.cx, e.cy, this.cx, this.cy) > 460) continue;
      e.penitent = this.furyT;
      e.stun = this.furyT + 20;
    }
    ringFx(this.cx, this.cy, 40, PAL.crimson, 40);
    soulPuff(this.cx, this.cy, 30, PAL.crimson);
  }

  updateFuryBeam() {
    this.furyT--;
    G.negative = clamp(this.furyT / 30, 0, 1);
    if (this.furyT % 6 === 0) {
      for (let i = 0; i < G.enemies.length; i++) {
        const e = G.enemies[i];
        if (!e.alive || !e.penitent) continue;
        damageEnemy(e, this.damage * 0.9, 0, -0.6, { hitstop: 0, shake: 0.06, silent: true });
        burstSparks(e.cx, e.cy, 4, 0, -1, 4, PAL.crimson);
      }
      cam.shake(0.12);
    }
    if (this.furyT % 3 === 0) {
      emit(PT.RING, this.cx, this.cy, 0, 0, 22, 30 + rnd(0, 40), PAL.crimson, { drag: 1 });
    }
    if (this.furyT <= 0) {
      // detonacao final em area
      cam.shake(0.7); freeze(6); cam.tzoom = 1;
      AUD.hit(true);
      for (let i = 0; i < G.enemies.length; i++) {
        const e = G.enemies[i];
        if (!e.alive || !e.penitent) continue;
        e.penitent = 0;
        damageEnemy(e, this.damage * 4.5, sign(e.cx - this.cx) * 9, -7, { hitstop: 4, shake: 0.3 });
      }
      G.whiteFlash = 0.8;
      burstEmbers(this.cx, this.cy, 40, 7, PAL.crimson);
      ringFx(this.cx, this.cy, 200, PAL.crimson, 30);
    }
  }

  /* ---------------- dano recebido ---------------- */
  takeDamage(dmg, dirX, forceRespawn) {
    if (this.dead) return;
    if (this.iframes > 0 || this.invuln > 0) return;
    if (this.furyT > 0) dmg *= 0.4;
    this.hp -= dmg;
    this.fury = Math.min(CFG.furyMax, this.fury + dmg * 0.9);
    this.invuln = CFG.invulnAfterHit;
    this.hurtT = 16;
    this.setState('HURT');
    this.vx = (dirX || -this.facing) * 5.4;
    this.vy = -4.6;
    G.damageFx = 1;
    G.combo = 0; G.comboTimer = 0;
    cam.shake(0.5);
    freeze(5);
    AUD.hurt();
    vibrate([18, 30, 18]);
    burstBlood(this.cx, this.cy, 14, dirX || -this.facing);
    burstEmbers(this.cx, this.cy, 12, 3.4, PAL.crimson);
    floatText(this.cx, this.y - 10, '-' + Math.round(dmg), PAL.crimson, 15);
    if (forceRespawn) this.respawnAtSafe();
    if (this.hp <= 0) this.die();
  }

  /** Devolve o jogador ao ultimo chao seguro (queda no vazio / lava). */
  respawnAtSafe() {
    const s = G.level.safeX !== undefined ? G.level.safeX : 60;
    this.x = clamp(this.lastSafeX !== undefined ? this.lastSafeX : s, 20, G.level.width - 40);
    this.y = (this.lastSafeY !== undefined ? this.lastSafeY : G.level.groundY - 80) - 40;
    this.vx = 0; this.vy = 0;
    this.invuln = 70;
  }

  updateHurt() {
    this.vx *= 0.9;
    if (this.hurtT <= 0) this.setState(this.onGround ? 'IDLE' : 'FALL');
  }

  die() {
    if (this.dead) return;
    this.dead = true;
    this.hp = 0;
    this.setState('DEATH');
    G.deathT = 0;
    AUD.death();
    AUD.stopMusic();
    cam.shake(1);
    freeze(12);
    burstEmbers(this.cx, this.cy, 46, 6, PAL.orange);
    soulPuff(this.cx, this.cy, 26, PAL.soul);
    vibrate([60, 60, 120]);
  }

  updateDeath() {
    G.deathT++;
    this.vy = Math.min(this.vy + CFG.gravity, CFG.maxFall);
    this.vx *= 0.9;
    moveAndCollide(this, G.level.plats);
    if (G.deathT % 4 === 0) burstEmbers(this.cx, this.cy, 3, 2, PAL.orange);
    if (G.deathT === 90) setState('GAMEOVER');
  }

  /* ---------------- perigos ---------------- */
  checkHazards() {
    const hz = G.level.hazards;
    let safe = this.onGround;
    for (let i = 0; i < hz.length; i++) {
      const h = hz[i];
      if (!aabb(this.x, this.y, this.w, this.h, h.x, h.y, h.w, h.h)) continue;
      safe = false;
      if (h.kind === 'gold' || h.kind === 'blood' || h.kind === 'spike') {
        this.takeDamage(h.dmg || 12, sign(this.cx - (h.x + h.w / 2)) || 1);
        this.vy = -7;
      }
    }
    // memoriza ultimo chao seguro para respawn de queda
    if (safe && this.onGround) {
      let over = false;
      for (let i = 0; i < hz.length; i++) {
        const h = hz[i];
        if (this.cx > h.x - 20 && this.cx < h.x + h.w + 20 && Math.abs(this.y + this.h - h.y) < 60) { over = true; break; }
      }
      if (!over) { this.lastSafeX = this.x; this.lastSafeY = this.y; }
    }
  }

  heal(v) {
    this.hp = Math.min(this.maxHp, this.hp + v);
    floatText(this.cx, this.y - 16, '+' + Math.round(v), PAL.soul, 15);
    soulPuff(this.cx, this.cy, 8, PAL.soul);
  }
  addFury(v) { this.fury = Math.min(CFG.furyMax, this.fury + v); }
}

/* ==========================================================================================
   INIMIGOS
   Tres arquetipos com IA legivel: aproximar -> telegrafar (300ms de antecipacao com
   flash) -> golpear -> recuar. Um "diretor" limita a 2 atacantes simultaneos.
   ========================================================================================== */

let ENT_ID = 1;

const ENEMY_DEF = {
  condenado: { w: 24, h: 40, hp: 34,  speed: 2.35, dmg: 10, souls: 2, heavy: false, fly: false, tel: 18, reach: 34, atkDur: 16, rec: 22 },
  gargula:   { w: 34, h: 28, hp: 26,  speed: 2.9,  dmg: 12, souls: 3, heavy: false, fly: true,  tel: 20, reach: 30, atkDur: 34, rec: 30 },
  coloso:    { w: 52, h: 68, hp: 140, speed: 1.15, dmg: 20, souls: 7, heavy: true,  fly: false, tel: 26, reach: 62, atkDur: 26, rec: 40 }
};

class Enemy {
  constructor(kind, x, y) {
    const d = ENEMY_DEF[kind];
    this.id = ENT_ID++;
    this.kind = kind; this.def = d;
    this.w = d.w; this.h = d.h;
    this.x = x; this.y = y - d.h;
    this.vx = 0; this.vy = 0;
    this.hp = d.hp * (1 + G.levelIdx * 0.22);
    this.maxHp = this.hp;
    this.alive = true;
    this.onGround = false;
    this.facing = -1;
    this.state = 'IDLE'; this.stateT = 0;
    this.stun = 0; this.pulled = 0; this.penitent = 0;
    this.flash = 0; this.hurtT = 0;
    this.heavy = d.heavy;
    this.shield = kind === 'coloso';
    this.shieldT = 0;
    this.souling = 0;
    this.token = false;
    this.anim = rnd(0, 100);
    this.hover = rnd(0, TAU);
    this.juggle = 0;
    this.isBoss = false;
    this.dropThrough = 0;
    this.qteReady = false;
    this.homeY = y;
  }

  get cx() { return this.x + this.w / 2; }
  get cy() { return this.y + this.h / 2; }

  setState(s) { if (this.state !== s) { this.state = s; this.stateT = 0; } }

  breakShield() {
    if (!this.shield) return;
    this.shield = false; this.shieldT = 320;
    this.stun = Math.max(this.stun, 70);
    AUD.hit(true);
    freeze(6); cam.shake(0.4);
    floatText(this.cx, this.y - 12, 'GUARDA QUEBRADA', PAL.ember, 15);
    burstSparks(this.cx + this.facing * 20, this.cy, 22, this.facing, -0.5, 7, PAL.bone);
    for (let i = 0; i < 8; i++) {
      emit(PT.SHARD, this.cx + this.facing * 18, this.cy + rnd(-16, 16), rnd(1, 5) * this.facing, rnd(-4, 1),
           rndi(30, 60), rnd(3, 7), PAL.bone, { grav: 0.3, drag: 0.99, add: false, vr: rnd(-0.3, 0.3) });
    }
  }

  update() {
    if (!this.alive) return;
    this.stateT++; this.anim++;
    if (this.flash > 0) this.flash -= 0.08;
    if (this.hurtT > 0) this.hurtT--;
    if (this.penitent > 0) this.penitent--;
    if (this.shieldT > 0 && --this.shieldT === 0 && this.kind === 'coloso') this.shield = true;

    // morrendo: vira "souling", ajoelha e libera a alma
    if (this.souling > 0) {
      this.souling--;
      this.vx *= 0.85;
      if (!this.def.fly) { this.vy = Math.min(this.vy + CFG.gravity, CFG.maxFall); moveAndCollide(this, G.level.plats); }
      if (G.gt % 3 === 0) soulPuff(this.cx, this.cy, 1, PAL.soul);
      if (this.souling === 0) this.release();
      return;
    }

    if (this.pulled > 0) { this.pulled--; return; }   // corrente esta' conduzindo

    if (this.stun > 0) {
      this.stun--;
      this.vx *= 0.9;
      if (!this.def.fly) {
        this.vy = Math.min(this.vy + CFG.gravity, CFG.maxFall);
        moveAndCollide(this, G.level.plats);
      }
      if (this.penitent > 0 && G.gt % 4 === 0) burstSparks(this.cx, this.cy, 2, 0, -1, 3, PAL.crimson);
      return;
    }

    if (this.juggle > 0) {
      // suspenso por ataque aereo: cai devagar, pode ser rebatido
      this.juggle--;
      this.vy = Math.min(this.vy + CFG.gravity * 0.35, 3);
      this.vx *= 0.94;
      moveAndCollide(this, G.level.plats);
      return;
    }

    const p = G.player;
    const dx = p.cx - this.cx, dy = p.cy - this.cy;
    const d = Math.hypot(dx, dy);
    if (Math.abs(dx) > 4 && this.state !== 'ATTACK') this.facing = dx > 0 ? 1 : -1;

    switch (this.kind) {
      case 'condenado': this.aiCondenado(dx, dy, d); break;
      case 'gargula':   this.aiGargula(dx, dy, d);   break;
      case 'coloso':    this.aiColoso(dx, dy, d);    break;
    }

    // fisica
    if (!this.def.fly) {
      this.vy = Math.min(this.vy + CFG.gravity, CFG.maxFall);
      moveAndCollide(this, G.level.plats);
      if (this.y > RH + 500) this.kill(false);
    } else {
      this.x += this.vx; this.y += this.vy;
      this.y = clamp(this.y, 30, G.level.groundY - 40);
      this.x = clamp(this.x, 4, G.level.width - this.w - 4);
    }

    // brasa nos olhos
    if (G.gt % 6 === 0) emit(PT.EMBER, this.cx + rnd(-6, 6), this.y + 8, rnd(-.2, .2), rnd(-.8, -.2), 20, 1.8, PAL.crimson, { drag: .95 });
  }

  /** Pede o direito de atacar ao diretor (no maximo 2 simultaneos). */
  requestToken() {
    if (this.token) return true;
    if (G.attackTokens <= 0) return false;
    G.attackTokens--; this.token = true; return true;
  }
  freeToken() { if (this.token) { this.token = false; G.attackTokens = Math.min(CFG.maxAttackers, G.attackTokens + 1); } }

  /* --- Condenado: corpo a corpo rapido, investe em linha reta --- */
  aiCondenado(dx, dy, d) {
    const def = this.def;
    switch (this.state) {
      case 'IDLE':
        this.vx *= 0.85;
        if (d < 380) this.setState('APPROACH');
        break;
      case 'APPROACH': {
        const want = Math.abs(dx) > def.reach ? this.facing * def.speed : 0;
        this.vx = approach(this.vx, want, 0.4);
        // pula pequenos degraus / persegue em plataformas
        if (this.onGround && this.hitWall && Math.random() < 0.09) this.vy = -9.5;
        if (this.onGround && dy < -50 && Math.abs(dx) < 90 && Math.random() < 0.05) this.vy = -11.5;
        if (Math.abs(dx) < def.reach + 12 && Math.abs(dy) < 46 && this.requestToken()) this.setState('TELEGRAPH');
        if (d > 520) this.setState('IDLE');
        break;
      }
      case 'TELEGRAPH':
        this.vx *= 0.7;
        this.flash = 1;
        if (this.stateT === 1) burstEmbers(this.cx, this.y, 4, 1.4, PAL.crimson);
        if (this.stateT >= def.tel) { this.setState('ATTACK'); this.vx = this.facing * 7.2; AUD.slash(0); }
        break;
      case 'ATTACK':
        this.vx *= 0.93;
        if (this.stateT <= 10) this.tryHitPlayer(def.dmg, def.reach);
        if (this.stateT >= def.atkDur) this.setState('RECOVER');
        break;
      case 'RECOVER':
        this.vx = approach(this.vx, -this.facing * 1.4, 0.3);
        if (this.stateT >= def.rec) { this.freeToken(); this.setState('APPROACH'); }
        break;
    }
  }

  /* --- Gargula: paira acima do alvo e mergulha --- */
  aiGargula(dx, dy, d) {
    const def = this.def;
    this.hover += 0.06;
    switch (this.state) {
      case 'IDLE':
        this.vx *= 0.9; this.vy = Math.sin(this.hover) * 0.5;
        if (d < 420) this.setState('APPROACH');
        break;
      case 'APPROACH': {
        const tx = G.player.cx - this.w / 2;
        const ty = G.player.cy - 130 + Math.sin(this.hover) * 14;
        this.vx = approach(this.vx, clamp((tx - this.x) * 0.035, -def.speed, def.speed), 0.22);
        this.vy = approach(this.vy, clamp((ty - this.y) * 0.05, -3, 3), 0.24);
        if (Math.abs(dx) < 70 && dy > 60 && this.requestToken()) this.setState('TELEGRAPH');
        if (d > 560) this.setState('IDLE');
        break;
      }
      case 'TELEGRAPH':
        this.vx *= 0.8; this.vy *= 0.8;
        this.flash = 1;
        if (this.stateT >= def.tel) {
          this.setState('ATTACK');
          const ang = Math.atan2(G.player.cy - this.cy, G.player.cx - this.cx);
          this.vx = Math.cos(ang) * 10.5; this.vy = Math.sin(ang) * 10.5;
          AUD.slash(1);
        }
        break;
      case 'ATTACK':
        this.tryHitPlayer(def.dmg, def.reach);
        if (G.gt % 2 === 0) emit(PT.SMOKE, this.cx, this.cy, 0, 0, 16, 6, '#2a2430', { add: false, drag: .9 });
        if (this.stateT >= def.atkDur || this.onGround) this.setState('RECOVER');
        break;
      case 'RECOVER':
        this.vy = approach(this.vy, -2.6, 0.28);
        this.vx *= 0.93;
        if (this.stateT >= def.rec) { this.freeToken(); this.setState('APPROACH'); }
        break;
    }
  }

  /* --- Coloso de Osso: lento, escudo frontal, so' abre com a corrente --- */
  aiColoso(dx, dy, d) {
    const def = this.def;
    switch (this.state) {
      case 'IDLE':
        this.vx *= 0.8;
        if (d < 420) this.setState('APPROACH');
        break;
      case 'APPROACH':
        this.vx = approach(this.vx, Math.abs(dx) > def.reach ? this.facing * def.speed : 0, 0.16);
        if (Math.abs(dx) < def.reach && Math.abs(dy) < 70 && this.requestToken()) this.setState('TELEGRAPH');
        if (d > 620) this.setState('IDLE');
        break;
      case 'TELEGRAPH':
        this.vx *= 0.86; this.flash = 1;
        if (this.stateT === 1) { burstEmbers(this.cx + this.facing * 24, this.cy - 10, 6, 2, PAL.bone); AUD.roar(); }
        if (this.stateT >= def.tel) this.setState('ATTACK');
        break;
      case 'ATTACK':
        if (this.stateT === 2) { this.vx = this.facing * 4.4; }
        this.vx *= 0.9;
        if (this.stateT >= 6 && this.stateT <= 14) this.tryHitPlayer(def.dmg, def.reach);
        if (this.stateT === 8) {
          cam.shake(0.24);
          burstSmoke(this.cx + this.facing * 40, this.y + this.h, 5, '#2b2320');
          // onda de choque rasteira
          spawnShot(this.cx + this.facing * 40, this.y + this.h - 8, this.facing * 5, 0, 10, 1, PAL.bone, 12);
        }
        if (this.stateT >= def.atkDur) this.setState('RECOVER');
        break;
      case 'RECOVER':
        this.vx *= 0.86;
        if (this.stateT >= def.rec) { this.freeToken(); this.setState('APPROACH'); }
        break;
    }
    // fica vulneravel a QTE quando quase morto e sem escudo
    this.qteReady = (!this.shield && this.hp < this.maxHp * 0.22);
  }

  tryHitPlayer(dmg, reach) {
    const p = G.player;
    if (p.dead) return;
    const hx = this.facing > 0 ? this.x + this.w - 4 : this.x - reach + 4;
    if (!aabb(hx, this.cy - this.h * 0.6, reach, this.h * 1.2, p.x, p.y, p.w, p.h)) return;
    p.takeDamage(dmg * (1 + G.levelIdx * 0.12), sign(p.cx - this.cx) || this.facing);
  }

  /** Zera a vida: entra em "souling" (ajoelhado) antes de virar orbe. */
  kill(withSoul) {
    if (!this.alive) return;
    this.alive = false;
    this.freeToken();
    this.souling = withSoul === false ? 0 : 34;
    this.alive = true;   // continua sendo simulado durante o souling
    this.hp = 0;
    this.stun = 0; this.penitent = 0; this.juggle = 0;
    this.vy = -3;
    AUD.hit(true);
    burstBlood(this.cx, this.cy, 12, this.facing);
    burstEmbers(this.cx, this.cy, 16, 4, PAL.orange);
    if (this.souling === 0) this.release();
  }

  /** Libera as almas e some do mundo. */
  release() {
    this.alive = false;
    this.dead = true;
    const n = this.def ? this.def.souls : 5;
    for (let i = 0; i < n; i++) spawnOrb(this.cx + rnd(-8, 8), this.cy + rnd(-8, 8), 1);
    soulPuff(this.cx, this.cy, 14, PAL.soul);
    ringFx(this.cx, this.cy, 34, PAL.soul, 22);
    burstSmoke(this.cx, this.cy, 4, '#171018');
  }
}

/* ==========================================================================================
   BOSSES
   Tres chefes, cada um com tres fases (mudam em 66% e 33% de vida) e execucao por QTE.
   ========================================================================================== */

const BOSS_DEF = {
  luxuria: {
    name: 'LUXURIA', latin: 'MERETRIX ARDENS', sub: 'A QUE ARDE E NAO SE CONSOME',
    w: 66, h: 96, hp: 620, fly: true, col: '#C21807', col2: '#FF6B00',
    acts: [['volley', 'charge'], ['volley', 'charge', 'summon'], ['volley', 'storm', 'charge', 'summon']]
  },
  violentia: {
    name: 'VIOLENTIA', latin: 'MINOTAURUS SANGUINIS', sub: 'O TOURO DO RIO VERMELHO',
    w: 92, h: 104, hp: 900, fly: false, col: '#8B0000', col2: '#FF6B00',
    acts: [['charge', 'slam'], ['charge', 'slam', 'spray'], ['rage', 'slam', 'spray', 'charge']]
  },
  proditio: {
    name: 'PRODITIO', latin: 'IMPERATOR GELIDUS', sub: 'O IMPERADOR DE TRES BOCAS',
    w: 104, h: 124, hp: 1250, fly: false, col: '#7FA8C9', col2: '#9FD8FF',
    acts: [['shards', 'pillars'], ['shards', 'pillars', 'breath'], ['breath', 'shards', 'pillars', 'summon']]
  }
};

class Boss {
  constructor(kind, x, y) {
    const d = BOSS_DEF[kind];
    this.id = ENT_ID++;
    this.kind = kind; this.bd = d;
    this.w = d.w; this.h = d.h;
    this.x = x; this.y = y - d.h;
    this.vx = 0; this.vy = 0;
    this.maxHp = d.hp; this.hp = d.hp;
    this.alive = true; this.isBoss = true; this.heavy = true;
    this.def = { fly: d.fly, souls: 40 };
    this.facing = -1;
    this.phase = 0;
    this.state = 'INTRO'; this.stateT = 0;
    this.act = null; this.actT = 0;
    this.cool = 90;
    this.stun = 0; this.pulled = 0; this.penitent = 0;
    this.flash = 0; this.hurtT = 0; this.souling = 0;
    this.shield = false; this.token = true;
    this.anim = 0; this.hover = 0;
    this.qteReady = false;
    this.invuln = 60;
    this.juggle = 0;
    this.groundY = y;
    this.onGround = false;
    this.dropThrough = 0;
  }

  get cx() { return this.x + this.w / 2; }
  get cy() { return this.y + this.h / 2; }

  setState(s) { if (this.state !== s) { this.state = s; this.stateT = 0; } }
  freeToken() {}
  breakShield() {}

  /** Fases mudam em 66% e 33%. */
  checkPhase() {
    const f = this.hp / this.maxHp;
    const want = f > 0.66 ? 0 : (f > 0.33 ? 1 : 2);
    if (want > this.phase) {
      this.phase = want;
      this.setState('PHASE');
      this.invuln = 70;
      AUD.roar();
      cam.shake(0.9); freeze(10);
      G.whiteFlash = 0.5;
      burstEmbers(this.cx, this.cy, 40, 7, this.bd.col2);
      ringFx(this.cx, this.cy, 120, this.bd.col2, 34);
      floatText(this.cx, this.y - 24, 'FASE ' + (this.phase + 1), this.bd.col2, 22);
    }
  }

  update() {
    if (!this.alive) return;
    this.stateT++; this.anim++; this.hover += 0.03;
    if (this.flash > 0) this.flash -= 0.07;
    if (this.hurtT > 0) this.hurtT--;
    if (this.invuln > 0) this.invuln--;
    if (this.penitent > 0) this.penitent--;
    if (this.stun > 0) this.stun--;
    if (this.souling > 0) { this.souling--; if (this.souling === 0) this.release(); return; }

    const p = G.player;
    const dx = p.cx - this.cx;
    if (this.state !== 'ACT' && Math.abs(dx) > 6) this.facing = dx > 0 ? 1 : -1;

    if (this.state === 'INTRO') {
      this.vy = this.bd.fly ? Math.sin(this.hover) * 0.6 : this.vy;
      if (this.stateT > 90) this.setState('IDLE');
    } else if (this.state === 'PHASE') {
      this.vx *= 0.86;
      if (this.stateT % 4 === 0) burstEmbers(this.cx, this.cy, 4, 4, this.bd.col2);
      if (this.stateT > 72) this.setState('IDLE');
    } else if (this.state === 'QTE') {
      this.vx *= 0.8;
      if (!this.bd.fly) { this.vy = Math.min(this.vy + CFG.gravity, CFG.maxFall); }
      if (G.gt % 3 === 0) soulPuff(this.cx, this.cy + rnd(-30, 30), 1, PAL.soul);
    } else if (this.state === 'IDLE') {
      this.idleMove(dx);
      if (--this.cool <= 0) this.pickAct();
    } else if (this.state === 'ACT') {
      this.runAct();
    }

    // fisica
    if (this.bd.fly) {
      this.x += this.vx; this.y += this.vy;
      this.x = clamp(this.x, G.level.arenaL || 20, (G.level.arenaR || G.level.width) - this.w);
      this.y = clamp(this.y, 40, this.groundY - this.h - 10);
    } else if (this.state !== 'QTE' || true) {
      this.vy = Math.min(this.vy + CFG.gravity, CFG.maxFall);
      moveAndCollide(this, G.level.plats);
      this.x = clamp(this.x, G.level.arenaL || 0, (G.level.arenaR || G.level.width) - this.w);
    }

    this.checkPhase();
    if (G.gt % 3 === 0) {
      emit(PT.EMBER, this.cx + rnd(-this.w / 2, this.w / 2), this.y + rnd(0, this.h),
           rnd(-.3, .3), rnd(-1.2, -.3), 26, rnd(1.6, 3.2), this.bd.col2, { drag: .95 });
    }
  }

  idleMove(dx) {
    if (this.bd.fly) {
      const ty = 160 + Math.sin(this.hover) * 26;
      this.vy = approach(this.vy, clamp((ty - this.y) * 0.04, -2, 2), 0.2);
      this.vx = approach(this.vx, clamp(dx * 0.012, -1.8, 1.8), 0.12);
    } else {
      this.vx = approach(this.vx, clamp(dx * 0.02, -1.5, 1.5), 0.1);
    }
  }

  pickAct() {
    const list = this.bd.acts[this.phase];
    this.act = list[(Math.random() * list.length) | 0];
    this.actT = 0;
    this.setState('ACT');
    this.flash = 1;
  }

  endAct(cool) {
    this.act = null;
    this.cool = cool || Math.max(34, 90 - this.phase * 22);
    this.setState('IDLE');
  }

  runAct() {
    const t = ++this.actT;
    const p = G.player;
    switch (this.act) {

      /* --- salva de projeteis de alma --- */
      case 'volley': {
        if (t < 26) { this.vx *= 0.9; this.flash = Math.max(this.flash, 0.6); break; }
        if (t === 26 || t === 40 || t === 54) {
          AUD.chainFire();
          const n = 3 + this.phase;
          for (let i = 0; i < n; i++) {
            const a = Math.atan2(p.cy - this.cy, p.cx - this.cx) + (i - (n - 1) / 2) * 0.24;
            spawnShot(this.cx, this.cy, Math.cos(a) * 5.6, Math.sin(a) * 5.6, 12, 0, this.bd.col2, 7);
          }
          burstEmbers(this.cx, this.cy, 8, 3, this.bd.col2);
        }
        if (t > 70) this.endAct();
        break;
      }

      /* --- investida --- */
      case 'charge': {
        if (t < 34) { this.vx *= 0.88; this.flash = Math.max(this.flash, 0.7); if (t === 1) AUD.roar(); break; }
        if (t === 34) {
          const a = this.bd.fly ? Math.atan2(p.cy - this.cy, p.cx - this.cx) : 0;
          this.vx = (this.bd.fly ? Math.cos(a) : this.facing) * (12 + this.phase * 2);
          if (this.bd.fly) this.vy = Math.sin(a) * (10 + this.phase * 2);
          AUD.dash(); cam.shake(0.2);
        }
        if (t > 34) {
          this.vx *= 0.965; if (this.bd.fly) this.vy *= 0.965;
          this.hitPlayer(this.phase >= 2 ? 22 : 17, 8);
          if (G.gt % 2 === 0) burstEmbers(this.cx, this.cy, 3, 3, this.bd.col2);
          if (this.hitWall) { cam.shake(0.5); freeze(4); this.vx = 0; this.endAct(60); }
        }
        if (t > 90) this.endAct();
        break;
      }

      /* --- pancada no chao com onda de choque --- */
      case 'slam': {
        if (t < 30) { this.vx *= 0.86; this.flash = Math.max(this.flash, 0.7); break; }
        if (t === 30) { this.vy = -13; }
        if (t > 30 && this.onGround && this.vy === 0 && t > 36) {
          AUD.hit(true); cam.shake(0.8); freeze(6);
          burstSmoke(this.cx, this.y + this.h, 12, '#2a1a18');
          for (let s = -1; s <= 1; s += 2) {
            spawnShot(this.cx, this.y + this.h - 10, s * 6.5, 0, 16, 1, this.bd.col, 14);
            if (this.phase >= 1) spawnShot(this.cx, this.y + this.h - 10, s * 4.2, 0, 14, 1, this.bd.col, 12);
          }
          this.endAct(50);
        }
        if (t > 130) this.endAct();
        break;
      }

      /* --- jato de sangue --- */
      case 'spray': {
        if (t < 24) { this.vx *= 0.9; this.flash = Math.max(this.flash, 0.6); break; }
        if (t >= 24 && t < 74 && t % 6 === 0) {
          const a = Math.atan2(p.cy - this.cy, p.cx - this.cx) + rnd(-0.3, 0.3);
          spawnShot(this.cx + this.facing * 30, this.cy - 10, Math.cos(a) * 6.2, Math.sin(a) * 6.2 - 1, 11, 2, PAL.blood, 8);
          AUD.noise({ filter: 'bandpass', freq: 500, to: 180, dur: 0.12, vol: 0.14 });
        }
        if (t > 92) this.endAct();
        break;
      }

      /* --- surto: duas investidas seguidas --- */
      case 'rage': {
        if (t === 1) { AUD.roar(); cam.shake(0.5); }
        if (t < 26) { this.vx *= 0.9; this.flash = 1; break; }
        if (t === 26 || t === 78) { this.vx = this.facing * 15; AUD.dash(); }
        if (t === 70) this.facing = sign(p.cx - this.cx) || this.facing;
        if (t > 26) {
          this.vx *= 0.975;
          this.hitPlayer(24, 9);
          if (G.gt % 2 === 0) burstEmbers(this.cx, this.cy, 3, 4, PAL.crimson);
          if (this.hitWall) { cam.shake(0.6); freeze(5); this.vx = 0; }
        }
        if (t > 140) this.endAct();
        break;
      }

      /* --- invoca lacaios --- */
      case 'summon': {
        if (t < 40) { this.vx *= 0.9; this.flash = Math.max(this.flash, 0.5); break; }
        if (t === 40) {
          AUD.portal();
          const kinds = this.kind === 'proditio' ? ['gargula', 'gargula'] : ['condenado', 'condenado'];
          for (let i = 0; i < kinds.length; i++) {
            const sx = clamp(this.cx + (i === 0 ? -140 : 140), 40, G.level.width - 60);
            const e = new Enemy(kinds[i], sx, this.groundY - (kinds[i] === 'gargula' ? 150 : 0));
            G.enemies.push(e);
            ringFx(e.cx, e.cy, 40, PAL.soul, 24);
            soulPuff(e.cx, e.cy, 10, PAL.soul);
          }
        }
        if (t > 70) this.endAct();
        break;
      }

      /* --- tempestade de almas (Luxuria fase 3) --- */
      case 'storm': {
        if (t === 1) AUD.roar();
        if (t < 30) { this.flash = Math.max(this.flash, 0.6); break; }
        if (t >= 30 && t < 150 && t % 8 === 0) {
          const sx = rnd(G.level.arenaL + 20, G.level.arenaR - 20);
          spawnShot(sx, 20, rnd(-0.8, 0.8), rnd(4.4, 6.4), 10, 0, PAL.crimson, 6);
        }
        if (t > 168) this.endAct();
        break;
      }

      /* --- lascas de gelo --- */
      case 'shards': {
        if (t < 26) { this.flash = Math.max(this.flash, 0.6); break; }
        if ((t === 26 || t === 44 || t === 62 || (this.phase >= 2 && t === 80))) {
          AUD.tone({ type: 'triangle', freq: 900, to: 1600, dur: 0.14, vol: 0.14 });
          const n = 5 + this.phase;
          for (let i = 0; i < n; i++) {
            const a = -Math.PI / 2 + (i - (n - 1) / 2) * 0.3;
            spawnShot(this.cx, this.cy - 20, Math.cos(a) * 5.4, Math.sin(a) * 5.4, 12, 3, PAL.soul, 8);
          }
        }
        if (t > 100) this.endAct();
        break;
      }

      /* --- pilares de gelo saindo do chao --- */
      case 'pillars': {
        if (t < 30) { this.flash = Math.max(this.flash, 0.6); break; }
        if (t >= 30 && t < 30 + (4 + this.phase * 2) * 10 && (t - 30) % 10 === 0) {
          const i = (t - 30) / 10;
          const px = this.cx + (this.facing > 0 ? 1 : -1) * (60 + i * 76);
          if (px > G.level.arenaL && px < G.level.arenaR) {
            spawnShot(px, this.groundY - 6, 0, -7.5, 15, 4, PAL.soul, 16);
            burstSparks(px, this.groundY - 6, 6, 0, -1, 4, PAL.soul);
            cam.shake(0.1);
            AUD.tone({ type: 'square', freq: 220, to: 620, dur: 0.12, vol: 0.1 });
          }
        }
        if (t > 130) this.endAct();
        break;
      }

      /* --- sopro congelante --- */
      case 'breath': {
        if (t < 40) { this.vx *= 0.9; this.flash = Math.max(this.flash, 0.8); break; }
        if (t >= 40 && t < 110) {
          if (t % 3 === 0) {
            const a = (this.facing > 0 ? 0 : Math.PI) + rnd(-0.16, 0.16);
            spawnShot(this.cx + this.facing * 40, this.cy - 24, Math.cos(a) * 8, Math.sin(a) * 8, 8, 3, '#CFEBFF', 9);
          }
          if (t % 10 === 0) AUD.noise({ filter: 'highpass', freq: 2200, dur: 0.2, vol: 0.1 });
        }
        if (t > 130) this.endAct();
        break;
      }

      default: this.endAct();
    }
  }

  hitPlayer(dmg, reach) {
    const p = G.player;
    if (p.dead) return;
    if (!aabb(this.x - reach, this.y - reach, this.w + reach * 2, this.h + reach * 2, p.x, p.y, p.w, p.h)) return;
    p.takeDamage(dmg, sign(p.cx - this.cx) || this.facing);
  }

  /** Boss zerado nao morre: fica vulneravel e abre a janela de QTE. */
  kill() {
    if (this.state === 'QTE') return;
    this.setState('QTE');
    this.qteReady = true;
    this.hp = 0;
    this.act = null;
    this.vx = 0;
    AUD.roar();
    cam.shake(0.7); freeze(10);
    startQTE(this);
  }

  release() {
    this.alive = false;
    this.dead = true;
    for (let i = 0; i < 26; i++) spawnOrb(this.cx + rnd(-40, 40), this.cy + rnd(-40, 40), 2);
    soulPuff(this.cx, this.cy, 40, PAL.soul);
    ringFx(this.cx, this.cy, 180, this.bd.col2, 40);
  }
}

/* ==========================================================================================
   08 COMBAT
   ========================================================================================== */

/**
 * Aplica dano a um inimigo/boss com todo o "feel": hitstop, shake, faisca,
 * numero flutuante, ganho de combo e de Furia.
 */
function damageEnemy(e, dmg, kx, ky, opt) {
  if (!e || !e.alive || e.souling > 0) return;
  opt = opt || {};

  if (e.invuln > 0) {
    floatText(e.cx, e.y - 8, 'IMUNE', PAL.ash, 13);
    burstSparks(e.cx, e.cy, 4, sign(kx), -0.5, 3, PAL.ash);
    return;
  }

  // Escudo do Coloso: bloqueia o que vem de frente, exceto a corrente e o
  // contra-ataque durante o proprio golpe dele.
  const frontal = sign(G.player.cx - e.cx) === e.facing;
  if (e.shield && frontal && !opt.chain && e.state !== 'ATTACK' && e.state !== 'RECOVER') {
    dmg *= 0.08;
    freeze(3); cam.shake(0.12);
    AUD.tone({ type: 'square', freq: 240, to: 120, dur: 0.1, vol: 0.16 });
    floatText(e.cx + e.facing * 20, e.cy - 10, 'BLOQUEADO', PAL.bone, 13);
    burstSparks(e.cx + e.facing * 22, e.cy, 10, e.facing, -0.4, 5, PAL.bone);
    e.hp -= dmg;
    return;
  }

  e.hp -= dmg;
  e.flash = 1;
  e.hurtT = 10;

  // knockback (bosses sao pesados demais)
  if (!e.isBoss) {
    e.vx = kx * (e.heavy ? 0.35 : 1);
    if (ky) e.vy = ky * (e.heavy ? 0.4 : 1);
    if (opt.juggle) { e.juggle = 34; e.vy = Math.min(e.vy, -3.6); }
    e.stun = Math.max(e.stun, opt.juggle ? 0 : 8);
  }

  if (!opt.silent) {
    freeze(opt.hitstop || CFG.hitstopLight);
    cam.shake(opt.shake || 0.15);
    AUD.hit(dmg > CFG.baseDamage * 2);
    vibrate(dmg > CFG.baseDamage * 2 ? 22 : 8);
  }

  burstSparks(e.cx - sign(kx) * 6, e.cy, 8, sign(kx) || 1, -0.5, 6, PAL.ember);
  burstBlood(e.cx, e.cy, 5, sign(kx) || 1);
  floatText(e.cx + rnd(-8, 8), e.y - 6, '' + Math.round(dmg), dmg > CFG.baseDamage * 2 ? PAL.ember : PAL.bone, dmg > CFG.baseDamage * 2 ? 20 : 15);

  // combo + furia
  G.combo++;
  G.comboTimer = CFG.comboWindow;
  G.comboScale = 1;
  if (G.combo > (SAVE.best.combo || 0)) SAVE.best.combo = G.combo;
  G.player.addFury(0.65 + dmg * 0.045);

  // Coloso quase morto e sem escudo -> abre execucao
  if (!e.isBoss && e.qteReady && e.hp > 0 && !G.qte) { startQTE(e); return; }

  if (e.hp <= 0) e.kill();
}

/* ---- orbes de alma ---- */

function updateOrbs() {
  const p = G.player;
  for (let i = 0; i < ORB_MAX; i++) {
    const o = G.orbs[i];
    if (!o.on) continue;
    o.t++;
    o.life--;
    if (o.life <= 0) { o.on = false; continue; }
    o.vy += 0.14;
    o.vx *= 0.97; o.vy *= 0.97;
    // ima: depois de meio segundo o orbe caca o jogador
    if (o.t > 26 && !p.dead) {
      const dx = p.cx - o.x, dy = p.cy - o.y;
      const d = Math.hypot(dx, dy) || 1;
      if (d < 260) { o.vx += dx / d * 0.85; o.vy += dy / d * 0.85; }
      if (d < 22) { o.on = false; collectSoul(o.val); continue; }
    }
    o.x += o.vx; o.y += o.vy;
    if (G.gt % 3 === 0) emit(PT.SOUL, o.x, o.y, rnd(-.3, .3), rnd(-.4, .1), 16, 2.2, PAL.soul, { drag: .93 });
  }
}

/**
 * Coleta de alma resolvida pela postura atual:
 *   PUNIR    -> mais almas e mais Furia
 *   ABSOLVER -> menos almas, mas cura
 * A contagem acumulada decide qual dos dois finais o jogador recebe.
 */
function collectSoul(val) {
  if (G.stance === 'punir') {
    const n = 2 * val;
    G.souls += n; G.runSouls += n; SAVE.punish++;
    G.player.addFury(3.2 * val);
    AUD.soul('punir');
    emit(PT.SOUL, G.player.cx, G.player.cy - 10, 0, -1, 20, 5, PAL.crimson, { drag: .9 });
  } else {
    const n = 1 * val;
    G.souls += n; G.runSouls += n; SAVE.absolve++;
    G.player.heal(2.4 * val);
    AUD.soul('absolve');
    emit(PT.SOUL, G.player.cx, G.player.cy - 10, 0, -1, 20, 5, PAL.soul, { drag: .9 });
  }
}

/* ---- projeteis inimigos ---- */

function updateShots() {
  const p = G.player;
  for (let i = 0; i < SHOT_MAX; i++) {
    const s = G.shots[i];
    if (!s.on) continue;
    s.life--;
    if (s.life <= 0) { s.on = false; continue; }
    s.spin += 0.2;

    switch (s.kind) {
      case 1: // onda de choque rasteira: acompanha o chao
        s.y = G.level.groundY - 14;
        break;
      case 2: // jato de sangue: sofre gravidade
        s.vy += 0.16;
        break;
      case 4: // pilar de gelo: sobe, para e cai
        s.vy += 0.34;
        break;
    }
    s.x += s.vx; s.y += s.vy;

    if (G.gt % 2 === 0) {
      emit(PT.FLAME, s.x, s.y, rnd(-.3, .3), rnd(-.3, .3), 12, s.r * 0.6, s.col, { drag: .9 });
    }

    // colisao com cenario (exceto onda rasteira que ja' anda colada no chao)
    if (s.kind !== 1) {
      let hitPlat = false;
      const plats = G.level.plats;
      for (let j = 0; j < plats.length; j++) {
        const pl = plats[j];
        if (pl.oneway || pl.dead) continue;
        if (s.x > pl.x && s.x < pl.x + pl.w && s.y > pl.y && s.y < pl.y + pl.h) { hitPlat = true; break; }
      }
      if (hitPlat) {
        s.on = false;
        burstSparks(s.x, s.y, 6, 0, -1, 3, s.col);
        continue;
      }
    }

    if (!p.dead && aabb(s.x - s.r, s.y - s.r, s.r * 2, s.r * 2, p.x, p.y, p.w, p.h)) {
      s.on = false;
      p.takeDamage(s.dmg * (1 + G.levelIdx * 0.1), sign(s.vx) || 1);
      burstSparks(s.x, s.y, 10, sign(s.vx), -0.4, 5, s.col);
    }

    if (s.x < -80 || s.x > G.level.width + 80 || s.y > RH + 400 || s.y < -300) s.on = false;
  }
}

/* ==========================================================================================
   QUICK TIME EVENT + EXECUCAO
   Circulo que encolhe; tocar quando ele cruza o anel-alvo executa o inimigo.
   ========================================================================================== */

function startQTE(target) {
  if (G.qte) return;
  G.qte = {
    target: target,
    t: 0,
    dur: 96,
    r: 168,
    targetR: 58,
    tol: 17,
    resolved: 0,     // 0 = aguardando, 1 = sucesso, -1 = falha
    holdT: 0,
    tick: -1
  };
  cam.tzoom = 1.28;
  cam.lockTarget = target;
  G.timeScale = 0.4;
  AUD.tone({ type: 'sine', freq: 1400, to: 900, dur: 0.3, vol: 0.16 });
  vibrate(30);
}

function updateQTE() {
  const q = G.qte;
  if (!q) return;
  q.t++;

  if (q.resolved === 0) {
    const k = q.t / q.dur;
    q.r = lerp(168, 18, k);
    // tique sonoro a cada 12 frames aumenta a tensao
    const tk = Math.floor(q.t / 12);
    if (tk !== q.tick) { q.tick = tk; AUD.qteTick(); }

    // qualquer toque na tela / botao conta
    let pressed = IN.taps.length > 0 || IN.btn.attack.pressed || IN.btn.chain.pressed || IN.btn.fury.pressed || IN.btn.jump.pressed;
    if (pressed) {
      if (Math.abs(q.r - q.targetR) <= q.tol) qteSuccess();
      else qteFail();
    } else if (q.t >= q.dur) qteFail();
    return;
  }

  q.holdT++;
  if (q.resolved === 1) updateExecution(q);
  else if (q.holdT > 40) endQTE();
}

function qteSuccess() {
  const q = G.qte;
  q.resolved = 1; q.holdT = 0;
  AUD.qteHit();
  freeze(10); cam.shake(0.8);
  G.whiteFlash = 0.7;
  vibrate([40, 30, 80]);
  floatText(q.target.cx, q.target.y - 30, 'EXECUCAO', PAL.ember, 26);
  G.timeScale = 0.25;
  cam.tzoom = 1.5;
}

function qteFail() {
  const q = G.qte;
  q.resolved = -1; q.holdT = 0;
  AUD.deny();
  cam.shake(0.3);
  floatText(q.target.cx, q.target.y - 26, 'FALHOU', PAL.ash, 20);
  const t = q.target;
  if (t.isBoss) {
    // boss se recompoe com um pouco de vida
    t.hp = t.maxHp * 0.16;
    t.invuln = 60;
    t.setState('PHASE');
    t.qteReady = false;
  } else {
    t.qteReady = false;
    t.stun = 20;
    t.hp = Math.max(t.hp, t.maxHp * 0.12);
  }
  G.player.takeDamage(6, -G.player.facing);
}

/** Sequencia cinematografica: camera fechada, slow-mo e particulas de alma. */
function updateExecution(q) {
  const t = q.target;
  const h = q.holdT;
  if (h % 3 === 0) {
    burstSparks(t.cx + rnd(-t.w / 2, t.w / 2), t.cy + rnd(-t.h / 2, t.h / 2), 6, rnd(-1, 1), rnd(-1, 0), 7, PAL.ember);
    soulPuff(t.cx, t.cy, 3, PAL.soul);
  }
  if (h === 12) { AUD.slash(2); AUD.hit(true); cam.shake(0.6); freeze(6); burstBlood(t.cx, t.cy, 22, 1); }
  if (h === 30) { AUD.slash(3); AUD.hit(true); cam.shake(0.7); freeze(6); burstBlood(t.cx, t.cy, 26, -1); }
  if (h === 52) {
    AUD.roar(); cam.shake(1); freeze(12);
    G.whiteFlash = 1;
    burstEmbers(t.cx, t.cy, 60, 9, PAL.orange);
    soulPuff(t.cx, t.cy, 40, PAL.soul);
    ringFx(t.cx, t.cy, 160, PAL.ember, 34);
  }
  if (h > 78) {
    if (t.isBoss) {
      // Boss executado: o jogador escolhe o destino da alma
      G.choice = { target: t, t: 0 };
      G.timeScale = 1;
      cam.tzoom = 1.1;
      G.qte = null;
    } else {
      t.hp = 0; t.kill();
      endQTE();
    }
  }
}

function endQTE() {
  G.qte = null;
  G.timeScale = 1;
  cam.tzoom = 1;
  cam.lockTarget = null;
}

/* ---- escolha PUNIR / ABSOLVER apos executar um boss ---- */
G.choice = null;

const CHOICE_BTN = {
  punir:   { x: RW * 0.5 - 150, y: 340, w: 260, h: 82 },
  absolve: { x: RW * 0.5 + 22,  y: 340, w: 260, h: 82 }
};

function updateChoice() {
  const c = G.choice;
  c.t++;
  if (c.t < 24) return;
  for (let i = 0; i < IN.taps.length; i++) {
    const tp = IN.taps[i];
    const b1 = CHOICE_BTN.punir, b2 = CHOICE_BTN.absolve;
    if (tp.x >= b1.x && tp.x <= b1.x + b1.w && tp.y >= b1.y && tp.y <= b1.y + b1.h) return resolveChoice('punir');
    if (tp.x >= b2.x && tp.x <= b2.x + b2.w && tp.y >= b2.y && tp.y <= b2.y + b2.h) return resolveChoice('absolve');
  }
  if (IN.keys.has('left') && IN.btn.attack.pressed) return resolveChoice('punir');
  if (IN.keys.has('right') && IN.btn.attack.pressed) return resolveChoice('absolve');
}

function resolveChoice(kind) {
  const t = G.choice.target;
  if (kind === 'punir') {
    SAVE.punish += 5;
    const n = 90 + G.levelIdx * 30;
    G.souls += n; G.runSouls += n;
    G.player.fury = CFG.furyMax;
    floatText(t.cx, t.y - 20, '+' + n + ' ALMAS', PAL.crimson, 24);
    AUD.fury();
    burstEmbers(t.cx, t.cy, 50, 8, PAL.crimson);
  } else {
    SAVE.absolve += 5;
    const n = 40 + G.levelIdx * 14;
    G.souls += n; G.runSouls += n;
    G.player.hp = G.player.maxHp;
    G.player.maxHp += 10;
    floatText(t.cx, t.y - 20, 'ALMA LIBERTA', PAL.soul, 24);
    AUD.portal();
    soulPuff(t.cx, t.cy, 60, PAL.soul);
  }
  saveGame();
  t.souling = 40;
  t.qteReady = false;
  G.choice = null;
  G.timeScale = 1;
  cam.tzoom = 1;
  cam.lockTarget = null;
  vibrate(40);
}

/* ---- combo + diretor de IA ---- */

function updateCombat() {
  if (G.comboTimer > 0) { G.comboTimer--; if (G.comboTimer === 0) G.combo = 0; }
  G.comboScale *= 0.88;

  // Recupera tokens perdidos por inimigos que morreram segurando um.
  let held = 0;
  for (let i = 0; i < G.enemies.length; i++) if (G.enemies[i].token && G.enemies[i].alive) held++;
  G.attackTokens = clamp(CFG.maxAttackers - held, 0, CFG.maxAttackers);

  // limpeza de mortos
  for (let i = G.enemies.length - 1; i >= 0; i--) {
    if (!G.enemies[i].alive) {
      if (G.enemies[i] === G.boss) G.boss = null;
      G.enemies.splice(i, 1);
    }
  }
}

/** Obstaculos da fase da moto (pool proprio, sem alocacao em runtime). */
const OBST_MAX = 48;
G.obst = [];
for (let i = 0; i < OBST_MAX; i++) G.obst.push({ on: false, x: 0, y: 0, w: 20, h: 20, kind: 0, hp: 1, t: 0, vx: 0, vy: 0 });

function spawnObst(kind, x, y, w, h, hp, vx, vy) {
  for (let i = 0; i < OBST_MAX; i++) {
    const o = G.obst[i];
    if (o.on) continue;
    o.on = true; o.kind = kind; o.x = x; o.y = y; o.w = w; o.h = h;
    o.hp = hp || 1; o.t = 0; o.vx = vx || 0; o.vy = vy || 0;
    return o;
  }
  return null;
}

/**
 * Constroi o layout de um circulo. Usa PRNG semeado: a mesma fase e' sempre igual,
 * mas cada circulo tem cara propria.
 */
function buildLevel(idx) {
  const meta = LEVELS[idx];
  const rng = mulberry32(90210 + idx * 7717);
  const groundY = 430;
  const L = {
    idx: idx, meta: meta, pal: meta.pal,
    name: meta.name, latin: meta.latin, sub: meta.sub,
    width: meta.width, groundY: groundY,
    plats: [], hazards: [], hooks: [], spawns: [], decos: [],
    ice: !!meta.ice, wind: !!meta.wind, windForce: 0, windPhase: 0,
    mode: meta.mode, bossKind: meta.boss,
    portalX: meta.width - 150, portalOpen: !meta.boss,
    arenaL: 0, arenaR: meta.width,
    bossSpawned: false, safeX: 80,
    hints: []
  };

  if (meta.mode === 'bike') {
    // A perseguicao na moto nao tem plataformas: o chao e' o proprio rio.
    L.groundY = 470;
    L.width = 999999;
    L.portalX = 999999;
    L.bikeGoal = 12200;
    return L;
  }

  const arenaW = meta.boss ? 940 : 0;
  const walkEnd = meta.width - arenaW;

  // ---- chao em segmentos com vaos saltaveis ----
  let x = 0;
  const gapChance = idx === 0 ? 0.35 : 0.55;
  while (x < walkEnd) {
    const segW = 260 + rng() * 300;
    L.plats.push({ x: x, y: groundY, w: Math.min(segW, walkEnd - x), h: 200, oneway: false, ground: true });
    x += segW;
    if (x < walkEnd - 320 && rng() < gapChance) {
      const gap = 86 + rng() * (idx === 0 ? 40 : 70);
      // perigos no fundo do vao, conforme o circulo
      if (idx === 2) L.hazards.push({ x: x, y: groundY + 26, w: gap, h: 120, kind: 'gold', dmg: 16 });
      if (idx === 3) L.hazards.push({ x: x, y: groundY + 26, w: gap, h: 120, kind: 'blood', dmg: 14 });
      x += gap;
    }
  }

  // ---- plataformas flutuantes ----
  const floatCount = 8 + Math.floor(rng() * 5) + idx;
  for (let i = 0; i < floatCount; i++) {
    const px = 320 + rng() * (walkEnd - 600);
    const py = 200 + rng() * 170;
    const pw = 90 + rng() * 110;
    L.plats.push({ x: px, y: py, w: pw, h: 16, oneway: true });
    if (rng() < 0.45) L.hooks.push({ x: px + pw / 2, y: py - 76 });
  }

  // ---- gimmick por circulo ----
  if (idx === 0) {
    // Limbo: tutorial. Prompts ancorados em x.
    L.hints = [
      { x: 120,  s: 'ARRASTE A ESQUERDA PARA ANDAR' },
      { x: 560,  s: 'TOQUE EM ATK PARA O COMBO DE 3' },
      { x: 1080, s: 'SEGURE ATK: GOLPE PESADO' },
      { x: 1560, s: 'PULO DUPLO / SEGURE NO AR PARA PLANAR' },
      { x: 2100, s: 'COR: A CORRENTE PUXA INIMIGOS E GANCHOS' },
      { x: 2700, s: 'DESLIZE O JOYSTICK PARA ESQUIVAR' },
      { x: 3200, s: 'ENCHA A FURIA E TOQUE FUR' }
    ];
  }
  if (idx === 1) {
    // Luxuria: tempestade de almas ao fundo + rajadas laterais (aplicadas em updateLevel)
    for (let i = 0; i < 26; i++) L.decos.push({ kind: 'wisp', x: rng() * meta.width, y: 80 + rng() * 300, p: rng() * TAU });
  }
  if (idx === 2) {
    // Avaritia: poças de ouro derretido + plataformas que afundam
    for (let i = 0; i < 7; i++) {
      const hx = 500 + rng() * (walkEnd - 900);
      L.hazards.push({ x: hx, y: groundY - 6, w: 120 + rng() * 90, h: 22, kind: 'gold', dmg: 13 });
    }
    for (let i = 0; i < 8; i++) {
      const px = 420 + rng() * (walkEnd - 700);
      const py = 250 + rng() * 130;
      L.plats.push({ x: px, y: py, w: 110, h: 16, oneway: true, sink: true, origY: py, sinkT: 0, dead: false, deadT: 0 });
    }
  }
  if (idx === 4) {
    // Proditio: gelo. Sem perigos de chao, mas atrito quase nulo (L.ice).
    for (let i = 0; i < 20; i++) L.decos.push({ kind: 'shard', x: rng() * meta.width, y: 120 + rng() * 260, p: rng() * TAU });
  }

  // ---- arena do boss ----
  if (meta.boss) {
    L.arenaL = walkEnd + 20;
    L.arenaR = meta.width - 20;
    L.plats.push({ x: walkEnd, y: groundY, w: arenaW, h: 200, ground: true });
    // paredes da arena
    L.plats.push({ x: meta.width - 20, y: 0, w: 40, h: groundY + 20 });
    L.hooks.push({ x: L.arenaL + 200, y: 190 });
    L.hooks.push({ x: L.arenaR - 200, y: 190 });
    L.portalOpen = false;
  } else {
    L.arenaL = 0; L.arenaR = meta.width;
  }

  // ---- inimigos ----
  const kinds = [
    ['condenado', 'condenado', 'condenado', 'gargula'],
    ['condenado', 'gargula', 'condenado', 'gargula', 'coloso'],
    ['condenado', 'coloso', 'gargula', 'condenado', 'coloso'],
    [],
    ['condenado', 'coloso', 'gargula', 'coloso', 'gargula', 'condenado']
  ][idx];
  if (kinds.length) {
    const count = 8 + idx * 3;
    for (let i = 0; i < count; i++) {
      const sx = 420 + (i / count) * (walkEnd - 600) + rng() * 120;
      const k = kinds[Math.floor(rng() * kinds.length)];
      const fly = k === 'gargula';
      L.spawns.push({ x: sx, kind: k, y: fly ? groundY - 150 - rng() * 80 : groundY, done: false });
    }
  }

  return L;
}
