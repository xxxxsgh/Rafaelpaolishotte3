G.tsAcc = 0;
G.cut = null;
G.bossIntroT = 0;

function setState(s) {
  G.state = s;
  G.t = 0;
  if (s === 'MENU') { AUD.setTrack(TRACKS[0]); G.hint = null; }
  if (s === 'GAMEOVER' || s === 'VICTORY') AUD.stopMusic();
}

/* ---- ciclo de vida da partida ---- */

function startRun(fresh) {
  if (fresh) {
    SAVE.checkpoint = 0; SAVE.souls = 0; SAVE.punish = 0; SAVE.absolve = 0;
    SAVE.upgrades = { damage: 0, health: 0, chain: 0, fury: 0, combo: 0 };
    SAVE.seenIntro = false;
    saveGame();
  }
  G.souls = SAVE.souls;
  G.runSouls = 0;
  G.stance = SAVE.stance || 'punir';
  if (!SAVE.seenIntro) {
    startCut(CUTS.intro, function () {
      SAVE.seenIntro = true; saveGame();
      startLevel(SAVE.checkpoint);
    });
  } else startLevel(SAVE.checkpoint);
}

function startLevel(idx) {
  idx = clamp(idx, 0, LEVELS.length - 1);
  G.levelIdx = idx;
  G.level = buildLevel(idx);
  G.enemies.length = 0;
  G.boss = null;
  G.qte = null;
  G.choice = null;
  G.combo = 0; G.comboTimer = 0;
  G.levelDone = false;
  G.negative = 0; G.damageFx = 0; G.whiteFlash = 0;
  G.timeScale = 1; G.tsAcc = 0;
  G.attackTokens = CFG.maxAttackers;
  G.hint = null;
  hitstop = 0;
  for (let i = 0; i < ORB_MAX; i++) G.orbs[i].on = false;
  for (let i = 0; i < SHOT_MAX; i++) G.shots[i].on = false;
  for (let i = 0; i < OBST_MAX; i++) G.obst[i].on = false;
  clearParticles();

  const L = G.level;
  G.player = new Player(90, L.groundY - 44);
  G.player.lastSafeX = 90; G.player.lastSafeY = L.groundY - 44;
  cam.reset(0, 0);
  cam.lockTarget = null;

  if (L.mode === 'bike') startBike();

  AUD.setTrack(TRACKS[Math.min(TRACKS.length - 1, idx)]);
  setState('GAMEPLAY');
}

function completeLevel() {
  SAVE.souls = G.souls;
  SAVE.checkpoint = Math.max(SAVE.checkpoint, Math.min(LEVELS.length - 1, G.levelIdx + 1));
  SAVE.best.level = Math.max(SAVE.best.level || 0, G.levelIdx + 1);
  SAVE.stance = G.stance;
  saveGame();
  if (G.levelIdx >= LEVELS.length - 1) {
    // ultimo circulo -> final
    const isPunish = SAVE.punish >= SAVE.absolve;
    const tag = isPunish ? 'punish' : 'absolve';
    if (SAVE.endings.indexOf(tag) < 0) SAVE.endings.push(tag);
    saveGame();
    startCut(isPunish ? CUTS.ending_punish : CUTS.ending_absolve, function () { setState('VICTORY'); });
  } else {
    setState('SHOP');
  }
}

function startCut(list, next) {
  G.cut = { list: list, i: 0, t: 0, next: next };
  setState('CUTSCENE');
}

/* ---- update por estado ---- */

function updateMenu() {
  if (tapped(MENU_BTN.start)) { AUD.ui(true); loadSave(); startRun(false); return; }
  if (tapped(MENU_BTN.newg)) { AUD.ui(true); startRun(true); return; }
  if (tapped(MENU_BTN.audio)) {
    AUD.ui(true);
    SAVE.audio.music = !SAVE.audio.music; SAVE.audio.sfx = SAVE.audio.music;
    AUD.applyMix(); saveGame();
  }
  if (tapped(MENU_BTN.wipe)) { AUD.deny(); wipeSave(); saveGame(); }
}

function updateCutscene() {
  const cs = G.cut;
  if (!cs) { setState('MENU'); return; }
  cs.t++;
  if (cs.t > 12 && (tappedAnywhere() || IN.btn.attack.pressed || IN.btn.jump.pressed)) {
    AUD.ui(true);
    cs.i++;
    cs.t = 0;
    if (cs.i >= cs.list.length) { const n = cs.next; G.cut = null; n(); }
  }
}

function updateShop() {
  for (let i = 0; i < UPGRADES.length; i++) {
    const u = UPGRADES[i];
    if (!tapped(shopRows[i])) continue;
    const lv = SAVE.upgrades[u.key];
    const cost = upgradeCost(u);
    if (lv >= u.max) { AUD.deny(); continue; }
    if (G.souls < cost) { AUD.deny(); floatText(RW / 2, 120, 'ALMAS INSUFICIENTES', PAL.crimson, 18); continue; }
    G.souls -= cost;
    SAVE.upgrades[u.key]++;
    SAVE.souls = G.souls;
    saveGame();
    AUD.buy();
    vibrate(20);
    burstEmbers(shopRows[i].x + shopRows[i].w - 60, shopRows[i].y + 24, 14, 3, PAL.ember);
  }
  if (tapped(SHOP_UI.cont)) {
    AUD.ui(true);
    const next = G.levelIdx + 1;
    // a moto espectral e' o traslado entre circulos
    startCut(CUTS.ride, function () { startLevel(next); });
  }
}

function updatePause() {
  if (tapped(PAUSE_UI.resume) || IN.btn.pause.pressed) { AUD.ui(false); setState('GAMEPLAY'); return; }
  if (tapped(PAUSE_UI.restart)) { AUD.ui(true); startLevel(G.levelIdx); return; }
  if (tapped(PAUSE_UI.sfx)) { SAVE.audio.sfx = !SAVE.audio.sfx; AUD.applyMix(); saveGame(); AUD.ui(true); }
  if (tapped(PAUSE_UI.music)) { SAVE.audio.music = !SAVE.audio.music; AUD.applyMix(); saveGame(); AUD.ui(true); }
  if (tapped(PAUSE_UI.menu)) { AUD.ui(false); SAVE.souls = G.souls; saveGame(); setState('MENU'); }
}

function updateGameOver() {
  if (tapped(OVER_UI.retry)) { AUD.ui(true); startLevel(G.levelIdx); }
  if (tapped(OVER_UI.menu)) { AUD.ui(false); setState('MENU'); }
}

function updateVictory() {
  if (tapped(WIN_UI.menu) || G.t > 60 && tappedAnywhere()) { AUD.ui(true); setState('MENU'); }
}

/* ---- gameplay ---- */

/** Combate/corrente/furia sem a fisica de caminhada: usado na fase da moto. */
Player.prototype.updateCombatOnly = function () {
  this.stateT++; this.anim++;
  if (this.bufTimer > 0) this.bufTimer--;
  if (this.chain.cd > 0) this.chain.cd--;
  if (this.hurtT > 0) this.hurtT--;

  this.updateChain();

  const bAtk = IN.btn.attack, bChn = IN.btn.chain, bFur = IN.btn.fury;
  if (bFur.pressed && this.fury >= CFG.furyMax && !G.qte) this.triggerFury();
  if (bChn.pressed && this.chain.state === 'idle' && this.chain.cd <= 0) this.fireChain();

  if (bAtk.down) {
    this.chargeT++;
    if (this.chargeT === 26) { AUD.heavyCharge(); this.charged = true; }
  }
  if (bAtk.pressed) this.bufTimer = CFG.inputBuffer;
  if (bAtk.released) {
    if (this.charged) { this.startAttack('heavy'); this.charged = false; }
    else if (this.chargeT < 26) { this.state = 'FALL'; this.startAttack('air'); }
    this.chargeT = 0; this.charged = false;
  }
  if (this.state === 'ATTACK' && this.atk) {
    this.atkT++;
    if (this.atkT >= this.atk.dur) { this.atk = null; this.state = 'FALL'; }
  }

  const tr = this.trail[this.trailI];
  tr.x = this.cx; tr.y = this.cy; tr.a = 1;
  this.trailI = (this.trailI + 1) % this.trail.length;

  if (this.furyT > 0) this.updateFuryBeam();
  if (this.hp <= 0 && !this.dead) this.die();
};

function updateGameplay() {
  const p = G.player;
  if (!p) return;

  // pausa
  if (IN.btn.pause.pressed && !G.qte && !G.choice && !p.dead) { AUD.ui(false); setState('PAUSE'); return; }

  // escolha pos-execucao de boss: congela o mundo
  if (G.choice) {
    updateChoice();
    updateParticles(); updateFloaters(); cam.update();
    return;
  }

  // QTE: mundo parado, so' o anel e as particulas correm
  if (G.qte) {
    updateQTE();
    updateParticles(); updateFloaters();
    const t = cam.lockTarget;
    if (t) { cam.tx = clamp(t.cx - RW / 2, 0, Math.max(0, G.level.width - RW)); cam.ty = clamp(t.cy - RH / 2, -100, 140); }
    cam.update();
    return;
  }

  // hitstop: congela a simulacao mantendo o desenho
  if (hitstop > 0) {
    hitstop--;
    updateParticles(); updateFloaters(); cam.update();
    return;
  }

  // troca de postura PUNIR/ABSOLVER
  if (tapped(STANCE_BTN)) {
    G.stance = G.stance === 'punir' ? 'absolve' : 'punir';
    SAVE.stance = G.stance; saveGame();
    AUD.ui(G.stance === 'absolve');
    vibrate(14);
    floatText(p.cx, p.y - 30, G.stance === 'punir' ? 'PUNIR' : 'ABSOLVER',
              G.stance === 'punir' ? PAL.crimson : PAL.soul, 18);
  }

  const bike = G.level.mode === 'bike';

  if (bike) {
    updateBike();
    p.updateCombatOnly();
  } else {
    p.update();
    updateLevel();
  }

  // inimigos
  for (let i = 0; i < G.enemies.length; i++) {
    const e = G.enemies[i];
    if (e.update) e.update();
  }

  updateShots();
  updateOrbs();
  updateCombat();
  updateFloaters();
  updateParticles();

  // camera
  if (!bike) {
    const L = G.level;
    const bossFight = G.boss && G.boss.alive;
    let tx = p.cx - RW / 2 + p.facing * 46;
    let ty = p.cy - RH / 2 - 26;
    if (bossFight) {
      // enquadra os dois durante o duelo
      tx = (p.cx + G.boss.cx) / 2 - RW / 2;
      ty = (p.cy + G.boss.cy) / 2 - RH / 2 - 20;
      cam.tzoom = 1;
    }
    cam.tx = clamp(tx, 0, Math.max(0, L.width - RW));
    cam.ty = clamp(ty, -120, 150);
  }
  cam.update();

  // fim de fase
  if (G.levelDone) {
    G.levelDoneT = (G.levelDoneT || 0) + 1;
    if (G.levelDoneT > 26) { G.levelDoneT = 0; completeLevel(); }
  } else G.levelDoneT = 0;
}

/* ---- render por estado ---- */

function renderGameplay(c) {
  const L = G.level, p = G.player;
  drawBackground(c, L);

  c.save();
  cam.apply(c);
  drawLevel(c, L);
  if (L.mode === 'bike') drawObst(c);
  drawOrbs(c);

  // inimigos atras, boss por ultimo
  for (let i = 0; i < G.enemies.length; i++) {
    const e = G.enemies[i];
    if (e.isBoss) continue;
    if (e.x + e.w < cam.x - 80 || e.x > cam.x + RW + 80) continue;
    drawEnemy(c, e);
  }
  drawPlayer(c, p);
  for (let i = 0; i < G.enemies.length; i++) if (G.enemies[i].isBoss) drawBoss(c, G.enemies[i]);

  drawShots(c);
  drawParticles(c);
  drawFloaters(c);
  c.restore();

  drawLighting(c, p);
  drawPost(c);

  drawHUD(c);
  drawQTE(c);
  drawChoice(c);
  if (!G.qte && !G.choice) drawTouchControls(c);

  // aviso do portal
  if (L.portalOpen && !G.levelDone) {
    const d = L.portalX - p.cx;
    if (Math.abs(d) > RW / 2 - 60) {
      const x = d > 0 ? RW - 40 : 40;
      const a = 0.4 + 0.4 * Math.sin(G.gt * 0.12);
      c.fillStyle = rgba(PAL.soul, a);
      c.beginPath();
      c.moveTo(x + (d > 0 ? 14 : -14), RH / 2);
      c.lineTo(x, RH / 2 - 14); c.lineTo(x, RH / 2 + 14);
      c.closePath(); c.fill();
      textC(c, 'PORTAL', x, RH / 2 + 30, 11, rgba(PAL.soul, a), 700, 2);
    }
  }
}

function render() {
  const c = ctx;
  c.setTransform(QUALITY.dpr, 0, 0, QUALITY.dpr, 0, 0);
  c.globalAlpha = 1;
  c.globalCompositeOperation = 'source-over';

  switch (G.state) {
    case 'BOOT':
      c.fillStyle = '#07060a'; c.fillRect(0, 0, RW, RH);
      break;
    case 'MENU':
      drawMenu(c);
      break;
    case 'CUTSCENE':
      drawCutscene(c);
      break;
    case 'GAMEPLAY':
      renderGameplay(c);
      break;
    case 'PAUSE':
      renderGameplay(c);
      drawPause(c);
      break;
    case 'GAMEOVER':
      renderGameplay(c);
      drawGameOver(c);
      break;
    case 'SHOP':
      drawShop(c);
      break;
    case 'VICTORY':
      drawVictory(c);
      break;
  }

  // indicador de fps em modo debug (?debug=1)
  if (DEBUG) {
    textL(c, Math.round(fpsAvg) + ' FPS  ' + pAlive + ' PART  ' + G.enemies.length + ' INI  Q' + QUALITY.tier,
          10, RH - 12, 12, rgba(PAL.ember, 0.8), 700);
  }
}

/* ---- update mestre ---- */

function step() {
  G.gt++;
  G.t++;
  updateBgEmbers();

  switch (G.state) {
    case 'BOOT':     if (G.t > 6) setState('MENU'); break;
    case 'MENU':     updateMenu(); updateFloaters(); break;
    case 'CUTSCENE': updateCutscene(); updateParticles(); break;
    case 'GAMEPLAY': updateGameplay(); break;
    case 'PAUSE':    updatePause(); break;
    case 'GAMEOVER': updateGameOver(); updateParticles(); break;
    case 'SHOP':     updateShop(); updateFloaters(); updateParticles(); break;
    case 'VICTORY':  updateVictory(); updateParticles(); break;
  }

  AUD.updateMusic();
  clearTaps();
}

/* ---- loop com acumulador de tempo ---- */

let last = 0, acc = 0, fpsAvg = 60, frameMs = 16.7, dtAvg = 16.7, qualityTimer = 0;
const DEBUG = /[?&]debug=1/.test(location.search);

function frame(now) {
  requestAnimationFrame(frame);
  if (!last) last = now;
  let dt = (now - last) / 1000;
  last = now;
  // aba em background / breakpoint: nao acumula uma avalanche de passos
  if (dt > 0.25) dt = 0.25;
  acc += dt;

  updateInput();

  let steps = 0;
  while (acc >= STEP && steps < MAX_SUBSTEPS) {
    acc -= STEP;
    steps++;
    step();
  }
  if (steps === MAX_SUBSTEPS) acc = 0;

  const t0 = performance.now();
  render();
  frameMs = lerp(frameMs, performance.now() - t0, 0.06);

  // O tempo real do quadro e' a unica medida confiavel: as chamadas de canvas 2D
  // sao enfileiradas e rasterizadas depois, entao cronometrar render() mediria
  // quase nada. A adaptacao de qualidade usa o delta do requestAnimationFrame.
  const ms = dt * 1000;
  if (ms < 200) dtAvg = lerp(dtAvg, ms, 0.06);
  fpsAvg = lerp(fpsAvg, 1 / Math.max(0.001, dt), 0.05);
  adaptQuality();
}

/**
 * Se o quadro passar de ~20ms (menos de 50fps) por dois segundos seguidos,
 * derruba um degrau: menos particulas -> sem iluminacao -> menor DPR.
 * Sobe de volta quando o quadro estabiliza abaixo de 17.2ms.
 * Alvo: 60fps em iPhone/iPad com 15 inimigos e centenas de particulas.
 */
function adaptQuality() {
  if (!QUALITY.auto) return;
  qualityTimer++;
  if (qualityTimer < 120) return;
  qualityTimer = 0;
  if (dtAvg > 20.5 && QUALITY.tier > 0) {
    QUALITY.tier--;
    applyQuality();
  } else if (dtAvg < 17.2 && QUALITY.tier < 2) {
    QUALITY.tier++;
    applyQuality();
  }
}

function applyQuality() {
  if (QUALITY.tier === 2)      { QUALITY.particles = 1.0;  QUALITY.lighting = true;  QUALITY.maxDpr = 1.5; }
  else if (QUALITY.tier === 1) { QUALITY.particles = 0.65; QUALITY.lighting = true;  QUALITY.maxDpr = 1.15; }
  else                         { QUALITY.particles = 0.4;  QUALITY.lighting = false; QUALITY.maxDpr = 1; }
  resize();
}

/* ---- dimensionamento com devicePixelRatio ---- */

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, QUALITY.maxDpr);
  QUALITY.dpr = dpr;
  const aw = window.innerWidth, ah = window.innerHeight;
  const scale = Math.min(aw / RW, ah / RH);
  cv.style.width = Math.floor(RW * scale) + 'px';
  cv.style.height = Math.floor(RH * scale) + 'px';
  const bw = Math.round(RW * dpr), bh = Math.round(RH * dpr);
  if (cv.width !== bw || cv.height !== bh) { cv.width = bw; cv.height = bh; }
  ctx.imageSmoothingEnabled = true;
}

/* ==========================================================================================
   13 PWA  -  manifest inline + service worker inline (string -> Blob)
   ========================================================================================== */

/** Icone gerado no canvas: cranio em chamas sobre fundo preto. */
function makeIcon(size) {
  const oc = document.createElement('canvas');
  oc.width = oc.height = size;
  const c = oc.getContext('2d');
  const s = size / 512;
  c.fillStyle = '#07060a'; c.fillRect(0, 0, size, size);
  const g = c.createRadialGradient(size / 2, size * 0.62, 10 * s, size / 2, size * 0.62, size * 0.6);
  g.addColorStop(0, 'rgba(255,107,0,.55)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = g; c.fillRect(0, 0, size, size);
  c.save();
  c.translate(size / 2, size * 0.58);
  c.scale(s, s);
  // chama
  c.globalCompositeOperation = 'lighter';
  const fg = c.createLinearGradient(0, -230, 0, 60);
  fg.addColorStop(0, 'rgba(255,179,71,0)');
  fg.addColorStop(0.5, 'rgba(255,179,71,.75)');
  fg.addColorStop(1, 'rgba(255,107,0,.9)');
  c.fillStyle = fg;
  c.beginPath();
  c.moveTo(-120, 40);
  c.quadraticCurveTo(-150, -120, -40, -230);
  c.quadraticCurveTo(-30, -120, 20, -190);
  c.quadraticCurveTo(150, -110, 120, 40);
  c.closePath(); c.fill();
  c.globalCompositeOperation = 'source-over';
  // cranio
  c.fillStyle = '#D9CBB3';
  c.beginPath(); c.ellipse(0, -30, 88, 96, 0, 0, TAU); c.fill();
  c.beginPath(); c.moveTo(-58, 46); c.lineTo(58, 46); c.lineTo(44, 108); c.lineTo(-44, 108); c.closePath(); c.fill();
  c.fillStyle = '#07060a';
  c.beginPath(); c.ellipse(-36, -36, 25, 30, 0.2, 0, TAU); c.fill();
  c.beginPath(); c.ellipse(36, -36, 25, 30, -0.2, 0, TAU); c.fill();
  c.beginPath(); c.moveTo(0, 4); c.lineTo(-16, 34); c.lineTo(16, 34); c.closePath(); c.fill();
  c.lineWidth = 7; c.strokeStyle = '#07060a';
  for (let i = -2; i <= 2; i++) { c.beginPath(); c.moveTo(i * 22, 46); c.lineTo(i * 22, 108); c.stroke(); }
  c.restore();
  return oc.toDataURL('image/png');
}

function installPWA() {
  let icon192 = '', icon512 = '';
  try { icon192 = makeIcon(192); icon512 = makeIcon(512); } catch (e) {}

  const base = new URL('.', location.href).href;
  const manifest = {
    name: 'INFERNO RIDER',
    short_name: 'Inferno',
    description: 'Hack\'n\'slash mobile pelos cinco circulos do Inferno.',
    id: base,
    start_url: location.href.split('?')[0],
    scope: base,
    display: 'fullscreen',
    display_override: ['fullscreen', 'standalone'],
    orientation: 'landscape',
    background_color: '#07060a',
    theme_color: '#07060a',
    categories: ['games', 'entertainment'],
    icons: [
      { src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any' },
      { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any' },
      { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'maskable' }
    ]
  };
  try {
    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    document.getElementById('manifest-link').href = URL.createObjectURL(blob);
  } catch (e) {}
  if (icon192) document.getElementById('apple-icon').href = icon192;

  // Service worker inline: cache-first do proprio documento, para rodar offline.
  const swSrc = [
    "const CACHE='inferno-rider-v1';",
    "self.addEventListener('install',e=>{self.skipWaiting();});",
    "self.addEventListener('activate',e=>{e.waitUntil(self.clients.claim());});",
    "self.addEventListener('fetch',e=>{",
    "  if(e.request.method!=='GET')return;",
    "  e.respondWith(caches.open(CACHE).then(async c=>{",
    "    const hit=await c.match(e.request,{ignoreSearch:true});",
    "    const net=fetch(e.request).then(r=>{if(r&&r.status===200)c.put(e.request,r.clone());return r;}).catch(()=>hit);",
    "    return hit||net;",
    "  }));",
    "});"
  ].join('\n');

  // O service worker e' registrado a partir de um Blob, mantendo o jogo em um
  // unico arquivo. Alguns navegadores recusam blob: como script de SW; a falha
  // e' engolida em silencio de proposito - sem ela o console fica limpo e o
  // jogo segue funcionando offline, porque a pagina nao tem nenhum recurso
  // externo para buscar: uma vez carregada, o cache HTTP do navegador (e o
  // webapp adicionado a' tela de inicio no iOS) ja' basta.
  function registerSW() {
    if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
    try {
      const blob = new Blob([swSrc], { type: 'text/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob), { scope: './' })
        .catch(function () { /* blob: recusado - segue sem SW */ });
    } catch (e) { /* idem */ }
  }
  registerSW();
}

/* ==========================================================================================
   BOOT
   ========================================================================================== */

function fatal(msg) {
  const el = document.getElementById('fatal');
  el.style.display = 'block';
  el.innerHTML = '<b>INFERNO RIDER - ERRO</b>\n\n' + String(msg);
}

window.addEventListener('error', function (e) {
  fatal((e.message || 'erro') + '\n' + (e.filename || '') + ':' + (e.lineno || '') + '\n' + (e.error && e.error.stack ? e.error.stack : ''));
});
window.addEventListener('unhandledrejection', function (e) {
  fatal('Promise rejeitada: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
});

function boot() {
  loadSave();
  applyQuality();
  resize();

  // eventos de ponteiro (touch + mouse + caneta) no canvas e na janela
  cv.addEventListener('pointerdown', onPointerDown, { passive: false });
  window.addEventListener('pointermove', onPointerMove, { passive: false });
  window.addEventListener('pointerup', onPointerUp, { passive: false });
  window.addEventListener('pointercancel', onPointerUp, { passive: false });
  // bloqueia scroll/zoom/gesto do Safari
  const kill = e => e.preventDefault();
  document.addEventListener('touchstart', kill, { passive: false });
  document.addEventListener('touchmove', kill, { passive: false });
  document.addEventListener('gesturestart', kill, { passive: false });
  document.addEventListener('dblclick', kill, { passive: false });
  document.addEventListener('contextmenu', kill);

  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('keyup', onKeyUp);
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 120));
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

  // pausa automatica ao sair da aba
  document.addEventListener('visibilitychange', function () {
    if (document.hidden && G.state === 'GAMEPLAY') setState('PAUSE');
    if (!document.hidden) { last = 0; acc = 0; }
  });

  window.addEventListener('gamepadconnected', () => { IN.lastInputWasTouch = false; });

  installPWA();

  setState('BOOT');
  requestAnimationFrame(frame);

  const bootEl = document.getElementById('boot');
  bootEl.classList.add('gone');
  setTimeout(() => bootEl.remove(), 600);
}

boot();
</script>
