/* ---- runtime da fase ---- */

function updateLevel() {
  const L = G.level;
  const p = G.player;

  // vento da Luxuria: rajadas alternadas
  if (L.wind) {
    L.windPhase += 0.008;
    const gust = Math.sin(L.windPhase) + 0.5 * Math.sin(L.windPhase * 2.7);
    L.windForce = gust * 0.34;
    if (G.gt % 2 === 0) {
      emit(PT.SMOKE, cam.x + rnd(-40, RW + 40), rnd(40, RH - 40),
           L.windForce * 9, rnd(-.6, .6), 34, rnd(4, 12), '#5a1030', { add: false, drag: 1 });
    }
  }

  // plataformas que afundam (Avaritia)
  for (let i = 0; i < L.plats.length; i++) {
    const pl = L.plats[i];
    if (!pl.sink) continue;
    if (pl.dead) {
      if (--pl.deadT <= 0) { pl.dead = false; pl.y = pl.origY; pl.sinkT = 0; }
      continue;
    }
    const standing = p.onGround && p.standing === pl;
    if (standing) {
      pl.sinkT++;
      pl.y += 0.85;
      if (pl.sinkT % 6 === 0) burstEmbers(pl.x + pl.w / 2, pl.y, 2, 1.4, PAL.gold);
      if (pl.y > pl.origY + 150) { pl.dead = true; pl.deadT = 200; burstSmoke(pl.x + pl.w / 2, pl.y, 6, '#3a2a06'); }
    } else if (pl.y > pl.origY) {
      pl.y = Math.max(pl.origY, pl.y - 0.5);
    }
  }

  // spawn de inimigos por proximidade de camera
  for (let i = 0; i < L.spawns.length; i++) {
    const s = L.spawns[i];
    if (s.done) continue;
    if (s.x > cam.x + RW + 140) continue;
    if (s.x < cam.x - 200) { s.done = true; continue; }
    s.done = true;
    const e = new Enemy(s.kind, s.x, s.y);
    G.enemies.push(e);
    ringFx(e.cx, e.cy, 30, PAL.crimson, 18);
    burstSmoke(e.cx, e.cy, 5, '#1a1016');
  }

  // boss entra ao pisar na arena
  if (L.bossKind && !L.bossSpawned && p.cx > L.arenaL + 60) {
    L.bossSpawned = true;
    const b = new Boss(L.bossKind, (L.arenaL + L.arenaR) / 2 - BOSS_DEF[L.bossKind].w / 2, L.groundY);
    G.boss = b;
    G.enemies.push(b);
    AUD.roar();
    cam.shake(0.7);
    G.bossIntroT = 150;
    AUD.setTrack(TRACKS[Math.min(4, L.idx)]);
  }

  // portal abre quando o boss cai (ou de cara, nas fases sem boss)
  if (L.bossKind && !L.portalOpen && L.bossSpawned && !G.boss) {
    L.portalOpen = true;
    L.portalX = clamp(p.cx + 220, L.arenaL + 80, L.arenaR - 60);
    AUD.portal();
    ringFx(L.portalX, L.groundY - 60, 80, PAL.soul, 40);
  }

  // conclusao da fase
  if (L.portalOpen && !G.levelDone) {
    const d = Math.abs(p.cx - L.portalX);
    if (d < 46 && Math.abs(p.cy - (L.groundY - 60)) < 130) {
      G.levelDone = true;
      AUD.portal();
      G.whiteFlash = 0.6;
      soulPuff(L.portalX, L.groundY - 60, 40, PAL.soul);
    }
  }

  // dica de tutorial mais proxima
  if (L.hints.length) {
    let best = null, bd = 260;
    for (let i = 0; i < L.hints.length; i++) {
      const h = L.hints[i];
      const d = Math.abs(p.cx - h.x);
      if (d < bd) { bd = d; best = h; }
    }
    G.hint = best ? best.s : null;
  }
}

/* ==========================================================================================
   FASE DA MOTO ESPECTRAL  (auto-scroll: desviar e atacar)
   ========================================================================================== */

function startBike() {
  const p = G.player;
  p.bike = { roll: 0, engine: 0 };
  p.vx = 0; p.vy = 0;
  p.x = 160; p.y = 300;
  G.bikeDist = 0;
  G.bikeGoal = G.level.bikeGoal;
  G.bikeSpawn = 0;
  G.bikeSpeed = 6.2;
  cam.reset(0, 0);
}

function updateBike() {
  const p = G.player;
  const L = G.level;
  const speed = G.bikeSpeed;

  G.bikeDist += speed;
  cam.tx = G.bikeDist;
  cam.ty = 0;
  cam.x = G.bikeDist;     // scroll rigido: sem lag de camera na perseguicao
  cam.y = lerp(cam.y, 0, 0.1);

  // controle 2D livre dentro da faixa jogavel
  p.vx = approach(p.vx, IN.mx * 6.4, 0.9);
  p.vy = approach(p.vy, IN.my * 5.8, 0.9);
  p.x += p.vx; p.y += p.vy;
  p.x = clamp(p.x, cam.x + 60, cam.x + RW - 150);
  p.y = clamp(p.y, 150, L.groundY - 34);
  p.facing = 1;
  p.onGround = false;
  p.bike.roll = lerp(p.bike.roll, IN.my * 0.32, 0.2);
  if (p.invuln > 0) p.invuln--;
  if (p.iframes > 0) p.iframes--;
  if (p.dashCD > 0) p.dashCD--;

  // esquiva rapida na vertical
  if (IN.dashReq && p.dashCD <= 0) {
    p.dashCD = 30; p.iframes = 14;
    p.vy = IN.my * 16;
    AUD.dash();
    for (let i = 0; i < 10; i++) emit(PT.FLAME, p.cx, p.cy, rnd(-3, 0), rnd(-2, 2), 16, rnd(4, 8), PAL.orange, { drag: .9 });
  }

  // som do motor
  if (G.gt % 30 === 0) AUD.bike();

  // rastro de fogo das rodas
  for (let i = 0; i < 2; i++) {
    emit(PT.FLAME, p.x - 6 + rnd(-6, 6), p.y + 26 + rnd(-4, 4), -rnd(2, 6), rnd(-1, 1),
         rndi(14, 26), rnd(3, 7), Math.random() < .5 ? PAL.orange : PAL.ember, { drag: .93 });
  }

  // ---- gerador de obstaculos ----
  G.bikeSpawn--;
  if (G.bikeSpawn <= 0) {
    const prog = G.bikeDist / G.bikeGoal;
    G.bikeSpawn = Math.max(16, 46 - prog * 26);
    const r = Math.random();
    const sx = cam.x + RW + 60;
    if (r < 0.4) {
      // rocha destrutivel
      spawnObst(0, sx, rnd(180, L.groundY - 60), 40, 44, 2, -rnd(0.2, 1.0), 0);
    } else if (r < 0.62) {
      // geiser de sangue subindo do rio
      spawnObst(1, sx, L.groundY - 10, 44, 150, 999, 0, 0);
    } else if (r < 0.82) {
      // corrente de espinhos suspensa
      spawnObst(2, sx, rnd(150, 240), 30, 130, 999, 0, 0);
    } else {
      // alma condenada voando na contramao
      spawnObst(3, sx, rnd(170, L.groundY - 70), 34, 30, 1, -rnd(1.6, 3.2), rnd(-0.6, 0.6));
    }
  }

  // ---- atualiza obstaculos ----
  const atkActive = p.state === 'ATTACK' && p.atk && p.atkT >= p.atk.active[0] && p.atkT <= p.atk.active[1];
  const chainOut = p.chain.state === 'out' || p.chain.state === 'pullthem';
  for (let i = 0; i < OBST_MAX; i++) {
    const o = G.obst[i];
    if (!o.on) continue;
    o.t++;
    o.x += o.vx; o.y += o.vy;
    if (o.kind === 1) {
      // geiser pulsa
      o.h = 120 + Math.sin(o.t * 0.08) * 60;
      o.y = L.groundY - o.h + 10;
      if (o.t % 4 === 0) emit(PT.BLOOD, o.x + o.w / 2 + rnd(-10, 10), o.y + rnd(0, 30), rnd(-.6, .6), rnd(-3, -1), 22, rnd(3, 6), PAL.blood, { add: false, grav: .12 });
    }
    if (o.kind === 3 && o.t % 3 === 0) emit(PT.EMBER, o.x + o.w / 2, o.y + o.h / 2, rnd(-.4, .4), rnd(-.4, .4), 14, 2.4, PAL.crimson, { drag: .94 });
    if (o.x + o.w < cam.x - 80) { o.on = false; continue; }

    // ataque destroi rocha e alma
    if (o.hp < 900) {
      const reach = 70;
      const inChain = chainOut && aabb(p.chain.x - 14, p.chain.y - 14, 28, 28, o.x, o.y, o.w, o.h);
      const inSwing = atkActive && aabb(p.x - 10, p.y - 30, p.w + reach, p.h + 60, o.x, o.y, o.w, o.h);
      if (inChain || inSwing) {
        o.hp--;
        burstSparks(o.x + o.w / 2, o.y + o.h / 2, 8, 1, -0.3, 5, PAL.ember);
        AUD.hit(false);
        freeze(3); cam.shake(0.12);
        if (o.hp <= 0) {
          o.on = false;
          burstEmbers(o.x + o.w / 2, o.y + o.h / 2, 14, 4, PAL.orange);
          spawnOrb(o.x + o.w / 2, o.y + o.h / 2, 1);
          G.combo++; G.comboTimer = CFG.comboWindow; G.comboScale = 1;
          p.addFury(2.2);
        }
        continue;
      }
    }

    // colisao com o jogador
    if (!p.dead && aabb(p.x + 4, p.y + 4, p.w - 8, p.h - 8, o.x, o.y, o.w, o.h)) {
      if (p.iframes <= 0 && p.invuln <= 0) {
        p.takeDamage(o.kind === 1 ? 16 : 13, -1);
        p.x -= 26;
        cam.shake(0.4);
        if (o.hp < 900) { o.on = false; burstEmbers(o.x + o.w / 2, o.y + o.h / 2, 12, 4, PAL.crimson); }
      }
    }
  }

  // rio de sangue no fundo queima quem encosta
  if (p.y + p.h > L.groundY + 4 && p.iframes <= 0 && p.invuln <= 0) {
    p.takeDamage(12, 1);
    p.y = L.groundY - p.h - 20;
  }

  // chegou ao fim da perseguicao -> arena do boss
  if (G.bikeDist >= G.bikeGoal) enterBikeArena();
}

function enterBikeArena() {
  const idx = G.levelIdx;
  G.level = buildBikeArena(idx);
  for (let i = 0; i < OBST_MAX; i++) G.obst[i].on = false;
  const p = G.player;
  p.bike = null;
  p.x = 120; p.y = G.level.groundY - p.h - 10;
  p.vx = 0; p.vy = 0;
  p.invuln = 60;
  cam.reset(0, 0);
  clearParticles();
  G.whiteFlash = 0.8;
  AUD.portal();
  floatText(p.cx, p.y - 30, 'FIM DA CORRIDA', PAL.ember, 22);
}

/* ==========================================================================================
   10 RENDER
   ========================================================================================== */

const cv = document.getElementById('game');
const ctx = cv.getContext('2d', { alpha: false, desynchronized: true });
const FONT = '"Oswald","Arial Narrow","Haettenschweiler",Impact,sans-serif';

/** Tipografia condensada em caixa alta, com tracking. */
function setFont(c, size, weight) {
  c.font = (weight || 700) + ' ' + size + 'px ' + FONT;
}
function textC(c, s, x, y, size, col, weight, track) {
  setFont(c, size, weight);
  c.fillStyle = col;
  c.textAlign = 'center'; c.textBaseline = 'middle';
  if (track) {
    // tracking manual: canvas nao tem letter-spacing confiavel em Safari
    const chars = s.split('');
    let total = 0;
    for (let i = 0; i < chars.length; i++) total += c.measureText(chars[i]).width + track;
    total -= track;
    let cx = x - total / 2;
    for (let i = 0; i < chars.length; i++) {
      const w = c.measureText(chars[i]).width;
      c.fillText(chars[i], cx + w / 2, y);
      cx += w + track;
    }
  } else c.fillText(s, x, y);
}
function textL(c, s, x, y, size, col, weight) {
  setFont(c, size, weight); c.fillStyle = col;
  c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillText(s, x, y);
}
function textR(c, s, x, y, size, col, weight) {
  setFont(c, size, weight); c.fillStyle = col;
  c.textAlign = 'right'; c.textBaseline = 'middle'; c.fillText(s, x, y);
}

/* ---- brasas de fundo: campo continuo, independente das particulas de combate ---- */
const BG_EMBERS = 110;
const bgEmb = new Array(BG_EMBERS);
for (let i = 0; i < BG_EMBERS; i++) {
  bgEmb[i] = { x: Math.random() * RW * 2, y: Math.random() * RH, v: rnd(0.25, 1.1), s: rnd(0.8, 2.6), p: rnd(0, TAU), d: rnd(0.3, 0.9) };
}
function updateBgEmbers() {
  for (let i = 0; i < BG_EMBERS; i++) {
    const e = bgEmb[i];
    e.y -= e.v;
    e.p += 0.03;
    if (e.y < -10) { e.y = RH + 10; e.x = Math.random() * RW * 2; }
  }
}

/** Gera as silhuetas de parallax da fase (uma vez por fase). */
function ensureBackdrop(L) {
  if (L.bg) return;
  const rng = mulberry32(4242 + L.idx * 313);
  const mk = (n, minH, maxH, spread) => {
    const arr = [];
    for (let i = 0; i < n; i++) {
      arr.push({
        x: rng() * spread,
        w: 70 + rng() * 190,
        h: minH + rng() * (maxH - minH),
        k: rng()
      });
    }
    arr.sort((a, b) => a.x - b.x);
    return arr;
  };
  L.bg = {
    far: mk(26, 120, 300, 2600),
    mid: mk(22, 150, 340, 2400),
    near: mk(18, 180, 380, 2200)
  };

  // O ceu e o clarao do horizonte sao fixos em espaco de tela: rasterizamos uma
  // vez num canvas offscreen e depois so' fazemos o blit. Duas avaliacoes de
  // gradiente em tela cheia por quadro viram uma copia de imagem opaca.
  const sc = document.createElement('canvas');
  sc.width = RW; sc.height = RH;
  const s = sc.getContext('2d');
  const P = L.pal;
  const g = s.createLinearGradient(0, 0, 0, RH);
  g.addColorStop(0, P.sky1); g.addColorStop(0.62, P.sky2); g.addColorStop(1, '#000');
  s.fillStyle = g; s.fillRect(0, 0, RW, RH);
  const gg = s.createRadialGradient(RW * 0.5, RH * 0.78, 20, RW * 0.5, RH * 0.78, RW * 0.7);
  gg.addColorStop(0, rgba(P.accent, 0.16));
  gg.addColorStop(1, 'rgba(0,0,0,0)');
  s.fillStyle = gg; s.fillRect(0, 0, RW, RH);
  L.sky = sc;
}

/** Desenha uma camada de espiras/montanhas com deslocamento parallax. */
function drawLayer(c, arr, parX, baseY, col, span, jag) {
  const ox = -(cam.x * parX) % span;
  c.fillStyle = col;
  for (let rep = 0; rep < 3; rep++) {
    const off = ox + rep * span - span;
    for (let i = 0; i < arr.length; i++) {
      const s = arr[i];
      const x = s.x + off;
      if (x + s.w < -60 || x > RW + 60) continue;
      c.beginPath();
      c.moveTo(x, baseY);
      if (jag) {
        // espiras irregulares: perfil de estalagmite
        c.lineTo(x + s.w * 0.18, baseY - s.h * 0.55);
        c.lineTo(x + s.w * 0.34, baseY - s.h * 0.82);
        c.lineTo(x + s.w * 0.5, baseY - s.h);
        c.lineTo(x + s.w * 0.66, baseY - s.h * 0.76);
        c.lineTo(x + s.w * 0.84, baseY - s.h * 0.48);
      } else {
        c.lineTo(x + s.w * 0.5, baseY - s.h);
      }
      c.lineTo(x + s.w, baseY);
      c.closePath();
      c.fill();
    }
  }
}

function drawBackground(c, L) {
  ensureBackdrop(L);
  const P = L.pal;

  // ceu + clarao do horizonte, pre-rasterizados
  c.drawImage(L.sky, 0, 0);

  // tres camadas de parallax
  drawLayer(c, L.bg.far,  0.14, RH * 0.86, P.far,  2600, false);
  drawLayer(c, L.bg.mid,  0.34, RH * 0.92, P.mid,  2400, true);
  drawLayer(c, L.bg.near, 0.62, RH * 1.02, P.near, 2200, true);

  // brasas subindo (sempre)
  c.globalCompositeOperation = 'lighter';
  for (let i = 0; i < BG_EMBERS; i++) {
    const e = bgEmb[i];
    const x = (e.x - cam.x * e.d * 0.5) % (RW * 2);
    const px = x < 0 ? x + RW * 2 : x;
    if (px > RW + 6) continue;
    const a = 0.16 + 0.34 * (1 - e.y / RH);
    c.fillStyle = rgba(i % 5 === 0 ? PAL.ember : PAL.orange, a);
    const sw = e.s + Math.sin(e.p) * 0.5;
    c.fillRect(px, e.y, sw, sw * 1.6);
  }
  c.globalCompositeOperation = 'source-over';

  // nevoa do Limbo / neve da Traicao
  if (L.idx === 0) {
    c.fillStyle = rgba(P.fog, 0.06);
    for (let i = 0; i < 5; i++) {
      const y = 200 + i * 60 + Math.sin(G.gt * 0.004 + i) * 14;
      c.fillRect(0, y, RW, 42);
    }
  }
}

/* ---- cenario ---- */

function drawLevel(c, L) {
  const P = L.pal;

  // rio de sangue / lago congelado ao fundo do vao
  if (L.mode === 'bike' || L.idx === 3) {
    const y = L.groundY;
    const g = c.createLinearGradient(0, y, 0, y + 200);
    g.addColorStop(0, '#8B0000');
    g.addColorStop(0.4, '#4a0505');
    g.addColorStop(1, '#150101');
    c.fillStyle = g;
    c.fillRect(cam.x - 40, y, RW + 80, 260);
    c.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 14; i++) {
      const wx = cam.x + ((i * 137 + G.gt * 2.6) % (RW + 80)) - 40;
      const wy = y + 14 + (i % 4) * 22;
      c.fillStyle = rgba(PAL.crimson, 0.14);
      c.fillRect(wx, wy, 70, 3);
    }
    c.globalCompositeOperation = 'source-over';
  }

  // plataformas
  for (let i = 0; i < L.plats.length; i++) {
    const p = L.plats[i];
    if (p.dead) continue;
    if (p.x + p.w < cam.x - 60 || p.x > cam.x + RW + 60) continue;

    if (p.oneway) {
      // plataforma flutuante: laje fina com brilho na borda
      c.fillStyle = P.ground;
      c.fillRect(p.x, p.y, p.w, p.h);
      c.fillStyle = P.edge;
      c.fillRect(p.x, p.y, p.w, 3);
      c.globalCompositeOperation = 'lighter';
      c.fillStyle = rgba(P.accent, p.sink ? 0.24 : 0.12);
      c.fillRect(p.x, p.y, p.w, 1.5);
      c.globalCompositeOperation = 'source-over';
      // suportes pendentes
      c.fillStyle = rgba('#000000', 0.5);
      c.fillRect(p.x + 8, p.y + p.h, 4, 12);
      c.fillRect(p.x + p.w - 12, p.y + p.h, 4, 12);
      if (p.sink) {
        c.fillStyle = rgba(PAL.gold, 0.5);
        c.fillRect(p.x + p.w / 2 - 8, p.y - 4, 16, 2);
      }
    } else {
      // O gradiente vive em coordenadas de mundo, entao pode ser criado uma vez
      // e reaproveitado sob a transformacao de camera.
      if (!p._g) {
        const g = c.createLinearGradient(0, p.y, 0, p.y + Math.min(p.h, 180));
        g.addColorStop(0, P.edge);
        g.addColorStop(0.06, P.ground);
        g.addColorStop(1, '#000');
        p._g = g;
      }
      c.fillStyle = p._g;
      c.fillRect(p.x, p.y, p.w, p.h);
      // faixa de superficie: sem ela o chao vira um vazio preto
      c.fillStyle = P.edge;
      c.fillRect(p.x, p.y, p.w, 7);
      c.globalCompositeOperation = 'lighter';
      c.fillStyle = rgba(P.accent, 0.22);
      c.fillRect(p.x, p.y, p.w, 2);
      c.globalCompositeOperation = 'source-over';
      c.fillStyle = rgba('#000000', 0.35);
      c.fillRect(p.x, p.y + 7, p.w, 2);
      // entulho e rachaduras dao leitura de profundidade ao piso
      if (p.w > 100) {
        c.strokeStyle = rgba('#000000', 0.5); c.lineWidth = 2;
        for (let k = 0; k < 3; k++) {
          const cx0 = p.x + ((k * 97 + p.x * 3) % (p.w - 20)) + 10;
          c.beginPath(); c.moveTo(cx0, p.y + 9); c.lineTo(cx0 + 6, p.y + 28); c.lineTo(cx0 - 3, p.y + 48); c.stroke();
        }
        c.fillStyle = rgba(P.edge, 0.5);
        for (let k = 0; k < 6; k++) {
          const rx = p.x + ((k * 163 + p.x * 7) % (p.w - 16)) + 8;
          const ry = p.y + 14 + ((k * 53) % 46);
          c.fillRect(rx, ry, 5 + (k % 3) * 3, 3);
        }
      }
    }
  }

  // perigos
  for (let i = 0; i < L.hazards.length; i++) {
    const h = L.hazards[i];
    if (h.x + h.w < cam.x - 60 || h.x > cam.x + RW + 60) continue;
    const isGold = h.kind === 'gold';
    const c1 = isGold ? '#FFD27A' : (h.kind === 'blood' ? '#8B0000' : '#555');
    const c2 = isGold ? '#7a4c00' : (h.kind === 'blood' ? '#2a0202' : '#111');
    if (!h._g) {
      const g = c.createLinearGradient(0, h.y, 0, h.y + h.h);
      g.addColorStop(0, c1); g.addColorStop(1, c2);
      h._g = g;
    }
    // Superficie ondulante em vez de um retangulo chapado: uma laje solida
    // pareceria chao pisavel em vez de poca fervente.
    const amp = 3.5, segW = 14, n = Math.ceil(h.w / segW);
    c.fillStyle = h._g;
    c.beginPath();
    c.moveTo(h.x, h.y + h.h);
    for (let s = 0; s <= n; s++) {
      const sx = h.x + Math.min(s * segW, h.w);
      c.lineTo(sx, h.y + Math.sin(G.gt * 0.055 + sx * 0.06) * amp);
    }
    c.lineTo(h.x + h.w, h.y + h.h);
    c.closePath();
    c.fill();
    // crista incandescente na linha do liquido
    c.globalCompositeOperation = 'lighter';
    c.strokeStyle = rgba(isGold ? PAL.gold : PAL.crimson, 0.55);
    c.lineWidth = 2.5;
    c.beginPath();
    for (let s = 0; s <= n; s++) {
      const sx = h.x + Math.min(s * segW, h.w);
      const sy = h.y + Math.sin(G.gt * 0.055 + sx * 0.06) * amp;
      if (s === 0) c.moveTo(sx, sy); else c.lineTo(sx, sy);
    }
    c.stroke();
    c.globalCompositeOperation = 'source-over';
    if (G.gt % 6 === 0 && Math.random() < 0.5) {
      emit(PT.EMBER, h.x + Math.random() * h.w, h.y, rnd(-.3, .3), rnd(-1.4, -.4), 26, rnd(1.6, 3),
           isGold ? PAL.gold : PAL.crimson, { drag: .96 });
    }
  }

  // pontos de gancho
  for (let i = 0; i < L.hooks.length; i++) {
    const h = L.hooks[i];
    if (h.x < cam.x - 40 || h.x > cam.x + RW + 40) continue;
    const near = dist2(h.x, h.y, G.player.cx, G.player.cy) < G.player.chainRange * G.player.chainRange;
    const pulse = 0.5 + 0.5 * Math.sin(G.gt * 0.09);
    c.strokeStyle = rgba(PAL.ember, near ? 0.5 + pulse * 0.4 : 0.2);
    c.lineWidth = 2.5;
    c.beginPath(); c.arc(h.x, h.y, 10 + pulse * 2, 0, TAU); c.stroke();
    c.fillStyle = rgba(PAL.orange, near ? 0.35 : 0.12);
    c.beginPath(); c.arc(h.x, h.y, 4, 0, TAU); c.fill();
    c.strokeStyle = rgba('#000000', 0.6); c.lineWidth = 2;
    c.beginPath(); c.moveTo(h.x, h.y - 10); c.lineTo(h.x, h.y - 40); c.stroke();
  }

  // portal
  if (L.portalOpen) {
    const px = L.portalX, py = L.groundY - 62;
    const t = G.gt * 0.05;
    c.globalCompositeOperation = 'lighter';
    for (let i = 4; i >= 0; i--) {
      const r = 26 + i * 9 + Math.sin(t + i) * 4;
      c.fillStyle = rgba(i % 2 ? PAL.soul : PAL.orange, 0.1);
      c.beginPath(); c.ellipse(px, py, r * 0.62, r, 0, 0, TAU); c.fill();
    }
    c.globalCompositeOperation = 'source-over';
    c.strokeStyle = rgba(PAL.soul, 0.8); c.lineWidth = 3;
    c.beginPath(); c.ellipse(px, py, 26, 46, 0, 0, TAU); c.stroke();
    if (G.gt % 3 === 0) emit(PT.SOUL, px + rnd(-18, 18), py + rnd(-38, 38), rnd(-.4, .4), rnd(-1.2, -.2), 34, rnd(2, 4), PAL.soul, { drag: .96 });
  }
}

/* ---- obstaculos da moto ---- */
function drawObst(c) {
  for (let i = 0; i < OBST_MAX; i++) {
    const o = G.obst[i];
    if (!o.on) continue;
    if (o.kind === 0) {
      // rocha de osso
      c.fillStyle = '#2a2320';
      c.beginPath();
      c.moveTo(o.x, o.y + o.h);
      c.lineTo(o.x + o.w * 0.12, o.y + o.h * 0.3);
      c.lineTo(o.x + o.w * 0.5, o.y);
      c.lineTo(o.x + o.w * 0.9, o.y + o.h * 0.34);
      c.lineTo(o.x + o.w, o.y + o.h);
      c.closePath(); c.fill();
      c.fillStyle = rgba(PAL.bone, 0.22);
      c.fillRect(o.x + 6, o.y + 10, o.w - 14, 3);
      if (o.hp <= 1) { c.fillStyle = rgba(PAL.crimson, 0.4); c.fillRect(o.x + 4, o.y + o.h * 0.5, o.w - 8, 3); }
    } else if (o.kind === 1) {
      const g = c.createLinearGradient(0, o.y, 0, o.y + o.h);
      g.addColorStop(0, '#FF3B3B'); g.addColorStop(0.4, '#8B0000'); g.addColorStop(1, '#3a0202');
      c.fillStyle = g;
      c.fillRect(o.x, o.y, o.w, o.h);
      c.globalCompositeOperation = 'lighter';
      c.fillStyle = rgba(PAL.crimson, 0.3);
      c.fillRect(o.x - 4, o.y, o.w + 8, 10);
      c.globalCompositeOperation = 'source-over';
    } else if (o.kind === 2) {
      // corrente de espinhos pendurada
      c.strokeStyle = '#3a3230'; c.lineWidth = 5;
      c.beginPath(); c.moveTo(o.x + o.w / 2, 0); c.lineTo(o.x + o.w / 2, o.y); c.stroke();
      c.fillStyle = '#4a3f3a';
      for (let k = 0; k < 5; k++) {
        const yy = o.y + k * (o.h / 5);
        c.beginPath();
        c.moveTo(o.x, yy + 14); c.lineTo(o.x + o.w / 2, yy); c.lineTo(o.x + o.w, yy + 14);
        c.closePath(); c.fill();
      }
      c.fillStyle = rgba(PAL.bone, 0.25);
      c.fillRect(o.x + 2, o.y, o.w - 4, 2);
    } else {
      // alma condenada voando
      c.fillStyle = rgba(PAL.crimson, 0.9);
      c.beginPath(); c.ellipse(o.x + o.w / 2, o.y + o.h / 2, o.w / 2, o.h / 2, 0, 0, TAU); c.fill();
      c.fillStyle = '#000';
      c.beginPath(); c.arc(o.x + o.w * 0.35, o.y + o.h * 0.4, 3, 0, TAU); c.fill();
      c.beginPath(); c.arc(o.x + o.w * 0.65, o.y + o.h * 0.4, 3, 0, TAU); c.fill();
      c.globalCompositeOperation = 'lighter';
      c.fillStyle = rgba(PAL.crimson, 0.2);
      c.beginPath(); c.arc(o.x + o.w / 2, o.y + o.h / 2, o.w, 0, TAU); c.fill();
      c.globalCompositeOperation = 'source-over';
    }
  }
}

/* ---- orbes e projeteis ---- */
function drawOrbs(c) {
  c.globalCompositeOperation = 'lighter';
  for (let i = 0; i < ORB_MAX; i++) {
    const o = G.orbs[i];
    if (!o.on) continue;
    const pulse = 0.7 + 0.3 * Math.sin(G.gt * 0.16 + o.x);
    const col = G.stance === 'punir' ? PAL.crimson : PAL.soul;
    c.fillStyle = rgba(col, 0.22);
    c.beginPath(); c.arc(o.x, o.y, 12 * pulse, 0, TAU); c.fill();
    c.fillStyle = rgba(PAL.white, 0.9);
    c.beginPath(); c.arc(o.x, o.y, 3.2, 0, TAU); c.fill();
  }
  c.globalCompositeOperation = 'source-over';
}

function drawShots(c) {
  for (let i = 0; i < SHOT_MAX; i++) {
    const s = G.shots[i];
    if (!s.on) continue;
    c.globalCompositeOperation = 'lighter';
    c.fillStyle = rgba(s.col, 0.24);
    c.beginPath(); c.arc(s.x, s.y, s.r * 2.1, 0, TAU); c.fill();
    c.globalCompositeOperation = 'source-over';
    if (s.kind === 3 || s.kind === 4) {
      // lasca / pilar de gelo
      c.save(); c.translate(s.x, s.y);
      c.rotate(s.kind === 4 ? 0 : Math.atan2(s.vy, s.vx) + Math.PI / 2);
      c.fillStyle = s.col;
      c.beginPath(); c.moveTo(0, -s.r * 1.8); c.lineTo(s.r * 0.7, s.r); c.lineTo(-s.r * 0.7, s.r); c.closePath(); c.fill();
      c.fillStyle = rgba(PAL.white, 0.6);
      c.beginPath(); c.moveTo(0, -s.r * 1.6); c.lineTo(s.r * 0.24, s.r * 0.4); c.lineTo(-s.r * 0.2, s.r * 0.4); c.closePath(); c.fill();
      c.restore();
    } else if (s.kind === 1) {
      c.fillStyle = s.col;
      c.beginPath();
      c.moveTo(s.x - s.r, s.y + 10); c.lineTo(s.x, s.y - s.r - 6); c.lineTo(s.x + s.r, s.y + 10);
      c.closePath(); c.fill();
    } else {
      c.fillStyle = s.col;
      c.beginPath(); c.arc(s.x, s.y, s.r, 0, TAU); c.fill();
      c.fillStyle = rgba(PAL.white, 0.75);
      c.beginPath(); c.arc(s.x - s.vx * 0.3, s.y - s.vy * 0.3, s.r * 0.42, 0, TAU); c.fill();
    }
  }
}

/* ---- particulas ---- */
function drawParticles(c) {
  // passe aditivo (fogo, alma, faisca)
  c.globalCompositeOperation = 'lighter';
  for (let i = 0; i < P_MAX; i++) {
    const p = parts[i];
    if (!p.on || !p.add) continue;
    const k = p.life / p.max;
    const a = k * k;
    switch (p.type) {
      case PT.RING: {
        const r = p.size * (1 - k) + 6;
        c.strokeStyle = rgba(p.col, a * 0.8);
        c.lineWidth = 2 + 3 * k;
        c.beginPath(); c.arc(p.x, p.y, r, 0, TAU); c.stroke();
        break;
      }
      case PT.SPARK: {
        c.strokeStyle = rgba(p.col, a);
        c.lineWidth = p.size * 0.6;
        c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(p.x - p.vx * 2.2, p.y - p.vy * 2.2); c.stroke();
        break;
      }
      default: {
        const s = p.size * (0.4 + k * 0.8);
        c.fillStyle = rgba(p.col, a * 0.85);
        c.beginPath(); c.arc(p.x, p.y, s, 0, TAU); c.fill();
      }
    }
  }
  // passe normal (fumaca, sangue, estilhaco)
  c.globalCompositeOperation = 'source-over';
  for (let i = 0; i < P_MAX; i++) {
    const p = parts[i];
    if (!p.on || p.add) continue;
    const k = p.life / p.max;
    if (p.type === PT.SMOKE) {
      c.fillStyle = rgba(p.col, k * 0.34);
      c.beginPath(); c.arc(p.x, p.y, p.size * (1.6 - k), 0, TAU); c.fill();
    } else if (p.type === PT.SHARD) {
      c.save(); c.translate(p.x, p.y); c.rotate(p.rot);
      c.fillStyle = rgba(p.col, k);
      c.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      c.restore();
    } else {
      c.fillStyle = rgba(p.col, Math.min(1, k * 1.4));
      c.beginPath(); c.arc(p.x, p.y, p.size * (0.5 + k * 0.6), 0, TAU); c.fill();
    }
  }
}

function drawFloaters(c) {
  for (let i = 0; i < TXT_MAX; i++) {
    const f = floaters[i];
    if (!f.on) continue;
    const k = f.life / f.max;
    const a = k > 0.7 ? 1 : k / 0.7;
    const pop = f.life > f.max - 6 ? 1.4 - (f.max - f.life) / 6 * 0.4 : 1;
    c.save();
    c.translate(f.x, f.y);
    c.scale(pop, pop);
    c.globalAlpha = a;
    setFont(c, f.size, 700);
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillStyle = 'rgba(0,0,0,.7)';
    c.fillText(f.s, 1.5, 1.5);
    c.fillStyle = f.col;
    c.fillText(f.s, 0, 0);
    c.restore();
    c.globalAlpha = 1;
  }
}

/* ------------------------------------------------------------------------------------------
   CINZA  -  desenhado inteiramente com paths. Corpo em brasa, cranio flamejante,
   manto rasgado e a corrente enrolada no braco.
   ------------------------------------------------------------------------------------------ */

function limb(c, x1, y1, x2, y2, w, col) {
  c.strokeStyle = col; c.lineWidth = w; c.lineCap = 'round';
  c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();
}

/** Chama aditiva: tres lobos oscilando, usada na cabeca, ombros e rastro. */
function flame(c, x, y, w, h, t, col1, col2, alpha) {
  c.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 3; i++) {
    const ph = t * 0.18 + i * 2.1;
    const ox = Math.sin(ph) * w * 0.28;
    const hh = h * (0.6 + 0.4 * Math.abs(Math.sin(ph * 0.7 + i)));
    const g = c.createLinearGradient(x, y - hh, x, y + h * 0.2);
    g.addColorStop(0, rgba(col2, 0));
    g.addColorStop(0.45, rgba(col2, (alpha === undefined ? 0.5 : alpha) * 0.7));
    g.addColorStop(1, rgba(col1, (alpha === undefined ? 0.55 : alpha)));
    c.fillStyle = g;
    c.beginPath();
    c.moveTo(x - w * 0.5, y + h * 0.15);
    c.quadraticCurveTo(x - w * 0.42 + ox, y - hh * 0.5, x + ox, y - hh);
    c.quadraticCurveTo(x + w * 0.42 + ox, y - hh * 0.5, x + w * 0.5, y + h * 0.15);
    c.closePath();
    c.fill();
  }
  c.globalCompositeOperation = 'source-over';
}

function drawPlayer(c, p) {
  // ---- rastro de fogo: posicoes anteriores com alpha decrescente ----
  c.globalCompositeOperation = 'lighter';
  for (let i = 0; i < p.trail.length; i++) {
    const idx = (p.trailI + i) % p.trail.length;
    const t = p.trail[idx];
    const k = i / p.trail.length;
    if (t.a <= 0) continue;
    const a = k * k * 0.34;
    if (a < 0.01) continue;
    c.fillStyle = rgba(k > 0.6 ? PAL.ember : PAL.orange, a);
    c.beginPath();
    c.ellipse(t.x, t.y, 9 * k + 2, 15 * k + 3, 0, 0, TAU);
    c.fill();
  }
  c.globalCompositeOperation = 'source-over';

  // ---- corrente esticada ----
  const ch = p.chain;
  if (ch.state !== 'idle') {
    const hx = p.cx + p.facing * 9, hy = p.cy - 6;
    const segs = 12;
    c.lineCap = 'round';
    for (let i = 0; i < segs; i++) {
      const t0 = i / segs, t1 = (i + 1) / segs;
      const x0 = lerp(hx, ch.x, t0), y0 = lerp(hy, ch.y, t0) + Math.sin(G.gt * 0.3 + i) * 2;
      const x1 = lerp(hx, ch.x, t1), y1 = lerp(hy, ch.y, t1) + Math.sin(G.gt * 0.3 + i + 1) * 2;
      c.strokeStyle = '#3a2a22'; c.lineWidth = 5;
      c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
      c.globalCompositeOperation = 'lighter';
      c.strokeStyle = rgba(i > segs * 0.4 ? PAL.orange : PAL.ember, 0.5);
      c.lineWidth = 2.6;
      c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
      c.globalCompositeOperation = 'source-over';
    }
    // ponta em brasa
    flame(c, ch.x, ch.y + 6, 16, 20, G.gt, PAL.orange, PAL.ember, 0.7);
    c.fillStyle = '#4a3228';
    c.beginPath(); c.arc(ch.x, ch.y, 6, 0, TAU); c.fill();
  }

  if (p.bike) { drawBike(c, p); return; }

  if (!p.dead) contactShadow(c, p, false);

  const t = G.gt;
  const bob = p.onGround && p.state === 'RUN' ? Math.sin(p.anim * 0.28) * 1.6 : 0;
  const inv = p.invuln > 0 && Math.floor(t / 3) % 2 === 0;

  c.save();
  c.translate(Math.round(p.cx), Math.round(p.y + p.h) + bob);
  c.scale(p.facing, 1);
  if (p.state === 'HURT') c.rotate(-0.16);
  if (p.state === 'DASH') c.rotate(0.1);
  if (p.dead) c.rotate(clamp(G.deathT * 0.02, 0, 1.4));
  c.globalAlpha = inv ? 0.55 : 1;

  const DARK = '#1d1214', MID = '#3a1d1f', RIM = PAL.orange;

  /* --- manto rasgado atras --- */
  const sway = clamp(-p.vx * 2.4, -16, 16) + Math.sin(t * 0.1) * 2;
  c.fillStyle = '#1a0a0c';
  c.beginPath();
  c.moveTo(-3, -36);
  c.quadraticCurveTo(-16 + sway * 0.3, -22, -20 + sway, -2);
  c.lineTo(-14 + sway, -6);
  c.lineTo(-11 + sway * 0.8, 2);
  c.lineTo(-7 + sway * 0.6, -8);
  c.lineTo(-3 + sway * 0.4, 0);
  c.lineTo(1, -18);
  c.closePath(); c.fill();

  /* --- pernas --- */
  let la, lb;
  if (p.state === 'RUN') { const ph = p.anim * 0.3; la = Math.sin(ph) * 0.75; lb = Math.sin(ph + Math.PI) * 0.75; }
  else if (!p.onGround) { la = -0.45; lb = 0.4; }
  else if (p.state === 'ATTACK') { la = 0.42; lb = -0.3; }
  else { la = 0.1 + Math.sin(t * 0.05) * 0.04; lb = -0.12; }
  const hipY = -19;
  limb(c, 0, hipY, Math.sin(la) * 13, hipY + Math.cos(la) * 19, 6.5, DARK);
  limb(c, 0, hipY, Math.sin(lb) * 13, hipY + Math.cos(lb) * 19, 6.5, MID);
  // botas em brasa
  c.fillStyle = rgba(RIM, 0.5);
  c.fillRect(Math.sin(la) * 13 - 4, hipY + Math.cos(la) * 19 - 2, 9, 3);
  c.fillRect(Math.sin(lb) * 13 - 4, hipY + Math.cos(lb) * 19 - 2, 9, 3);

  /* --- torso --- */
  const lean = p.state === 'RUN' ? 0.1 : (p.state === 'ATTACK' ? 0.16 : 0.03);
  c.save();
  c.translate(0, hipY);
  c.rotate(lean);
  const g = c.createLinearGradient(-9, -18, 9, 2);
  g.addColorStop(0, MID); g.addColorStop(1, DARK);
  c.fillStyle = g;
  c.beginPath();
  c.moveTo(-7, 2); c.lineTo(-9, -12); c.lineTo(-6, -17);
  c.lineTo(6, -17); c.lineTo(9, -12); c.lineTo(7, 2);
  c.closePath(); c.fill();
  // contorno em brasa: separa a armadura do fundo quase preto
  c.strokeStyle = rgba(RIM, 0.5); c.lineWidth = 1.2; c.stroke();
  // costelas brilhando por dentro da armadura
  c.globalCompositeOperation = 'lighter';
  c.strokeStyle = rgba(RIM, 0.35); c.lineWidth = 1.4;
  for (let i = 0; i < 3; i++) {
    c.beginPath(); c.moveTo(-5, -4 - i * 4.6); c.lineTo(5, -6 - i * 4.6); c.stroke();
  }
  c.globalCompositeOperation = 'source-over';
  // ombreiras
  c.fillStyle = '#2c1416';
  c.beginPath(); c.ellipse(-8, -14, 5.5, 4.5, -0.3, 0, TAU); c.fill();
  c.beginPath(); c.ellipse(8, -14, 6.5, 5, 0.3, 0, TAU); c.fill();
  c.restore();

  /* --- bracos --- */
  const shY = hipY - 14;
  let armF, armB;
  if (p.state === 'ATTACK' && p.atk) {
    const k = clamp(p.atkT / p.atk.dur, 0, 1);
    armF = lerp(-2.1, 1.5, ease.outCubic(Math.min(1, k * 2)));
    armB = 0.6;
  } else if (p.state === 'RUN') {
    const ph = p.anim * 0.3;
    armF = Math.sin(ph + Math.PI) * 0.6 + 0.2;
    armB = Math.sin(ph) * 0.6 + 0.2;
  } else if (!p.onGround) { armF = -0.9; armB = -0.5; }
  else { armF = 0.35 + Math.sin(t * 0.05) * 0.05; armB = 0.25; }
  limb(c, -4, shY, -4 + Math.sin(armB) * 14, shY + Math.cos(armB) * 14, 5, DARK);
  const hx = 4 + Math.sin(armF) * 15, hy = shY + Math.cos(armF) * 15;
  limb(c, 4, shY, hx, hy, 5.5, MID);
  // corrente enrolada no antebraco quando ociosa
  if (p.chain.state === 'idle') {
    c.strokeStyle = '#3a2a22'; c.lineWidth = 2.2;
    for (let i = 0; i < 4; i++) {
      const k = 0.35 + i * 0.16;
      c.beginPath();
      c.arc(lerp(4, hx, k), lerp(shY, hy, k), 3.4, 0, TAU);
      c.stroke();
    }
  }

  /* --- cranio em chamas --- */
  const headY = hipY - 21;
  flame(c, 0, headY - 4, 22, 30, t, PAL.orange, PAL.ember, 0.34);
  c.fillStyle = PAL.bone;
  c.beginPath(); c.ellipse(0, headY, 7, 7.6, 0, 0, TAU); c.fill();
  // mandibula
  c.beginPath(); c.moveTo(-5, headY + 4); c.lineTo(5, headY + 4); c.lineTo(3.4, headY + 9); c.lineTo(-3.4, headY + 9); c.closePath(); c.fill();
  c.strokeStyle = rgba('#000000', 0.6); c.lineWidth = 1;
  for (let i = -1; i <= 1; i++) { c.beginPath(); c.moveTo(i * 2.2, headY + 4); c.lineTo(i * 2.2, headY + 9); c.stroke(); }
  // orbitas acesas
  c.globalCompositeOperation = 'lighter';
  c.fillStyle = rgba(p.furyT > 0 ? PAL.crimson : PAL.orange, 0.95);
  c.beginPath(); c.ellipse(-3.2, headY - 0.5, 2.4, 2.8, 0.2, 0, TAU); c.fill();
  c.beginPath(); c.ellipse(3.2, headY - 0.5, 2.4, 2.8, -0.2, 0, TAU); c.fill();
  c.fillStyle = rgba(p.furyT > 0 ? PAL.crimson : PAL.ember, 0.2);
  c.beginPath(); c.arc(0, headY, 9, 0, TAU); c.fill();
  c.globalCompositeOperation = 'source-over';

  /* --- arco do golpe --- */
  if (p.state === 'ATTACK' && p.atk) {
    const a = p.atk;
    const k = clamp((p.atkT - a.active[0]) / (a.active[1] - a.active[0]), 0, 1);
    if (p.atkT >= a.active[0] - 2 && p.atkT <= a.active[1] + 3) {
      const alpha = Math.sin(Math.PI * clamp(k, 0, 1)) * 0.9;
      const r = a.reach * (0.7 + k * 0.45);
      const a0 = -1.5 + a.arc + k * 2.4;
      c.globalCompositeOperation = 'lighter';
      const gg = c.createRadialGradient(6, hipY - 6, r * 0.3, 6, hipY - 6, r);
      gg.addColorStop(0, rgba(PAL.white, 0));
      gg.addColorStop(0.65, rgba(PAL.orange, alpha * 0.5));
      gg.addColorStop(1, rgba(PAL.ember, 0));
      c.fillStyle = gg;
      c.beginPath();
      c.arc(6, hipY - 6, r, a0 - 0.85, a0 + 0.85);
      c.lineTo(6, hipY - 6);
      c.closePath(); c.fill();
      c.strokeStyle = rgba(PAL.white, alpha * 0.8);
      c.lineWidth = 3;
      c.beginPath(); c.arc(6, hipY - 6, r * 0.94, a0 - 0.7, a0 + 0.7); c.stroke();
      c.globalCompositeOperation = 'source-over';
    }
  }

  /* --- asas de fogo ao planar --- */
  if (p.gliding) {
    c.globalCompositeOperation = 'lighter';
    for (let s = -1; s <= 1; s += 2) {
      const gw = c.createLinearGradient(0, hipY - 14, s * 34, hipY - 2);
      gw.addColorStop(0, rgba(PAL.ember, 0.5));
      gw.addColorStop(1, rgba(PAL.orange, 0));
      c.fillStyle = gw;
      c.beginPath();
      c.moveTo(0, hipY - 16);
      c.quadraticCurveTo(s * 26, hipY - 30 + Math.sin(t * 0.2) * 4, s * 36, hipY - 2);
      c.quadraticCurveTo(s * 20, hipY - 6, 0, hipY - 6);
      c.closePath(); c.fill();
    }
    c.globalCompositeOperation = 'source-over';
  }

  /* --- carga do golpe pesado --- */
  if (p.charged) {
    c.globalCompositeOperation = 'lighter';
    const pulse = 0.5 + 0.5 * Math.sin(t * 0.4);
    c.strokeStyle = rgba(PAL.crimson, 0.5 + pulse * 0.4);
    c.lineWidth = 2;
    c.beginPath(); c.arc(0, hipY - 8, 26 + pulse * 5, 0, TAU); c.stroke();
    c.globalCompositeOperation = 'source-over';
  }

  c.globalAlpha = 1;
  c.restore();
}

/** A moto espectral: chassi de osso, rodas em chamas. */
function drawBike(c, p) {
  const t = G.gt;
  c.save();
  c.translate(Math.round(p.cx), Math.round(p.cy));
  c.rotate(p.bike.roll);
  const inv = p.invuln > 0 && Math.floor(t / 3) % 2 === 0;
  c.globalAlpha = inv ? 0.6 : 1;

  // rodas
  c.globalCompositeOperation = 'lighter';
  for (const wx of [-24, 22]) {
    const gg = c.createRadialGradient(wx, 16, 2, wx, 16, 18);
    gg.addColorStop(0, rgba(PAL.white, 0.7));
    gg.addColorStop(0.4, rgba(PAL.orange, 0.6));
    gg.addColorStop(1, rgba(PAL.crimson, 0));
    c.fillStyle = gg;
    c.beginPath(); c.arc(wx, 16, 17, 0, TAU); c.fill();
  }
  c.globalCompositeOperation = 'source-over';
  c.strokeStyle = '#2a1a16'; c.lineWidth = 3;
  for (const wx of [-24, 22]) { c.beginPath(); c.arc(wx, 16, 12, 0, TAU); c.stroke(); }

  // chassi
  c.fillStyle = '#1a1012';
  c.beginPath();
  c.moveTo(-26, 12); c.lineTo(-12, -2); c.lineTo(10, -4); c.lineTo(26, 8); c.lineTo(18, 14); c.lineTo(-18, 16);
  c.closePath(); c.fill();
  c.fillStyle = '#2c1a1c';
  c.beginPath(); c.moveTo(18, 2); c.lineTo(30, -6); c.lineTo(32, 0); c.lineTo(24, 8); c.closePath(); c.fill();

  // cavaleiro
  c.fillStyle = '#120b0c';
  c.beginPath(); c.moveTo(-8, -4); c.lineTo(-4, -22); c.lineTo(6, -22); c.lineTo(8, -4); c.closePath(); c.fill();
  limb(c, 2, -18, 22, -4, 4.5, '#241213');
  limb(c, -6, -6, -12, 8, 5, '#120b0c');
  flame(c, 1, -24, 18, 24, t, PAL.orange, PAL.ember, 0.55);
  c.fillStyle = PAL.bone;
  c.beginPath(); c.ellipse(1, -26, 6, 6.5, 0, 0, TAU); c.fill();
  c.globalCompositeOperation = 'lighter';
  c.fillStyle = rgba(PAL.orange, 0.95);
  c.beginPath(); c.arc(-1, -26, 2, 0, TAU); c.fill();
  c.beginPath(); c.arc(3.6, -26, 2, 0, TAU); c.fill();
  c.globalCompositeOperation = 'source-over';

  c.globalAlpha = 1;
  c.restore();
}

/* ------------------------------------------------------------------------------------------
   Inimigos
   ------------------------------------------------------------------------------------------ */

/**
 * Sombra de contato: uma elipse escura na base ancora a figura no chao.
 * Voadores projetam uma sombra menor e mais fraca no piso do circulo.
 */
function contactShadow(c, ent, flying) {
  const gy = flying ? G.level.groundY : ent.y + ent.h;
  const k = flying ? clamp(1 - (gy - (ent.y + ent.h)) / 300, 0.25, 1) : 1;
  c.fillStyle = rgba('#000000', 0.42 * k);
  c.beginPath();
  c.ellipse(ent.x + ent.w / 2, gy - 1, ent.w * 0.62 * k, 5 * k, 0, 0, TAU);
  c.fill();
}

/**
 * Halos pre-rasterizados, um por cor. Criar e avaliar um gradiente radial por
 * inimigo por quadro custa caro; um drawImage escalado nao.
 */
const _glowCache = new Map();
function glowSprite(col) {
  let s = _glowCache.get(col);
  if (s) return s;
  const S = 128;
  s = document.createElement('canvas');
  s.width = s.height = S;
  const o = s.getContext('2d');
  const g = o.createRadialGradient(S / 2, S / 2, S * 0.05, S / 2, S / 2, S / 2);
  g.addColorStop(0, rgba(col, 1));
  g.addColorStop(0.45, rgba(col, 0.45));
  g.addColorStop(1, rgba(col, 0));
  o.fillStyle = g;
  o.fillRect(0, 0, S, S);
  _glowCache.set(col, s);
  return s;
}

/** Contraluz sutil: separa a silhueta do fundo quase preto. */
function backlight(c, ent, col, amount) {
  // Halo largo e difuso: um raio curto viraria um disco solido sobre sprites
  // pequenos em vez de contornar a silhueta.
  const r = Math.max(ent.w, ent.h) * 1.75;
  const cx = ent.x + ent.w / 2, cy = ent.y + ent.h * 0.55;
  c.globalCompositeOperation = 'lighter';
  c.globalAlpha = amount;
  c.drawImage(glowSprite(col), cx - r, cy - r, r * 2, r * 2);
  c.globalAlpha = 1;
  c.globalCompositeOperation = 'source-over';
}

function drawEnemy(c, e) {
  const t = G.gt;
  const dying = e.souling > 0;
  contactShadow(c, e, e.def.fly);
  backlight(c, e, e.kind === 'coloso' ? PAL.bone : PAL.crimson, e.state === 'TELEGRAPH' ? 0.17 : 0.09);
  c.save();
  c.translate(Math.round(e.cx), Math.round(e.y + e.h));
  c.scale(e.facing, 1);
  if (dying) { c.globalAlpha = clamp(e.souling / 34, 0, 1); c.rotate(0.3 * (1 - e.souling / 34)); }
  if (e.hurtT > 0) c.translate(rnd(-1.5, 1.5), 0);

  const telegraphing = e.state === 'TELEGRAPH';
  const flashAmt = Math.max(e.flash, telegraphing ? 0.55 + 0.45 * Math.sin(t * 0.5) : 0);

  if (e.kind === 'condenado') {
    // corpo curvado, farrapos, garras
    const ph = e.anim * 0.24;
    const run = e.state === 'APPROACH' ? Math.sin(ph) * 0.6 : 0;
    c.fillStyle = '#241c22';
    c.beginPath();
    c.moveTo(-9, 0); c.lineTo(-11, -22); c.lineTo(-4, -32); c.lineTo(7, -31); c.lineTo(11, -20); c.lineTo(9, 0);
    c.closePath(); c.fill();
    limb(c, -3, -6, -4 + run * 9, 0, 5, '#1a1319');
    limb(c, 3, -6, 4 - run * 9, 0, 5, '#221a20');
    const reachA = e.state === 'ATTACK' ? -1.2 : (telegraphing ? -2.0 : 0.5 + run * 0.4);
    limb(c, 4, -26, 4 + Math.sin(reachA) * 17, -26 + Math.cos(reachA) * 17, 4.2, '#2a2028');
    // garras
    c.strokeStyle = PAL.bone; c.lineWidth = 1.6;
    const cxp = 4 + Math.sin(reachA) * 17, cyp = -26 + Math.cos(reachA) * 17;
    for (let i = -1; i <= 1; i++) { c.beginPath(); c.moveTo(cxp, cyp); c.lineTo(cxp + 6, cyp + i * 4); c.stroke(); }
    // capuz e olhos
    c.fillStyle = '#0f0b0e';
    c.beginPath(); c.ellipse(1, -34, 8, 7, 0, 0, TAU); c.fill();
    c.globalCompositeOperation = 'lighter';
    c.fillStyle = rgba(PAL.crimson, 0.95);
    c.beginPath(); c.arc(-2, -34, 1.8, 0, TAU); c.fill();
    c.beginPath(); c.arc(3, -34, 1.8, 0, TAU); c.fill();
    c.globalCompositeOperation = 'source-over';

  } else if (e.kind === 'gargula') {
    // asas batendo, corpo de pedra
    const flap = Math.sin(e.anim * 0.26) * 0.7;
    const diving = e.state === 'ATTACK';
    c.fillStyle = '#3a3540';
    for (let s = -1; s <= 1; s += 2) {
      c.save(); c.translate(s * 6, -18); c.rotate(s * (diving ? -0.9 : flap));
      c.beginPath();
      c.moveTo(0, 0);
      c.lineTo(s * 24, -14); c.lineTo(s * 30, -2); c.lineTo(s * 22, 0); c.lineTo(s * 26, 8); c.lineTo(s * 14, 4);
      c.closePath(); c.fill();
      c.restore();
    }
    c.fillStyle = '#4a4450';
    c.beginPath(); c.ellipse(0, -14, 11, 9, 0, 0, TAU); c.fill();
    c.fillStyle = '#332e38';
    c.beginPath(); c.ellipse(2, -22, 7, 6, 0, 0, TAU); c.fill();
    // chifres
    c.strokeStyle = '#5a5260'; c.lineWidth = 2.4;
    c.beginPath(); c.moveTo(-2, -27); c.lineTo(-6, -33); c.stroke();
    c.beginPath(); c.moveTo(5, -27); c.lineTo(9, -33); c.stroke();
    // garras
    limb(c, -4, -8, -6, 0, 3.4, '#3a3540');
    limb(c, 5, -8, 7, 0, 3.4, '#3a3540');
    c.globalCompositeOperation = 'lighter';
    c.fillStyle = rgba(PAL.crimson, 0.9);
    c.beginPath(); c.arc(0, -23, 1.8, 0, TAU); c.fill();
    c.beginPath(); c.arc(5, -23, 1.8, 0, TAU); c.fill();
    c.globalCompositeOperation = 'source-over';

  } else {
    // Coloso de Osso: costelas, cranio bovino e o escudo frontal
    const sway = Math.sin(e.anim * 0.1) * 2;
    c.fillStyle = '#241f1a';
    c.beginPath();
    c.moveTo(-16, 0); c.lineTo(-20, -34); c.lineTo(-10, -52); c.lineTo(12, -52); c.lineTo(20, -32); c.lineTo(16, 0);
    c.closePath(); c.fill();
    // costelas
    c.strokeStyle = PAL.bone; c.lineWidth = 3;
    for (let i = 0; i < 4; i++) {
      c.beginPath();
      c.arc(0, -18 - i * 8, 13 - i * 1.2, Math.PI * 0.12, Math.PI * 0.88);
      c.stroke();
    }
    // pernas
    limb(c, -7, -6, -9 + sway, 0, 8, '#1c1814');
    limb(c, 7, -6, 9 - sway, 0, 8, '#1c1814');
    // cranio
    c.fillStyle = PAL.bone;
    c.beginPath(); c.ellipse(2, -58, 11, 9, 0, 0, TAU); c.fill();
    c.beginPath(); c.moveTo(6, -54); c.lineTo(16, -50); c.lineTo(6, -47); c.closePath(); c.fill();
    c.strokeStyle = PAL.bone; c.lineWidth = 3;
    c.beginPath(); c.moveTo(-6, -64); c.quadraticCurveTo(-16, -70, -18, -60); c.stroke();
    c.beginPath(); c.moveTo(10, -64); c.quadraticCurveTo(20, -70, 22, -60); c.stroke();
    c.globalCompositeOperation = 'lighter';
    c.fillStyle = rgba(PAL.orange, 0.9);
    c.beginPath(); c.arc(-2, -58, 2.4, 0, TAU); c.fill();
    c.beginPath(); c.arc(6, -58, 2.4, 0, TAU); c.fill();
    c.globalCompositeOperation = 'source-over';
    // martelo
    const swing = e.state === 'ATTACK' ? clamp(e.stateT / 8, 0, 1) : 0;
    c.save(); c.translate(16, -40); c.rotate(-1.2 + swing * 2.2);
    c.strokeStyle = '#3a2c22'; c.lineWidth = 5;
    c.beginPath(); c.moveTo(0, 0); c.lineTo(30, 0); c.stroke();
    c.fillStyle = '#4a3c30'; c.fillRect(26, -10, 16, 20);
    c.restore();
    // escudo
    if (e.shield) {
      c.fillStyle = '#5a5245';
      c.beginPath();
      c.moveTo(-24, -50); c.quadraticCurveTo(-38, -26, -24, -2);
      c.lineTo(-16, -6); c.quadraticCurveTo(-27, -26, -16, -46);
      c.closePath(); c.fill();
      c.fillStyle = PAL.bone;
      c.beginPath(); c.arc(-25, -26, 5, 0, TAU); c.fill();
      c.globalCompositeOperation = 'lighter';
      c.fillStyle = rgba(PAL.bone, 0.14 + 0.1 * Math.sin(t * 0.08));
      c.beginPath(); c.moveTo(-24, -50); c.quadraticCurveTo(-38, -26, -24, -2); c.lineTo(-16, -6); c.quadraticCurveTo(-27, -26, -16, -46); c.closePath(); c.fill();
      c.globalCompositeOperation = 'source-over';
    }
  }

  // flash de telegrafia / dano
  if (flashAmt > 0.02) {
    c.globalCompositeOperation = 'lighter';
    c.fillStyle = rgba(telegraphing ? PAL.crimson : PAL.white, clamp(flashAmt, 0, 1) * 0.5);
    c.beginPath(); c.ellipse(0, -e.h / 2, e.w * 0.7, e.h * 0.62, 0, 0, TAU); c.fill();
    c.globalCompositeOperation = 'source-over';
  }
  // aura do Olhar de Penitencia
  if (e.penitent > 0) {
    c.globalCompositeOperation = 'lighter';
    c.strokeStyle = rgba(PAL.crimson, 0.6);
    c.lineWidth = 2;
    c.beginPath(); c.arc(0, -e.h / 2, e.w * 0.9 + Math.sin(t * 0.3) * 3, 0, TAU); c.stroke();
    c.globalCompositeOperation = 'source-over';
  }

  c.globalAlpha = 1;
  c.restore();

  // barra de vida acima do inimigo
  if (!dying && e.hp < e.maxHp && e.hp > 0) {
    const w = Math.max(28, e.w);
    const x = e.cx - w / 2, y = e.y - 12;
    c.fillStyle = 'rgba(0,0,0,.6)'; c.fillRect(x, y, w, 4);
    c.fillStyle = e.shield ? PAL.bone : PAL.crimson;
    c.fillRect(x, y, w * clamp(e.hp / e.maxHp, 0, 1), 4);
  }
  // prompt de execucao
  if (e.qteReady && !G.qte) {
    const a = 0.5 + 0.5 * Math.sin(t * 0.18);
    textC(c, 'EXECUTAR', e.cx, e.y - 26, 14, rgba(PAL.ember, a), 700, 2);
  }
}

/* ------------------------------------------------------------------------------------------
   Bosses
   ------------------------------------------------------------------------------------------ */

function drawBoss(c, b) {
  const t = G.gt;
  const d = b.bd;
  contactShadow(c, b, b.bd.fly);
  backlight(c, b, d.col2, 0.16);
  c.save();
  c.translate(Math.round(b.cx), Math.round(b.y + b.h));
  c.scale(b.facing, 1);
  if (b.souling > 0) { c.globalAlpha = clamp(b.souling / 40, 0, 1); c.rotate(0.5 * (1 - b.souling / 40)); }
  if (b.hurtT > 0) c.translate(rnd(-2, 2), rnd(-1, 1));

  const H = b.h, W = b.w;

  if (b.kind === 'luxuria') {
    // silhueta feminina flutuante, cabelo de fogo, asas de fumaca
    const fl = Math.sin(t * 0.05) * 4;
    c.globalCompositeOperation = 'lighter';
    for (let s = -1; s <= 1; s += 2) {
      const gg = c.createLinearGradient(0, -H * 0.7, s * 90, -H * 0.2);
      gg.addColorStop(0, rgba(d.col, 0.4)); gg.addColorStop(1, rgba(d.col2, 0));
      c.fillStyle = gg;
      c.beginPath();
      c.moveTo(0, -H * 0.72);
      c.quadraticCurveTo(s * 70, -H * (1.0 + Math.sin(t * 0.04) * 0.1), s * 96, -H * 0.2);
      c.quadraticCurveTo(s * 44, -H * 0.42, 0, -H * 0.5);
      c.closePath(); c.fill();
    }
    c.globalCompositeOperation = 'source-over';
    // corpo
    c.fillStyle = '#2a0a16';
    c.beginPath();
    c.moveTo(-W * 0.2, 0);
    c.quadraticCurveTo(-W * 0.34, -H * 0.5, -W * 0.16, -H * 0.72);
    c.lineTo(W * 0.16, -H * 0.72);
    c.quadraticCurveTo(W * 0.34, -H * 0.5, W * 0.2, 0);
    c.closePath(); c.fill();
    // cauda de vestido em brasa
    c.globalCompositeOperation = 'lighter';
    const gt2 = c.createLinearGradient(0, -H * 0.2, 0, 20 + fl);
    gt2.addColorStop(0, rgba(d.col, 0.5)); gt2.addColorStop(1, rgba(d.col2, 0));
    c.fillStyle = gt2;
    c.beginPath(); c.moveTo(-W * 0.2, 0); c.quadraticCurveTo(0, 26 + fl, W * 0.2, 0); c.closePath(); c.fill();
    c.globalCompositeOperation = 'source-over';
    // bracos
    limb(c, -W * 0.16, -H * 0.62, -W * 0.5, -H * 0.42 + fl, 6, '#3a1020');
    limb(c, W * 0.16, -H * 0.62, W * 0.5, -H * 0.42 - fl, 6, '#3a1020');
    // cabeca + cabelo de fogo
    flame(c, 0, -H * 0.78, 46, 54, t, d.col, d.col2, 0.6);
    c.fillStyle = PAL.bone;
    c.beginPath(); c.ellipse(0, -H * 0.8, 12, 14, 0, 0, TAU); c.fill();
    c.globalCompositeOperation = 'lighter';
    c.fillStyle = rgba(d.col2, 0.95);
    c.beginPath(); c.ellipse(-4.6, -H * 0.81, 3, 3.6, 0, 0, TAU); c.fill();
    c.beginPath(); c.ellipse(4.6, -H * 0.81, 3, 3.6, 0, 0, TAU); c.fill();
    c.globalCompositeOperation = 'source-over';

  } else if (b.kind === 'violentia') {
    // minotauro maciço
    const breathe = Math.sin(t * 0.06) * 2;
    c.fillStyle = '#2a0808';
    c.beginPath();
    c.moveTo(-W * 0.34, 0); c.lineTo(-W * 0.42, -H * 0.5);
    c.lineTo(-W * 0.24, -H * 0.78); c.lineTo(W * 0.24, -H * 0.78);
    c.lineTo(W * 0.44, -H * 0.46); c.lineTo(W * 0.36, 0);
    c.closePath(); c.fill();
    // musculatura em brasa
    c.globalCompositeOperation = 'lighter';
    c.strokeStyle = rgba(PAL.crimson, 0.28); c.lineWidth = 3;
    for (let i = 0; i < 4; i++) {
      c.beginPath(); c.moveTo(-W * 0.28, -H * (0.2 + i * 0.14)); c.lineTo(W * 0.3, -H * (0.24 + i * 0.14)); c.stroke();
    }
    c.globalCompositeOperation = 'source-over';
    // pernas
    limb(c, -W * 0.16, -H * 0.16, -W * 0.22, 0, 18, '#1c0505');
    limb(c, W * 0.16, -H * 0.16, W * 0.22, 0, 18, '#1c0505');
    // bracos + machado
    limb(c, -W * 0.3, -H * 0.66, -W * 0.5, -H * 0.3 + breathe, 12, '#240707');
    const swing = b.act === 'slam' ? clamp((b.actT - 30) / 12, 0, 1) : 0;
    c.save(); c.translate(W * 0.32, -H * 0.66); c.rotate(-2.0 + swing * 2.6);
    limb(c, 0, 0, 40, 0, 12, '#240707');
    c.strokeStyle = '#3a2c22'; c.lineWidth = 7;
    c.beginPath(); c.moveTo(36, 0); c.lineTo(76, 0); c.stroke();
    c.fillStyle = '#584b3c';
    c.beginPath(); c.moveTo(66, -26); c.lineTo(92, -6); c.lineTo(66, 26); c.quadraticCurveTo(78, 0, 66, -26); c.fill();
    c.restore();
    // cabeca de touro
    c.fillStyle = '#1c0505';
    c.beginPath(); c.ellipse(6, -H * 0.86, 20, 16, 0, 0, TAU); c.fill();
    c.beginPath(); c.moveTo(16, -H * 0.86); c.lineTo(38, -H * 0.82); c.lineTo(16, -H * 0.76); c.closePath(); c.fill();
    c.strokeStyle = PAL.bone; c.lineWidth = 6; c.lineCap = 'round';
    c.beginPath(); c.moveTo(-6, -H * 0.94); c.quadraticCurveTo(-30, -H * 1.06, -18, -H * 0.82); c.stroke();
    c.beginPath(); c.moveTo(18, -H * 0.94); c.quadraticCurveTo(42, -H * 1.06, 30, -H * 0.82); c.stroke();
    c.globalCompositeOperation = 'lighter';
    c.fillStyle = rgba(PAL.orange, 0.95);
    c.beginPath(); c.arc(2, -H * 0.88, 3.4, 0, TAU); c.fill();
    c.beginPath(); c.arc(13, -H * 0.88, 3.4, 0, TAU); c.fill();
    if (b.phase >= 2) { flame(c, 6, -H * 0.98, 40, 40, t, PAL.crimson, PAL.orange, 0.5); }
    c.globalCompositeOperation = 'source-over';

  } else {
    // Imperator Gelidus: gigante de gelo de tres cabecas
    const shimmer = 0.5 + 0.5 * Math.sin(t * 0.04);
    c.fillStyle = '#0e2634';
    c.beginPath();
    c.moveTo(-W * 0.36, 0); c.lineTo(-W * 0.46, -H * 0.44);
    c.lineTo(-W * 0.26, -H * 0.7); c.lineTo(W * 0.26, -H * 0.7);
    c.lineTo(W * 0.46, -H * 0.44); c.lineTo(W * 0.36, 0);
    c.closePath(); c.fill();
    c.globalCompositeOperation = 'lighter';
    c.fillStyle = rgba(d.col2, 0.1 + shimmer * 0.08);
    c.beginPath();
    c.moveTo(-W * 0.36, 0); c.lineTo(-W * 0.46, -H * 0.44); c.lineTo(-W * 0.26, -H * 0.7);
    c.lineTo(W * 0.26, -H * 0.7); c.lineTo(W * 0.46, -H * 0.44); c.lineTo(W * 0.36, 0);
    c.closePath(); c.fill();
    c.globalCompositeOperation = 'source-over';
    // pernas presas no gelo
    limb(c, -W * 0.18, -H * 0.14, -W * 0.22, 0, 20, '#0a1c28');
    limb(c, W * 0.18, -H * 0.14, W * 0.22, 0, 20, '#0a1c28');
    // asas de morcego congeladas
    for (let s = -1; s <= 1; s += 2) {
      c.save(); c.translate(s * W * 0.3, -H * 0.6); c.rotate(s * (0.3 + Math.sin(t * 0.03) * 0.12));
      c.fillStyle = 'rgba(20,50,70,.75)';
      c.beginPath();
      c.moveTo(0, 0); c.lineTo(s * 66, -34); c.lineTo(s * 84, -6);
      c.lineTo(s * 62, -2); c.lineTo(s * 70, 22); c.lineTo(s * 34, 8);
      c.closePath(); c.fill();
      c.restore();
    }
    // bracos
    limb(c, -W * 0.3, -H * 0.6, -W * 0.52, -H * 0.24, 13, '#0c2130');
    limb(c, W * 0.3, -H * 0.6, W * 0.52, -H * 0.24, 13, '#0c2130');
    // tres cabecas
    const heads = [[-24, -H * 0.8, 13], [4, -H * 0.88, 17], [32, -H * 0.8, 13]];
    for (let i = 0; i < heads.length; i++) {
      const hx = heads[i][0], hy = heads[i][1], hr = heads[i][2];
      c.fillStyle = '#132f40';
      c.beginPath(); c.ellipse(hx, hy, hr, hr * 1.1, 0, 0, TAU); c.fill();
      c.fillStyle = '#0a1a24';
      c.beginPath(); c.ellipse(hx + hr * 0.4, hy + hr * 0.36, hr * 0.6, hr * 0.4, 0, 0, TAU); c.fill();
      c.globalCompositeOperation = 'lighter';
      c.fillStyle = rgba(d.col2, 0.9);
      c.beginPath(); c.arc(hx - hr * 0.3, hy - hr * 0.1, 2.6, 0, TAU); c.fill();
      c.beginPath(); c.arc(hx + hr * 0.3, hy - hr * 0.1, 2.6, 0, TAU); c.fill();
      c.globalCompositeOperation = 'source-over';
      // estalactites na cabeca
      c.fillStyle = rgba(d.col2, 0.5);
      c.beginPath(); c.moveTo(hx - 5, hy - hr); c.lineTo(hx, hy - hr - 14); c.lineTo(hx + 5, hy - hr); c.closePath(); c.fill();
    }
    if (b.act === 'breath' && b.actT > 40) {
      c.globalCompositeOperation = 'lighter';
      const gb = c.createLinearGradient(0, -H * 0.6, 240, -H * 0.6);
      gb.addColorStop(0, rgba('#CFEBFF', 0.34)); gb.addColorStop(1, rgba('#CFEBFF', 0));
      c.fillStyle = gb;
      c.beginPath(); c.moveTo(30, -H * 0.66); c.lineTo(250, -H * 0.9); c.lineTo(250, -H * 0.28); c.lineTo(30, -H * 0.56); c.closePath(); c.fill();
      c.globalCompositeOperation = 'source-over';
    }
  }

  // flash
  if (b.flash > 0.02) {
    c.globalCompositeOperation = 'lighter';
    c.fillStyle = rgba(b.invuln > 0 ? PAL.white : d.col2, clamp(b.flash, 0, 1) * 0.34);
    c.beginPath(); c.ellipse(0, -H / 2, W * 0.7, H * 0.6, 0, 0, TAU); c.fill();
    c.globalCompositeOperation = 'source-over';
  }
  c.globalAlpha = 1;
  c.restore();
}

   Iluminacao e pos-processamento
   ------------------------------------------------------------------------------------------ */

/** Vinheta pre-renderizada uma unica vez. */
const vignette = (function () {
  const oc = document.createElement('canvas');
  oc.width = RW; oc.height = RH;
  const o = oc.getContext('2d');
  const g = o.createRadialGradient(RW / 2, RH / 2, RH * 0.32, RW / 2, RH / 2, RH * 0.92);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(0.7, 'rgba(0,0,0,.42)');
  g.addColorStop(1, 'rgba(0,0,0,.86)');
  o.fillStyle = g; o.fillRect(0, 0, RW, RH);
  return oc;
})();

/** Luz radial acompanhando CINZA, em modo aditivo. */
function drawLighting(c, p) {
  if (!QUALITY.lighting) return;
  const sx = (p.cx - cam.x - RW / 2) * cam.zoom + RW / 2 + cam.sx * cam.zoom;
  const sy = (p.cy - cam.y - RH / 2) * cam.zoom + RH / 2 + cam.sy * cam.zoom;
  const r = (170 + Math.sin(G.gt * 0.07) * 12 + (p.furyT > 0 ? 90 : 0)) * cam.zoom;
  const g = c.createRadialGradient(sx, sy, 8, sx, sy, r);
  const col = p.furyT > 0 ? PAL.crimson : PAL.orange;
  g.addColorStop(0, rgba(col, 0.17));
  g.addColorStop(0.45, rgba(col, 0.09));
  g.addColorStop(1, 'rgba(0,0,0,0)');
  c.globalCompositeOperation = 'lighter';
  c.fillStyle = g;
  c.fillRect(0, 0, RW, RH);
  c.globalCompositeOperation = 'source-over';
}

function drawPost(c) {
  // filtro negativo do Olhar de Penitencia
  if (G.negative > 0.01) {
    c.save();
    c.globalAlpha = G.negative * 0.92;
    c.globalCompositeOperation = 'difference';
    c.fillStyle = '#ffffff';
    c.fillRect(0, 0, RW, RH);
    c.globalCompositeOperation = 'source-over';
    c.globalAlpha = G.negative * 0.3;
    c.fillStyle = PAL.blood;
    c.fillRect(0, 0, RW, RH);
    c.restore();
    G.negative = Math.max(0, G.negative - 0.02);
  }

  // vinheta
  c.drawImage(vignette, 0, 0, RW, RH);

  // dano: pulso vermelho nas bordas + distorcao
  if (G.damageFx > 0.01) {
    const a = G.damageFx;
    const g = c.createRadialGradient(RW / 2, RH / 2, RH * 0.2, RW / 2, RH / 2, RH * 0.85);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, rgba(PAL.blood, 0.72 * a));
    c.fillStyle = g;
    c.fillRect(0, 0, RW, RH);
    // linhas de deslocamento cromatico
    c.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 5; i++) {
      const y = (G.gt * 13 + i * 97) % RH;
      c.fillStyle = rgba(PAL.crimson, 0.1 * a);
      c.fillRect(0, y, RW, 2);
    }
    c.globalCompositeOperation = 'source-over';
    G.damageFx = Math.max(0, G.damageFx - 0.035);
  }

  // flash branco
  if (G.whiteFlash > 0.01) {
    c.fillStyle = rgba(PAL.white, G.whiteFlash * 0.85);
    c.fillRect(0, 0, RW, RH);
    G.whiteFlash = Math.max(0, G.whiteFlash - 0.08);
  }

  // vida critica: batimento vermelho
  const p = G.player;
  if (p && !p.dead && p.hp / p.maxHp < 0.25) {
    const beat = 0.14 + 0.1 * Math.sin(G.gt * 0.12);
    const g = c.createRadialGradient(RW / 2, RH / 2, RH * 0.3, RW / 2, RH / 2, RH * 0.9);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, rgba(PAL.blood, beat));
    c.fillStyle = g; c.fillRect(0, 0, RW, RH);
  }
}

/** Botao retangular reutilizado por todos os menus. */
function uiButton(c, b, label, opt) {
  opt = opt || {};
  const hot = opt.hot;
  const dis = opt.disabled;
  c.save();
  c.globalAlpha = dis ? 0.4 : 1;
  // moldura
  c.fillStyle = hot ? rgba(PAL.orange, 0.22) : 'rgba(10,6,8,.78)';
  c.fillRect(b.x, b.y, b.w, b.h);
  c.strokeStyle = hot ? PAL.orange : rgba(PAL.bone, 0.34);
  c.lineWidth = 2;
  c.strokeRect(b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1);
  // chanfro decorativo
  c.fillStyle = hot ? PAL.orange : rgba(PAL.bone, 0.34);
  c.fillRect(b.x, b.y, 4, 12); c.fillRect(b.x + b.w - 4, b.y + b.h - 12, 4, 12);
  const cy = opt.sub ? b.y + b.h * 0.38 : b.y + b.h / 2;
  textC(c, label, b.x + b.w / 2, cy, opt.size || 20, dis ? PAL.ash : PAL.bone, 700, 2);
  if (opt.sub) textC(c, opt.sub, b.x + b.w / 2, b.y + b.h * 0.72, 12, opt.subCol || PAL.ash, 400, 1);
  c.restore();
}

/** Testa se algum toque deste frame caiu dentro do retangulo. */
function tapped(b) {
  for (let i = 0; i < IN.taps.length; i++) {
    const t = IN.taps[i];
    if (t.x < 0) continue;
    if (t.x >= b.x && t.x <= b.x + b.w && t.y >= b.y && t.y <= b.y + b.h) return true;
  }
  return false;
}
/** Toque em qualquer lugar (avancar cutscene, etc). */
function tappedAnywhere() {
  for (let i = 0; i < IN.taps.length; i++) if (IN.taps[i].x >= 0) return true;
  return IN.taps.length > 0;
}

/* ---- controles na tela ---- */

function drawTouchControls(c) {
  if (!IN.hasTouch && !IN.lastInputWasTouch) return;
  const st = IN.stick;

  // joystick
  if (st.active) {
    c.globalCompositeOperation = 'lighter';
    c.strokeStyle = rgba(PAL.orange, 0.28); c.lineWidth = 3;
    c.beginPath(); c.arc(st.ox, st.oy, 62, 0, TAU); c.stroke();
    c.strokeStyle = rgba(PAL.bone, 0.14); c.lineWidth = 1.5;
    c.beginPath(); c.arc(st.ox, st.oy, 62 * 0.12, 0, TAU); c.stroke();
    const kx = st.ox + st.kx, ky = st.oy + st.ky;
    const g = c.createRadialGradient(kx, ky, 2, kx, ky, 26);
    g.addColorStop(0, rgba(PAL.ember, 0.7));
    g.addColorStop(1, rgba(PAL.orange, 0));
    c.fillStyle = g;
    c.beginPath(); c.arc(kx, ky, 26, 0, TAU); c.fill();
    c.globalCompositeOperation = 'source-over';
    c.strokeStyle = rgba(PAL.bone, 0.6); c.lineWidth = 2;
    c.beginPath(); c.arc(kx, ky, 22, 0, TAU); c.stroke();
  } else {
    // dica discreta de onde nasce o joystick
    c.strokeStyle = rgba(PAL.bone, 0.1); c.lineWidth = 2;
    c.beginPath(); c.arc(130, 430, 54, 0, TAU); c.stroke();
    textC(c, 'MOVER', 130, 430, 12, rgba(PAL.bone, 0.16), 700, 3);
  }

  // botoes
  const p = G.player;
  for (const k in BTN) {
    const b = BTN[k];
    const st2 = IN.btn[k];
    const pressed = st2.down;
    let ready = true, fill = rgba(PAL.bone, 0.06), edge = rgba(PAL.bone, 0.3);
    if (k === 'fury') {
      ready = p && p.fury >= CFG.furyMax;
      if (ready) { fill = rgba(PAL.crimson, 0.22 + 0.1 * Math.sin(G.gt * 0.16)); edge = PAL.crimson; }
    } else if (k === 'chain') {
      ready = !p || (p.chain.state === 'idle' && p.chain.cd <= 0);
      edge = ready ? rgba(PAL.ember, 0.6) : rgba(PAL.bone, 0.2);
    } else if (k === 'attack') {
      edge = rgba(PAL.orange, 0.7);
    }
    const r = b.r * (pressed ? 0.92 : 1);
    c.fillStyle = pressed ? rgba(PAL.orange, 0.32) : fill;
    c.beginPath(); c.arc(b.x, b.y, r, 0, TAU); c.fill();
    c.strokeStyle = edge; c.lineWidth = pressed ? 4 : 2.4;
    c.beginPath(); c.arc(b.x, b.y, r, 0, TAU); c.stroke();
    if (st2.flash > 0.02) {
      c.globalCompositeOperation = 'lighter';
      c.fillStyle = rgba(PAL.ember, st2.flash * 0.5);
      c.beginPath(); c.arc(b.x, b.y, r * 1.25, 0, TAU); c.fill();
      c.globalCompositeOperation = 'source-over';
    }
    drawBtnIcon(c, k, b.x, b.y, r, ready);
  }

  // barra de carga do golpe pesado no botao de ataque
  if (p && p.chargeT > 0) {
    const k = clamp(p.chargeT / 26, 0, 1);
    const b = BTN.attack;
    c.strokeStyle = p.charged ? PAL.crimson : PAL.ember;
    c.lineWidth = 5;
    c.beginPath(); c.arc(b.x, b.y, b.r + 8, -Math.PI / 2, -Math.PI / 2 + TAU * k); c.stroke();
  }
  // cooldown da corrente
  if (p && p.chain.state !== 'idle') {
    const b = BTN.chain;
    c.strokeStyle = rgba(PAL.orange, 0.6); c.lineWidth = 4;
    c.beginPath(); c.arc(b.x, b.y, b.r + 6, -Math.PI / 2, -Math.PI / 2 + TAU * 0.8); c.stroke();
  }

  // botao de pausa
  c.strokeStyle = rgba(PAL.bone, 0.4); c.lineWidth = 2;
  c.beginPath(); c.arc(PAUSE_BTN.x, PAUSE_BTN.y, PAUSE_BTN.r, 0, TAU); c.stroke();
  c.fillStyle = rgba(PAL.bone, 0.7);
  c.fillRect(PAUSE_BTN.x - 7, PAUSE_BTN.y - 8, 5, 16);
  c.fillRect(PAUSE_BTN.x + 2, PAUSE_BTN.y - 8, 5, 16);
}

/** Icones vetoriais dos botoes de acao. */
function drawBtnIcon(c, k, x, y, r, ready) {
  c.save();
  c.translate(x, y);
  const col = ready ? PAL.bone : PAL.ash;
  c.strokeStyle = col; c.fillStyle = col; c.lineWidth = 3; c.lineCap = 'round';
  if (k === 'attack') {
    // espada em chamas
    c.rotate(-0.7);
    c.beginPath(); c.moveTo(0, 16); c.lineTo(0, -18); c.stroke();
    c.beginPath(); c.moveTo(-9, 6); c.lineTo(9, 6); c.stroke();
    c.beginPath(); c.moveTo(-4, -18); c.lineTo(0, -26); c.lineTo(4, -18); c.closePath(); c.fill();
  } else if (k === 'jump') {
    c.beginPath(); c.moveTo(0, 13); c.lineTo(0, -11); c.stroke();
    c.beginPath(); c.moveTo(-9, -3); c.lineTo(0, -14); c.lineTo(9, -3); c.stroke();
  } else if (k === 'chain') {
    for (let i = 0; i < 3; i++) {
      c.beginPath();
      c.ellipse(-11 + i * 11, 0, 5.5, 8, i % 2 ? 0.6 : -0.6, 0, TAU);
      c.lineWidth = 2.6; c.stroke();
    }
  } else {
    // olho de penitencia
    c.beginPath();
    c.moveTo(-15, 0); c.quadraticCurveTo(0, -13, 15, 0); c.quadraticCurveTo(0, 13, -15, 0);
    c.closePath(); c.lineWidth = 2.6; c.stroke();
    c.beginPath(); c.arc(0, 0, 5, 0, TAU); c.fill();
  }
  c.restore();
  textC(c, k === 'attack' ? 'ATK' : (k === 'jump' ? 'PULO' : (k === 'chain' ? 'COR' : 'FUR')),
        x, y + r - 9, 10, rgba(col, 0.7), 700, 1.5);
}

/* ---- HUD ---- */

const STANCE_BTN = { x: 26, y: 86, w: 172, h: 28 };

function drawHUD(c) {
  const p = G.player;
  if (!p) return;

  /* --- barra de vida em formato de lamina --- */
  const hpK = clamp(p.hp / p.maxHp, 0, 1);
  const bx = 26, by = 26, bw = 250, bh = 26;
  c.save();
  // sombra da lamina
  c.beginPath();
  c.moveTo(bx, by); c.lineTo(bx + bw, by); c.lineTo(bx + bw + 26, by + bh / 2);
  c.lineTo(bx + bw, by + bh); c.lineTo(bx, by + bh); c.closePath();
  c.fillStyle = 'rgba(0,0,0,.66)'; c.fill();
  c.save(); c.clip();
  const g = c.createLinearGradient(bx, 0, bx + bw + 26, 0);
  g.addColorStop(0, hpK < 0.25 ? '#5a0000' : '#7a1005');
  g.addColorStop(0.6, hpK < 0.25 ? PAL.blood : PAL.crimson);
  g.addColorStop(1, hpK < 0.25 ? PAL.crimson : PAL.orange);
  c.fillStyle = g;
  c.fillRect(bx, by, (bw + 26) * hpK, bh);
  // brilho animado na lamina
  c.globalCompositeOperation = 'lighter';
  c.fillStyle = rgba(PAL.ember, 0.18);
  c.fillRect(bx, by, (bw + 26) * hpK, 4);
  c.globalCompositeOperation = 'source-over';
  c.restore();
  c.strokeStyle = rgba(PAL.bone, 0.5); c.lineWidth = 2;
  c.beginPath();
  c.moveTo(bx, by); c.lineTo(bx + bw, by); c.lineTo(bx + bw + 26, by + bh / 2);
  c.lineTo(bx + bw, by + bh); c.lineTo(bx, by + bh); c.closePath();
  c.stroke();
  textL(c, 'VITA', bx + 8, by + bh / 2, 13, rgba(PAL.bone, 0.7), 700);
  textR(c, Math.max(0, Math.ceil(p.hp)) + '/' + Math.round(p.maxHp), bx + bw - 6, by + bh / 2, 14, PAL.bone, 700);
  c.restore();

  /* --- barra de furia --- */
  const fK = clamp(p.fury / CFG.furyMax, 0, 1);
  const fx = 30, fy = 58, fw = 210, fh = 12;
  c.fillStyle = 'rgba(0,0,0,.66)';
  c.beginPath();
  c.moveTo(fx, fy); c.lineTo(fx + fw, fy); c.lineTo(fx + fw + 14, fy + fh); c.lineTo(fx, fy + fh); c.closePath(); c.fill();
  c.save();
  c.beginPath();
  c.moveTo(fx, fy); c.lineTo(fx + fw, fy); c.lineTo(fx + fw + 14, fy + fh); c.lineTo(fx, fy + fh); c.closePath();
  c.clip();
  const fg = c.createLinearGradient(fx, 0, fx + fw, 0);
  fg.addColorStop(0, '#3a0000'); fg.addColorStop(1, fK >= 1 ? PAL.ember : PAL.crimson);
  c.fillStyle = fg;
  c.fillRect(fx, fy, (fw + 14) * fK, fh);
  if (fK >= 1) {
    c.globalCompositeOperation = 'lighter';
    c.fillStyle = rgba(PAL.ember, 0.2 + 0.2 * Math.sin(G.gt * 0.2));
    c.fillRect(fx, fy, fw + 14, fh);
    c.globalCompositeOperation = 'source-over';
  }
  c.restore();
  c.strokeStyle = rgba(PAL.bone, 0.34); c.lineWidth = 1.4;
  c.beginPath();
  c.moveTo(fx, fy); c.lineTo(fx + fw, fy); c.lineTo(fx + fw + 14, fy + fh); c.lineTo(fx, fy + fh); c.closePath(); c.stroke();
  textL(c, fK >= 1 ? 'FURIA PRONTA' : 'FURIA', fx + 6, fy + fh / 2 + 1, 10, fK >= 1 ? PAL.ember : rgba(PAL.bone, 0.6), 700);

  /* --- postura PUNIR / ABSOLVER --- */
  const sb = STANCE_BTN;
  const punir = G.stance === 'punir';
  c.fillStyle = 'rgba(6,4,6,.7)';
  c.fillRect(sb.x, sb.y, sb.w, sb.h);
  c.strokeStyle = punir ? PAL.crimson : PAL.soul;
  c.lineWidth = 2;
  c.strokeRect(sb.x + 0.5, sb.y + 0.5, sb.w - 1, sb.h - 1);
  c.fillStyle = punir ? rgba(PAL.crimson, 0.2) : rgba(PAL.soul, 0.16);
  c.fillRect(sb.x, sb.y, sb.w, sb.h);
  textL(c, punir ? 'PUNIR' : 'ABSOLVER', sb.x + 10, sb.y + sb.h / 2, 15, punir ? PAL.crimson : PAL.soul, 700);
  textR(c, punir ? '+ALMAS +FURIA' : '+VIDA', sb.x + sb.w - 8, sb.y + sb.h / 2, 10, rgba(PAL.bone, 0.6), 400);

  /* --- contador de almas --- */
  const t = G.gt;
  c.globalCompositeOperation = 'lighter';
  c.fillStyle = rgba(PAL.soul, 0.16);
  c.beginPath(); c.arc(RW - 148, 34, 13 + Math.sin(t * 0.1) * 1.6, 0, TAU); c.fill();
  c.globalCompositeOperation = 'source-over';
  c.fillStyle = PAL.soul;
  c.beginPath(); c.arc(RW - 148, 34, 5, 0, TAU); c.fill();
  textR(c, ('' + G.souls).padStart(4, '0'), RW - 58, 34, 26, PAL.bone, 700);
  textR(c, 'ALMAS', RW - 58, 52, 10, rgba(PAL.bone, 0.5), 400);

  /* --- contador de combo --- */
  if (G.combo > 1) {
    const k = clamp(G.comboTimer / CFG.comboWindow, 0, 1);
    const sc = 1 + G.comboScale * 0.5 + Math.min(G.combo, 30) * 0.012;
    const jitter = G.comboScale * 4;
    c.save();
    c.translate(RW - 96 + rnd(-jitter, jitter), 132 + rnd(-jitter, jitter));
    c.scale(sc, sc);
    const col = G.combo >= 20 ? PAL.crimson : (G.combo >= 10 ? PAL.ember : PAL.bone);
    textC(c, '' + G.combo, 0, 0, 46, col, 700);
    textC(c, 'GOLPES', 0, 28, 13, rgba(PAL.bone, 0.6), 700, 3);
    c.restore();
    // anel de tempo restante
    c.strokeStyle = rgba(col2ForCombo(), 0.5); c.lineWidth = 3;
    c.beginPath(); c.arc(RW - 96, 132, 46, -Math.PI / 2, -Math.PI / 2 + TAU * k); c.stroke();
  }

  /* --- barra do boss --- */
  const b = G.boss;
  if (b && b.alive) {
    const w = 520, x = RW / 2 - w / 2, y = 42;
    const k = clamp(b.hp / b.maxHp, 0, 1);
    c.fillStyle = 'rgba(0,0,0,.7)';
    c.fillRect(x - 2, y - 2, w + 4, 16);
    c.fillStyle = rgba(b.bd.col, 0.9);
    c.fillRect(x, y, w * k, 12);
    c.globalCompositeOperation = 'lighter';
    c.fillStyle = rgba(b.bd.col2, 0.3);
    c.fillRect(x, y, w * k, 4);
    c.globalCompositeOperation = 'source-over';
    // marcas de fase em 66% e 33%
    c.fillStyle = rgba(PAL.bone, 0.6);
    c.fillRect(x + w * 0.66, y - 3, 2, 18);
    c.fillRect(x + w * 0.33, y - 3, 2, 18);
    c.strokeStyle = rgba(PAL.bone, 0.5); c.lineWidth = 1.5;
    c.strokeRect(x - 0.5, y - 0.5, w + 1, 13);
    textC(c, b.bd.latin, RW / 2, y - 14, 20, PAL.bone, 700, 4);
    textC(c, b.bd.sub, RW / 2, y + 26, 11, rgba(PAL.bone, 0.45), 400, 2);
  }

  /* --- dica de tutorial --- */
  if (G.hint) {
    const w = 470;
    c.fillStyle = 'rgba(4,3,5,.72)';
    c.fillRect(RW / 2 - w / 2, RH - 96, w, 30);
    c.strokeStyle = rgba(PAL.orange, 0.4); c.lineWidth = 1.5;
    c.strokeRect(RW / 2 - w / 2, RH - 96, w, 30);
    textC(c, G.hint, RW / 2, RH - 81, 15, PAL.bone, 700, 1.5);
  }

  /* --- fase da moto: distancia --- */
  if (G.level && G.level.mode === 'bike') {
    const k = clamp(G.bikeDist / G.bikeGoal, 0, 1);
    const w = 300, x = RW / 2 - w / 2, y = RH - 44;
    c.fillStyle = 'rgba(0,0,0,.6)'; c.fillRect(x, y, w, 10);
    c.fillStyle = PAL.orange; c.fillRect(x, y, w * k, 10);
    c.strokeStyle = rgba(PAL.bone, 0.4); c.lineWidth = 1.4; c.strokeRect(x - .5, y - .5, w + 1, 11);
    textC(c, 'RIO DE SANGUE  ' + Math.round(k * 100) + '%', RW / 2, y - 12, 13, PAL.bone, 700, 2);
    // icone da moto correndo na barra
    c.fillStyle = PAL.ember;
    c.beginPath(); c.arc(x + w * k, y + 5, 5, 0, TAU); c.fill();
  }

  /* --- nome do circulo no comeco da fase --- */
  if (G.t < 190 && G.state === 'GAMEPLAY' && !G.boss) {
    const a = G.t < 40 ? G.t / 40 : (G.t > 150 ? (190 - G.t) / 40 : 1);
    c.globalAlpha = clamp(a, 0, 1);
    textC(c, G.level.latin, RW / 2, RH / 2 - 46, 16, rgba(PAL.bone, 0.6), 400, 8);
    textC(c, G.level.name, RW / 2, RH / 2 - 8, 58, PAL.orange, 700, 8);
    textC(c, G.level.sub, RW / 2, RH / 2 + 34, 14, rgba(PAL.bone, 0.55), 400, 3);
    c.globalAlpha = 1;
  }
}

function col2ForCombo() {
  return G.combo >= 20 ? PAL.crimson : (G.combo >= 10 ? PAL.ember : PAL.bone);
}

/* ---- QTE ---- */
function drawQTE(c) {
  const q = G.qte;
  if (!q) return;
  const t = q.target;
  const sx = (t.cx - cam.x - RW / 2) * cam.zoom + RW / 2 + cam.sx * cam.zoom;
  const sy = (t.cy - cam.y - RH / 2) * cam.zoom + RH / 2 + cam.sy * cam.zoom;

  if (q.resolved === 0) {
    // anel-alvo fixo
    c.strokeStyle = rgba(PAL.bone, 0.5); c.lineWidth = 3;
    c.beginPath(); c.arc(sx, sy, q.targetR, 0, TAU); c.stroke();
    c.strokeStyle = rgba(PAL.ember, 0.28); c.lineWidth = q.tol * 2;
    c.beginPath(); c.arc(sx, sy, q.targetR, 0, TAU); c.stroke();
    // circulo que encolhe
    const near = Math.abs(q.r - q.targetR) <= q.tol;
    c.strokeStyle = near ? PAL.ember : PAL.crimson;
    c.lineWidth = 5;
    c.beginPath(); c.arc(sx, sy, q.r, 0, TAU); c.stroke();
    c.globalCompositeOperation = 'lighter';
    c.strokeStyle = rgba(near ? PAL.ember : PAL.crimson, 0.4);
    c.lineWidth = 12;
    c.beginPath(); c.arc(sx, sy, q.r, 0, TAU); c.stroke();
    c.globalCompositeOperation = 'source-over';
    textC(c, 'TOQUE AGORA', sx, sy - q.targetR - 34, 22, near ? PAL.ember : PAL.bone, 700, 3);
  } else if (q.resolved === 1) {
    // barras cinematograficas + texto
    c.fillStyle = '#000';
    c.fillRect(0, 0, RW, 46); c.fillRect(0, RH - 46, RW, 46);
    const a = clamp(q.holdT / 12, 0, 1);
    c.globalAlpha = a;
    textC(c, 'EXECUCAO', RW / 2, 24, 26, PAL.crimson, 700, 8);
    c.globalAlpha = 1;
  }
}
